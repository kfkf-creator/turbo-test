["2406",2,1,"Quina és la funció principal d'una bomba centrífuga de doble entrada?",["Augmentar l'altura d'elevació.","Reduir les pèrdues hidràuliques.","Augmentar el cabal del circuit.","Millorar l'eficiència volumètrica."],2,"La doble entrada equival a dues bombes en paral·lel al mateix eix: més cabal (i a més compensa l’empenta axial). Per a més altura es fa servir la multicel·lular."],
["2406",3,3,"La figura mostra la corba característica d’una bomba centrífuga per diferents diàmetres de rodet. També es mostren les isolínies de rendiment en %. Quin diàmetre de rodet escolliries si la corba resistent del circuit és H<sub>r</sub> = 90 + 202.5Q<sup>2</sup> (H en m, i Q en m3/s).",["Φ 504","Φ 480","Φ 460","Φ 440"],0,"Dibuixa H<sub>r</sub> (Q en m³/h: 90 m a Q = 0, 100 m a 800 m³/h, 112,5 m a 1200 m³/h). Només talla la corba de 504 mm, a la zona de bon rendiment (~81 %); les altres queden per sota del circuit.","corba"],
["2406",4,3,"Finalment s’instal·la el rodet de 460mm de diàmetre en la instal·lació i una vàlvula en sèrie per regular el cabal amb h<sub>v</sub> = (400/α)Q<sup>2</sup>, on α és 1 per la vàlvula totalment oberta i 0 per la vàlvula totalment tancada. Si es fixa α a 0.5, quin cabal passarà pel circuit? La corba resistent del circuit sense la vàlvula és la mateixa que a l’apartat anterior.",["450 m3/h","400 m3/h","600 m3/h","800 m3/h"],0,"Amb α = 0,5: H = 90 + (202,5 + 800)Q² = 90 + 1002,5Q². Punts: Q = 0,111 m³/s (400 m³/h) ⇒ 102,4 m; 0,167 m³/s (600 m³/h) ⇒ 117,8 m. Tallant amb la corba de 460 mm surt ≈ 450 m³/h.","corba"],
["2406",5,3,"Pel cas del rodet de 460mm de diàmetre i el circuit original (sense la vàlvula en sèrie de l’apartat anterior). Si es vol incrementar el rendiment de la bomba en funcionament, quina opció és vàlida?",["Instal·lar una vàlvula en sèrie amb la bomba","Instal·lar una vàlvula en paral·lel amb la bomba","Disminuir la velocitat de rotació de la bomba","Escollir un rodet amb menys diàmetre"],1,"Clau oficial: b). El punt de funcionament queda a cabal baix, a l’esquerra del BEP: cal augmentar el cabal de la bomba, i això ho fa el bypass. Sèrie, menys n o menys D mouen el punt encara més lluny del BEP.","corba"],
["2406",6,2,"Durant el funcionament d’una bomba centrífuga, s’observa cavitació a la entrada d’aquesta. Com evitareu aquest fenomen de cavitació?",["Disminuint el NPSH disponible","Augmentant el cabal que passa per la bomba","Instal·lant una segona bomba en paral·lel","Augmentant la submergència de la bomba"],3,"Més submergència (bomba més avall del nivell) ⇒ (z<sub>0</sub>−z<sub>1</sub>) puja ⇒ NPSH<sub>d</sub> puja. Més cabal ho empitjora (puja NPSH<sub>r</sub> i h<sub>asp</sub>)."],
["2406",7,7,"Quina potència mecànica màxima pot generar un aerogenerador que té les corbes de Cp com les del formulari quan la velocitat del vent és 10 m/s, sabent que té un diàmetre de 100m i un generador que permet velocitat variable entre 14 i 35 rpm?.",["1.5 MW","2.3 MW","2.6 MW","1 MW"],1,"C<sub>p,màx</sub> ≈ 0,48 a λ ≈ 8 (β = 0°). n = λ·60c<sub>1</sub>/(2πr) = 8·600/(2π·50) = 15,3 rpm, dins del rang. P = 0,48·½·1,2·π·50²·10³ ≈ 2,26 MW ≈ 2,3 MW.","cp"],
["2406",8,7,"Si el vent baixa a 5 m/s, quina potència mecànica màxima podria generar el mateix aerogenerador que el de l’apartat anterior?",["874 kW","541 kW","106 kW","283 kW"],2,"Ara λ = 2πrn/(60c<sub>1</sub>) va de 14,7 (14 rpm) a 36,7: no es pot anar a λ = 8. A λ ≈ 14,7 la corba β = 0° ja és zero; la millor és β = 5° (C<sub>p</sub> ≈ 0,18). P = 0,18·½·1,2·π·50²·5³ ≈ 106 kW.","cp"],
["2406",9,6,"El tip vòrtex és un fenomen que passa a:",["Ventiladors centrífugs i càrrega parcial","Ventiladors axials i vist des de el sistema rotatiu gira en sentit contrari al rodet","Ventiladors axials degut a la diferència de pressions entre cara de pressió i cara de succió","Ventiladors centrífugs a sobrecàrrega"],2,"El vòrtex de punta neix a l’escletxa entre la punta de l’àlep axial i la carcassa: el fluid passa de la cara de pressió a la de succió. b) descriu el despreniment rotatiu."],
["2406",10,5,"El rodet de la figura:",["És un ventilador amb àleps corbats cap endavant i gira en sentit horari.","És un ventilador amb àleps corbats cap endarrere i gira en sentit horari.","És un ventilador amb àleps corbats cap endavant i gira en sentit antihorari.","És un ventilador amb àleps corbats cap endarrere i gira en sentit antihorari."],0,"Molts àleps curts i amples (tipus «sirocco»): corbats cap endavant. La concavitat dels àleps de la vista frontal mira en sentit horari, que és el sentit de gir.","vent3"],
["2406",11,6,"Quin es l’objectiu principal de posar directrius a l’entrada en rodets axials segons la configuració indicada a la figura?",["Fer que el flux surti dels àleps en direcció axial (c<sub>2u</sub>=0)","Regular el cabal","Reduir el mòdul de w i amb això la fricció amb els àleps del rodet","Convertir part de l’energia cinètica en pressió"],2,"Amb la directriu d’entrada que dona prerotació en el sentit de gir, w<sub>1</sub> és més petita ⇒ menys fricció i menys risc de cavitació. La c) és la mateixa idea que la pregunta 7 del 09/01/24.","axdir3"],
["2406",12,6,"El rodet de la figura té un cabal Q=10,5 m3/s i un diàmetre de base i de punta Dh=0,2 m i Dt=1,2 m, respectivament. Si el flux entra al rodet amb una velocitat relativa w1=15,4 m/s, i l’àlep té un angle β1a de 43°, quin serà l’angle d’incidència a l’entrada del rodet?",["4,68°","-8,68°","5,93°","Cap de les anteriors"],0,"c<sub>m</sub> = 10,5/[π/4·(1,2²−0,2²)] = 9,55 m/s. sin β<sub>1f</sub> = c<sub>m</sub>/w<sub>1</sub> ⇒ β<sub>1f</sub> = 38,32°. i = β<sub>1a</sub> − β<sub>1f</sub> = 4,68°."],
["2406",13,5,"En un rodet centrífug amb β<sub>2alep</sub>>90º:",["El rendiment sol ser major que en un rodet amb β<sub>2alep</sub><90º","Les partícules surten, des de un punt de vista absolut, en direcció contrària al gir del rodet","La trajectòria del canal (entre àleps) és més curta que en un rodet amb β<sub>2alep</sub><90º","La component tangencial C<sub>2u</sub> és menor que en un rodet amb β<sub>2alep</sub><90º"],2,"Corbat endavant: canals curts i oberts, c<sub>2u</sub> > u<sub>2</sub> (més gran, no menor), les partícules surten en el sentit de gir i el rendiment és pitjor."],
["2406",14,4,"Trieu la resposta falsa. En un circuit amb una turbina Francis entre dos embassaments:",["El salt que pot aprofitar la turbina sempre serà menor que el salt brut","L’energia disponible per la turbina és en forma de pressió i energia cinètica","El terme de difusió depèn de la velocitat a la sortida de la canonada d’aspiració","El salt net és igual al salt brut menys les pèrdues de càrrega en la canonada de pressió (o forçada) i el terme de difusió"],3,"La falsa és d): H<sub>n</sub> = H<sub>b</sub> − pèrdues de TOTES les canonades (forçada i d’aspiració) − terme de difusió. Oblidar el tub d’aspiració és la trampa."],
["2406",15,5,"Trieu la resposta falsa. En el cas teòric d’un rodet centrífug amb àleps finits i flux ideal:",["Tenim un angle de desviació a la sortida dels àleps","Existeix una diferència de pressions entre les dues cares dels àleps","L’altura teòrica és major que un rodet amb àleps infinits i flux ideal","No hi ha fricció amb els àleps"],2,"Amb àleps finits apareix la desviació i c<sub>2u</sub> baixa ⇒ H<sub>th,finits</sub> < H<sub>th,∞</sub>. Flux ideal ⇒ sense fricció; la diferència de pressions entre cares és el que transmet el parell."],
["2406",16,5,"La pre-rotació a l’entrada d’un rodet centrífug:",["Sempre és en la mateixa direcció de gir del rodet","Sempre augmenta l’altura teòrica d’Euler","Pot aparèixer quan treballem a cabals molt petits","Apareixerà en ventiladors quan tinguin un difusor a la sortida"],2,"A cabals molt baixos la recirculació a l’entrada genera prerotació. La prerotació en el sentit de gir (c<sub>1u</sub> > 0) redueix H<sub>th</sub> = (u<sub>2</sub>c<sub>2u</sub> − u<sub>1</sub>c<sub>1u</sub>)/g, per això «sempre augmenta» és fals."],
["2406",17,1,"Escolliu quin dels següents aparells és una turbomàquina generadora de flux incompressible:",["Una bomba d’oli en un circuit oleohidràulic","Un compressor d’aire","Un aerogenerador","Un ventilador axial"],3,"Ventilador: turbomàquina generadora i Ma < 0,3. La bomba oleohidràulica és de desplaçament positiu; el compressor és de flux compressible; l’aerogenerador és receptor."],
["2406",18,5,"Quan un rodet centrífug real treballa en condició de disseny s’ha de complir (essent d desviació i i incidència):",["C<sub>1</sub> = C<sub>1m</sub> i d = 0","C<sub>1</sub> radial i β<sub>2àlep</sub>= β<sub>2fluid</sub>","C<sub>1</sub> = C<sub>1m</sub>, i = 0 i d=0","C<sub>1</sub> radial i β<sub>1àlep</sub>= β<sub>1fluid</sub>"],3,"Disseny: entrada sense prerotació (c<sub>1</sub> radial) i incidència nul·la (β<sub>1a</sub> = β<sub>1f</sub>). En un rodet REAL la desviació a la sortida no desapareix mai, per això les opcions amb d = 0 són falses."],
["2406",19,5,"Tenim una bomba centrífuga sense desviació de diàmetre D2=0,4 m que gira a 600 rpm. Inicialment té un triangle de velocitats amb les components c2m=7,16 m/s i c2u=3,47 m/s. Si reduïm el cabal a la meitat, amb quina velocitat relativa w2 sortirà el flux del rodet?",["5,79 m/s","4,56 m/s","9,78 m/s","Cap de les anteriors"],0,"u<sub>2</sub> = 12,57 m/s ⇒ w<sub>2u</sub> = 9,10 ⇒ β<sub>2</sub> = atan(7,16/9,10) = 38,2° (fix, sense desviació). Amb Q/2: c<sub>2m</sub> = 3,58 ⇒ w<sub>2</sub> = c<sub>2m</sub>/sin β<sub>2</sub> = 5,79 m/s."],
["2406",20,1,"El model a escala reduïda d’un rodet centrífug té la corba característica Hm=10 – 15Qm<sup>2</sup> per una velocitat de gir constant. Sabent que el prototip té un diàmetre 5 vegades major que el model, quina seria la seva corba característica quan gira a la mateixa velocitat que aquest?",["Hp=250 - 375Qp<sup>2</sup>","Hp=250 - 3Qp<sup>2</sup>","Hp=250 - 0.024Qp<sup>2</sup>","Cap de les anteriors"],2,"k<sub>H</sub> = 5² = 25, k<sub>Q</sub> = 5³ = 125. A’ = 25·10 = 250; B’ = 15·25/125² = 0,024. 375 és multiplicar B per 25 sense tenir en compte el cabal."],

// ===== Reavaluació 04/07/24 =====
["2407",1,6,"Quin és l’altura d’elevació teòrica estàtica que dona el següent rodet axial en el seu punt de disseny? Dades: D<sub>interior</sub>=0.1m, D<sub>punta</sub>=0.2m, n=1000 rpm, β1a=25°, β2a=35°. Considereu una secció mitja de D=0.15m y sense desviació.",["0.35 m","1.75 m","2.1 m","17.16 m"],1,"u = π·1000·0,15/60 = 7,85 m/s. Disseny (entrada axial, i = 0): c<sub>m</sub> = u·tan 25° = 3,66 ⇒ w<sub>1</sub> = 8,67 m/s. w<sub>2u</sub> = c<sub>m</sub>/tan 35° = 5,23 ⇒ w<sub>2</sub> = 6,38. En axial H<sub>est</sub> = (w<sub>1</sub>²−w<sub>2</sub>²)/2g = 1,75 m."],
["2407",2,6,"Per un cabal de Q=0.11 m3/s i el rodet axial anterior, quin angle d’entrada hauria de tenir una directriu a la sortida per recuperar el màxim d’energia? Considereu una secció mitja de D=0.15m y sense desviació y que el flux entra totalment axial.",["76 graus","90 graus","54 graus","35 graus"],0,"c<sub>m</sub> = 0,11/[π/4·(0,2²−0,1²)] = 4,67 m/s; w<sub>2u</sub> = 4,67/tan 35° = 6,67 ⇒ c<sub>2u</sub> = 7,85 − 6,67 = 1,18 m/s. La directriu s’alinea amb c<sub>2</sub>: α = atan(4,67/1,18) ≈ 76°."],
["2407",3,5,"Un rodet centrífug gira a 1500 rpm i té un diàmetre d’entrada de 0.05m i de sortida de 0.2m i una amplada de 0.1m a la entrada i de 0.02m a la sortida. Els àleps tenen β1a=20° i β2a=30°. Quina alçada màxima teòrica pot donar aquest rodet? Considereu que el flux entra totalment radial i que té una desviació a la sortida de 5 graus.",["19 m","25 m","15 m","40 m"],1,"H<sub>th</sub> = u<sub>2</sub>²/g − u<sub>2</sub>cot β<sub>2f</sub>·Q/(πD<sub>2</sub>b<sub>2</sub>g): el màxim és a Q = 0 ⇒ H = u<sub>2</sub>²/g = (π·1500·0,2/60)²/9,81 = 15,71²/9,81 = 25,1 m."],
["2407",4,5,"Quin cabal passa pel rodet de l’apartat anterior quan dona una altura teòrica de 15m? Considereu que el flux entra totalment radial i que té una desviació a la sortida de 5 graus.",["0.011 m3/s","0.022 m3/s","0.037 m3/s","0.092 m3/s"],2,"β<sub>2f</sub> = 30 − 5 = 25°. 15 = 25,15 − 15,71·cot 25°·Q/(π·0,2·0,02·9,81) ⇒ Q = 0,037 m³/s. Usar 30° (sense desviació) donaria 0,044."],
["2407",5,1,"Una bomba del sistema oleohidràulic del tren d’aterratge d’un avió és:",["Una turbomàquina generadora de flux compressible","Una màquina generadora de desplaçament positiu de flux incompressible","Una màquina receptora de desplaçament positiu de flux compressible","Una turbomàquina receptora de flux incompressible"],1,"Els sistemes oleohidràulics fan servir bombes volumètriques (engranatges, pistons): desplaçament positiu, generadora, i l’oli és pràcticament incompressible."],
["2407",6,4,"El salt net d’una màquina receptora depèn de:",["La diferència de velocitats entre la entrada i la sortida","La diferència de velocitats i de cota entre la entrada i la sortida","La diferència de velocitats, de cota i de pressió entre la entrada i la sortida","La diferència de velocitats, de cota, de pressió, més les pèrdues per fricció."],2,"H<sub>n</sub> = Δ(c²/2g) + Δz + Δp/ρg entre entrada i sortida de la màquina (formulari). Les pèrdues del circuit ja estan descomptades del salt brut; les internes no formen part del salt net."],
["2407",7,1,"En una bomba es mesura el rendiment i s’obté un valor de 0.65. Quin serà el rendiment d’una bomba geomètricament similar en el seu punt homòleg amb 4 vegades més cabal girant a la mateixa velocitat?. NOTA: suposar la llei d’extrapolació de rendiments del formulari",["0.75","0.69","0.85","0.8"],1,"Mateixa n ⇒ Q ∝ D³ ⇒ D<sub>p</sub>/D<sub>m</sub> = 4<sup>1/3</sup> = 1,587. 1 − η<sub>p</sub> = (1/1,587)<sup>0,25</sup>·0,35 = 0,312 ⇒ η<sub>p</sub> = 0,69. Prendre D ∝ 4 donaria 0,75."],
["2407",8,5,"La desviació a la sortida en el rodet centrífug:",["Pot ser positiva o negativa, depenent del cabal","Si existeix, és sempre negativa","Si existeix, és sempre positiva","Depèn del signe de la incidència a la entrada"],2,"Amb àleps finits el flux surt menys guiat que l’àlep: β<sub>2f</sub> < β<sub>2a</sub> ⇒ d = β<sub>2a</sub> − β<sub>2f</sub> > 0. La incidència sí pot ser positiva o negativa."],
["2407",9,5,"En un rodet centrífug, amb un cabal més petit que el de disseny i sense prerotació:",["La incidència és 0","La incidència és negativa","La incidència és positiva","La incidència depèn de si hi ha desviació a la sortida"],2,"Menys Q ⇒ menys c<sub>1m</sub> amb la mateixa u<sub>1</sub> ⇒ β<sub>1f</sub> < β<sub>1a</sub> ⇒ i > 0. La desviació de sortida no afecta l’entrada."],
["2407",10,6,"Quina afirmació és certa sobre el rodet de la figura?",["És un rodet axial amb directrius a la entrada","És un rodet centrífug amb directrius a la sortida","És un rodet axial amb directrius a la sortida","És un rodet centrífug amb directrius a la entrada"],2,"El flux travessa el rodet axialment (hèlix) i les pales fixes de la carcassa són aigües avall: rodet axial amb directrius a la sortida.","rodet"],
["2407",11,1,"Quin seria l’objectiu de posar un difusor a la sortida d’una bomba centrífuga?",["Disminuir la pressió a la càmera espiral","Regular el cabal que passa per la bomba","Augmentar la velocitat a la càmera espiral","Cap de les anteriors"],3,"El difusor redueix la velocitat i augmenta la pressió: a) i c) diuen el contrari i b) no és la seva funció. Per tant, cap."],
["2407",12,3,"Tenim dues bombes hidràuliques per a utilitzar en un circuit hidràulic Hr=10+1.01·Q<sup>2</sup>. La primera bomba te una corba Hb1=80-20Q<sup>2</sup> i la segona bomba amb una corba Hb2=60-20Q<sup>2</sup>. Es vol augmentar el cabal que arriba al dipòsit superior i connectem les bombes en paral·lel. Quina altura donaran les bombes i quin cabal arribarà al circuit superior? NOTA: comprovar numèricament quina solució de les proposades és factible",["H= 13.75m, Q=3.34m3/s","H=20m, Q=3.146 m3/s","H=12.39m; Q= 1,54 m3/s","H=26.32m; Q=4.88 m3/s"],1,"A H = 20 m: Q<sub>1</sub> = √(60/20) = 1,732 i Q<sub>2</sub> = √(40/20) = 1,414 ⇒ 3,146 m³/s; el circuit a 3,146 dona 10 + 1,01·9,9 = 20 m ✔. Les altres no compleixen alhora bombes i circuit."],
["2407",13,2,"Per una operació determinada d’una bomba s’aprecia que existeixen bombolles de cavitació (amb tècniques acústiques) però el rendiment no es veu afectat. En aquest punt mesurem NPSH<sub>mesurat</sub>. Quina afirmació es certa?",["NPSH<sub>mesurat</sub> < NPSH<sub>req-desenvolupada</sub>","NPSH<sub>mesurat</sub> > NPSH<sub>req-incipient</sub>","NPSH<sub>mesurat</sub> < NPSH<sub>req-incipient</sub>","Si hi ha cavitació, el rendiment es veurà afectat i per tant la situació descrita no és possible"],2,"Hi ha bombolles ⇒ ja som per sota de l’NPSH d’incipient; el rendiment no cau ⇒ encara som per sobre del de desenvolupada. NPSH<sub>des</sub> < NPSH<sub>mes</sub> < NPSH<sub>inc</sub>."],
["2407",14,2,"Una bomba es troba a 2 m per sobre d’un dipòsit d’aigua obert a l’atmosfera i separat d’ell per una canonada de 1km amb un coeficient de fricció de 0.03 i diàmetre de 2m. Quan funciona amb 10 m3/s el seu NPSH requerit es 15m. Per evitar que aquesta bomba caviti te instal·lada una bomba de petites dimensions entre el dipòsit inferior i la bomba principal. Quina altura d’elevació ha de donar com a mínim la bomba auxiliar? P<sub>vap</sub> = 2340 Pa, P<sub>atm</sub> = 100.000 Pa",["14.79 m","12.79 m","7.05 m","4 m"],0,"h<sub>f</sub> = 8·0,03·1000·10²/(π²·2⁵·9,81) = 7,75 m. Sense auxiliar: NPSH<sub>d</sub> = 10,19 − 7,75 − 2 − 0,24 = 0,21 m. Cal H<sub>aux</sub> = 15 − 0,21 = 14,79 m."],
["2407",15,5,"Quin dels següents ventiladors presenta una velocitat absoluta a la sortida més elevada (considerant dimensions i velocitat de rotació igual)?",["Corbat cap endavant","Radial","Corbat cap enrere","Els tres presenten la mateixa velocitat absoluta a la sortida si tenen la mateixa velocitat de rotació"],0,"Amb β<sub>2</sub> > 90°, w<sub>2u</sub> apunta en el sentit de gir i c<sub>2u</sub> = u<sub>2</sub> − w<sub>2u</sub> > u<sub>2</sub>: la c<sub>2</sub> més gran. Radial: c<sub>2u</sub> = u<sub>2</sub>; enrere: c<sub>2u</sub> < u<sub>2</sub>."],
["2407",16,4,"Es vol fer treballar una turbina Pelton aproximadament al 25% de la potència nominal. La turbina te 4 injectors i suposem que la apertura en % de cada injector es proporcional al cabal que passi per aquell injector. Quina de les següents operacions donaria un rendiment més elevat?",["4 injectors al 25%","2 injectors al 50% i 2 tancats","1 injector al 100% i 3 tancats","3 injectors al 33% i un tancat"],2,"Cada injector té el millor rendiment prop de la seva obertura nominal. Un injector al 100 % (i 3 tancats, sense pèrdues) dona el 25 % amb molt bon rendiment; injectors poc oberts tenen més pèrdues."],
["2407",17,4,"Quan s’està turbinant l’aigua que passa per una turbina Francis, quin ordre segueix el fluid?",["Camara espiral, tub d’aspiració, directrius, turbina","Camara espiral, directrius, turbina, tub d’aspiració","Tub d’aspiració, turbina, directriu, camara espiral","Tub d’aspiració, directrius, turbina, camara espiral"],1,"Cambra espiral (reparteix) → directrius (orienten i regulen) → rodet → tub d’aspiració (recupera energia cinètica). c) seria l’ordre en mode bomba."],
["2407",18,4,"Una turbina Pelton te un rendiment de turbina de 90% i el generador del 98%. La turbina està a una cota de 300m sobre el nivell del mar i la captació d’aigua a 1500m. Si considerem que les pèrdues al circuit hidràulic son del 5% i que el cabal d’aigua que travessa la canonada es de 5 m3/s, quina potencia elèctrica genera la màquina?",["55.9 MW","63.39 MW","50.31 MW","49.3 MW"],3,"H<sub>n</sub> = 1200·0,95 = 1140 m; P<sub>hid</sub> = 9810·5·1140 = 55,9 MW; P<sub>el</sub> = 55,9·0,90·0,98 = 49,3 MW. 55,9 és la potència hidràulica."],
["2407",19,6,"La relació entre la velocitat de rotació de la roda i la velocitat del raig es 0.48. Si la velocitat del raig es 149 m/s i la màquina té 6 parells de pol (f<sub>elect</sub> = 50Hz) quin es el diàmetre del rodet?",["2.73 m","1.37 m","3.2 m","1.6 m"],0,"u = 0,48·149 = 71,5 m/s. n = 50/6 = 8,33 rps ⇒ ω = 52,4 rad/s. r = u/ω = 1,365 m ⇒ D = 2,73 m. 1,37 m és el radi."],
["2407",20,7,"En un aerogenerador, l’angle β<sub>fluid</sub> entre la velocitat de rotació i la velocitat relativa del vent:",["Augmenta a mida que ens allunyem del centre de la màquina","Disminueix a mida que ens allunyem del centre de la màquina","Es manté a mida que ens allunyem del centre de la màquina","Depèn del disseny de la pala"],1,"tan β = c<sub>vent</sub>/u i u = ωr creix amb el radi ⇒ β disminueix cap a la punta (per això la pala està torçada, com en una Kaplan)."]
];

["2501",1,1,"Quin tipus de turbomàquina es fa servir en xarxes d’abastament d’aigua?",["Màquines generadores de flux compressible.","Màquines generadores de flux incompressible.","Màquines receptores de flux compressible.","Màquines receptores de flux incompressible."],1,"Per distribuir aigua cal donar-li energia (bombes): generadores, i l’aigua és incompressible."],
["2501",2,2,"Escolliu la resposta falsa referent a l’energia en un circuit de bombeig entre dos dipòsits:",["El terme de difusió representa l’energia cinètica perduda al final de la canonada.","Si menystenim el terme de difusió, la corba resistent del sistema únicament depèn de la diferència de cotes entre els dos dipòsits i les pèrdues per fricció en la canonada d’aspiració i d’impulsió.","Si la canonada té un diàmetre constant, la línea de càrrega serà paral·lela i per sobre de la piezomètrica.","Al final de la canonada, la línia de càrrega ha d’estar sempre alineada amb la superfície lliure del dipòsit superior."],3,"La falsa és d): al final de la canonada la línia de càrrega està per sobre de la superfície lliure en c²/2g (terme de difusió), que es perd en entrar al dipòsit. c) és certa: amb D constant, c²/2g és constant."],
["2501",3,5,"Escolliu la resposta correcta referent a l’equació teòrica d’Euler:",["Aquesta té en compte el gruix dels àleps i la fricció del fluid amb les seves parets.","Per a que sigui vàlida el flux ha de complir únicament els següent requisits: ser incompressible, estacionari i uniforme.","S’obté a partir de la llei de conservació de la quantitat de moviment.","En una màquina generadora, en el punt de disseny, el moment angular a la sortida del rodet és major que a l’entrada."],3,"En una generadora el rodet aporta energia: u<sub>2</sub>c<sub>2u</sub> > u<sub>1</sub>c<sub>1u</sub> (més moment angular a la sortida). Euler surt del moment de la quantitat de moviment (no de la quantitat de moviment lineal) i és ideal (sense fricció ni gruix)."],
["2501",4,1,"Escolliu la resposta correcta referent a l’anàlisi dimensional:",["Ens permet extrapolar variables com l’energia, el cabal i el rendiment entre màquines geomètricament semblants.","Hi ha coeficients adimensionals que no són estrictament adimensionals, és a dir, que es poden expressar amb unitats.","El rendiment obtingut en un model és sempre major que el del prototip.","El punt homòleg de funcionament entre dues màquines geomètricament semblants és aquell on treballen dins un mateix circuit amb la mateixa velocitat de gir."],1,"Els coeficients φ’ = Q/(nD³), ψ’ = H/(n²D²) amb n en rpm i H en m tenen unitats, però són útils si es fan servir amb coherència. El rendiment no s’extrapola per semblança pura (efecte d’escala) i el model rendeix menys."],
["2501",5,5,"Escolliu la resposta correcta referent al difusor a la sortida d’un rodet centrífug:",["L’angle del difusor està dissenyat segons la direcció de la velocitat relativa w a la sortida del rodet.","Una de les seves funcions és la de convertir part de l’energia de pressió en velocitat.","Les directrius del difusor es mouen segons la velocitat relativa w a la sortida del rodet.","En el punt de disseny, la trajectòria absoluta de les partícules de fluid segueix la direcció de les directrius."],3,"El difusor és fix i les directrius s’orienten amb c<sub>2</sub> (α<sub>2</sub>): en disseny el flux absolut les segueix. Converteix velocitat en pressió, no al revés, i no té res a veure amb w."],
["2501",6,5,"Escolliu l’opció falsa en referència al disseny dels àleps d’un rodet centrífug:",["Rodets amb angles β<sub>2a</sub> >90° només es poden utilitzar en ventiladors.","Com més petit és l’angle β<sub>2a</sub>, més llarga és la trajectòria entre els àleps i més gradual és la transferència d’energia.","Per a qualsevol configuració dels àleps, l’altura teòrica varia amb el cabal.","Per a un mateix cabal i velocitat de rotació, la configuració β<sub>2a</sub><90° teòricament dóna menys energia que β<sub>2a</sub>>90°."],2,"La falsa és c): amb β<sub>2a</sub> = 90° (àleps radials) cot β = 0 i H<sub>th</sub> = u<sub>2</sub>²/g no depèn del cabal."],
["2501",7,6,"Escolliu l’opció falsa en referència a un rodet axial:",["L’angle β<sub>1a</sub> a la punta dels àleps és sempre menor que a la base.","Una de les funcions de les directrius a la sortida del rodet és la de reduïr el cabal.","Hi ha una configuració amb directriu a l’entrada del rodet a on es busca reduir les pèrdues per fricció.","La transferència d’energia té lloc en forma d’energia estàtica i dinàmica."],1,"La falsa és b): la directriu de sortida endreça el flux i recupera pressió, no regula ni redueix el cabal. a) certa perquè u creix amb el radi amb c<sub>m</sub> constant."],
["2501",8,1,"Escolliu l’opció correcta en referència a les pèrdues per xoc, o “shock losses”, en un rodet:",["Només son importants quan treballem a cabals molt elevats.","Poden tenir lloc a l’entrada del rodet, a l’entrada del difusor i a la voluta.","Són degudes a la fricció del flux en els canals dels àleps i són proporcionals al quadrat de la velocitat.","Poden provocar pre-rotació a l’entrada."],1,"El xoc apareix allà on el flux arriba amb un angle diferent del de l’àlep o la directriu: entrada del rodet, entrada del difusor, llengüeta de la voluta. Creix a banda i banda del BEP. c) descriu la fricció."],
["2501",9,1,"Quins elements es poden fer servir per reduïr les pèrdues volumètriques entre la sortida i la entrada d’una bomba?",["Juntes laberíntiques.","Juntes amb contacte rotor-estator.","Coixinets.","Juntes premsa-estopes."],0,"Entre la sortida i l’entrada del rodet (fuga interna) s’usen anells de desgast o juntes laberíntiques, sense contacte. Les premsaestopes i mecàniques segellen l’eix cap a l’exterior; els coixinets no segellen."],
["2501",10,1,"Quina de les següents característiques no correspon a una bomba axial?",["Solen tenir una zona d’inestabilitat a cabals molt baixos.","És preferible arrancar-les amb vàlvula tancada.","Per a bombes amb àleps regulables existeix més d’una corba característica.","L’altura disminueix amb el cabal."],1,"L’axial té la potència màxima a Q = 0: s’arrenca amb vàlvula OBERTA. Amb vàlvula tancada s’arrenquen les centrífugues (potència mínima a Q = 0)."],
["2501",11,2,"Escolliu l’opció falsa en referència a l’NPSH requerit:",["Disminueix a mesura que augmenta el cabal que circula per la bomba.","Depèn del disseny de la bomba i és proporcionat pel fabricant.","L’NPSH requerit per a cavitació incipient és sempre major que per a cavitació desenvolupada.","Es pot calcular amb proves experimentals variant la pressió a l’entrada de la bomba."],0,"La falsa és a): l’NPSH<sub>r</sub> creix amb el cabal (més velocitat a l’entrada ⇒ més depressió local). La resta són certes."],
["2501",12,2,"On sol aparèixer la cavitació en bombes?",["A l’entrada del rodet, a la cara de succió dels àleps.","A l’entrada del rodet, a la cara de pressió dels àleps.","A la canonada d’aspiració, prop del rodet.","A la canonada d’aspiració, prop del dipòsit inferior."],0,"El punt de mínima pressió és a l’entrada de l’àlep, a la cara de succió. A la canonada la pressió encara és més alta que dins el rodet."],
["2501",13,2,"Quina de les següents opcions és falsa en referència al fenomen de la cavitació?",["Pot ocasionar problemes com vibració, soroll i erosió de superfícies.","S’origina a partir de gèrmens existents en el fluid.","Una mateixa bombolla pot tenir diversos rebots a l’hora d’implosionar.","Els danys que causa la cavitació s’originen en el moment que les bombolles de vapor augmenten el seu diàmetre."],3,"La falsa és d): el dany es produeix en el COL·LAPSE (microjet i ona de xoc), quan la bombolla arriba a una zona de pressió més alta, no quan creix."],
["2501",14,6,"Escolliu l’opció falsa en referència al despreniment rotatiu:",["Apareix en ventiladors axials quan aquests treballen a cabals molt baixos.","S’origina degut al despreniment del flux a la cara de pressió dels àleps.","Des del sistema rotatiu, el despreniment es mou en el sentit contrari de rotació del rodet.","El despreniment sol apareixer en un dels àleps i després transmetre’s als àleps veïns."],1,"La falsa és b): a cabal baix la incidència és positiva i el flux es despren a la cara de SUCCIÓ. La cel·la despresa es propaga a l’àlep veí, en sentit contrari al gir vist des del rotor."],
["2501",15,4,"Escolliu l’opció correcta en referència a una turbina Francis treballant en sobrecàrrega:",["La velocitat absoluta C<sub>2</sub> a la sortida del rodet està inclinada en la direcció de gir del rodet.","Pot aparèixer una torxa cavitant amb rotació a la sortida del rodet.","Si suposem Hn= ct., C<sub>1</sub> a l’entrada té pràcticament el mateix mòdul que en el punt de disseny.","La velocitat de gir augmenta respecte el punt de disseny."],2,"Amb salt constant, l’energia a l’entrada (i c<sub>1</sub>) pràcticament no canvia; només canvia la direcció per les directrius. En sobrecàrrega c<sub>2u</sub> < 0 (contrària al gir) i la torxa és estreta; la velocitat és síncrona (fixa)."],
["2501",16,3,"Una bomba té una corba característica Hb=100-20Q^2 quan gira a n=2000 rpm. La bomba treballa en un circuit amb una corba Hr=50+2Q^2. Quin cabal passarà per la bomba quan aquesta giri a 2500 rpm i estigui instal·lada en el mateix circuit? (Nota: En les expressions, H en m i Q en m^3/s)",["1,51 m^3/s","1,88 m^3/s","2,20 m^3/s","2,35 m^3/s"],2,"Només canvia n (D igual): A’ = 100·(2500/2000)² = 156,25 i B no canvia. 156,25 − 20Q² = 50 + 2Q² ⇒ Q = √(106,25/22) = 2,20 m³/s. Aplicar semblança al punt de tall (Q·1,25) donaria 1,88: és el punt homòleg, no el de funcionament."],
["2501",17,4,"En una turbina mesurem la velocitat i la pressió a l’entrada i a la sortida d’aquesta. El punt de mesura a la sortida està 2 m per sota del punt de mesura a l’entrada de la turbina. Quin és el salt net de la turbina? Dades obtingudes: P<sub>ent</sub>= 500.000 Pa P<sub>sort</sub>=-30.000 Pa C<sub>ent</sub>=3 m/s C<sub>sort</sub>= 4 m/s",["54,02 m","45,55 m","55,67 m","51,67 m"],2,"H<sub>n</sub> = (p<sub>e</sub>−p<sub>s</sub>)/ρg + (z<sub>e</sub>−z<sub>s</sub>) + (c<sub>e</sub>²−c<sub>s</sub>²)/2g = 530000/9810 + 2 + (9−16)/19,62 = 54,02 + 2 − 0,36 = 55,67 m. 54,02 és només el terme de pressió."],
["2501",18,4,"Quina potència subministra una turbina amb un salt net de 100 m quan fem passar un cabal de 100 m^3/s, si el rendiment elèctric el podem considerar del 96%, el rendiment mecànic del 99% i el rendiment hidràulic obtingut en una turbina geomètricament semblant a escala 1/10 ha estat del 90%? Nota: Considereu l’efecte d’escala en el rendiment hidràulic.",["88 MW","83,9 MW","98,1 MW","109,4 MW"],0,"1 − η<sub>h,p</sub> = (1/10)<sup>0,25</sup>·0,10 = 0,056 ⇒ η<sub>h,p</sub> = 0,944. P = 9810·100·100·0,944·0,99·0,96 = 88 MW. Sense corregir (0,90) sortirien 83,9 MW."],
["2501",19,7,"Suposeu un aerogenerador amb les corbes característiques indicades al formulari. Si el generador té un diàmetre de pales de 200 m i suposant un rendiment elèctric del 80%, quina és la potència màxima que podem extreure en condicions òptimes si tenim un vent de 10 m/s? Densitat de l’aire segons formulari.",["11,3 MW","7,2 MW","28,8 MW","3,6 MW"],1,"C<sub>p,màx</sub> ≈ 0,48 (β = 0°). P<sub>mec</sub> = 0,48·½·1,2·π·100²·10³ = 9,05 MW ⇒ P<sub>el</sub> = 0,8·9,05 = 7,2 MW. 11,3 MW surt de dividir per 0,8 en lloc de multiplicar.","cp"],
["2501",20,7,"Si la velocitat del vent augmenta fins a 11,2 m/s, quina és la velocitat de rotació òptima per aquest aerogenerador en aquestes condicions?",["7 rpm","8 rpm","9 rpm","10 rpm"],1,"n = λ<sub>opt</sub>·60c<sub>1</sub>/(2πr). La solució oficial pren λ<sub>opt</sub> ≈ 7,5 ⇒ n = 7,5·60·11,2/(2π·100) = 8,0 rpm. Ull: amb la gràfica del formulari 2026 (màxim a λ ≈ 8) surten 8,6 rpm.","cp"],

// ===== Parcial 11/06/25 =====
["2506",1,6,"Un ventilador axial amb directrius a la sortida i dimensions Dt=2 m i Dh=0,5 m treballa en el seu punt de disseny amb un cabal de 20 m3/s. Sabent que la velocitat de gir és de 100 rpm, amb quina velocitat veuen els àleps entrar el fluid a la punta del àlep?",["12,48 m/s","11,26 m/s","8,57 m/s","8,24 m/s"],0,"«Com veuen els àleps» = velocitat relativa w<sub>1</sub>. u<sub>punta</sub> = π·100·2/60 = 10,47 m/s; c<sub>m</sub> = 20/[π/4·(2²−0,5²)] = 6,79 m/s; entrada axial ⇒ w<sub>1</sub> = √(u²+c<sub>m</sub>²) = 12,48 m/s."],
["2506",2,6,"Seguint la pregunta anterior, quina incidència tindríem a l’entrada (a la punta del àlep) si reduíssim el cabal un 25%?",["5,36°","7,03°","23,75°","14,49 º"],1,"Disseny: β<sub>1a</sub> = atan(6,79/10,47) = 32,96°. Amb 0,75Q: β<sub>1f</sub> = atan(0,75·6,79/10,47) = 25,93°. i = 32,96 − 25,93 = 7,03° (positiva, com toca a cabal baix)."],
["2506",3,5,"Una ventilador centrífug d’àleps rectes (β<sub>2-alep</sub>=90º) de D2=0,5 m i b2=0,03 m té un angle de desviació del fluid de 5 graus a la sortida. Si sabem que el cabal que bombeja és de 0,4 m3/s, amb quina velocitat relativa sortirà el fluid?",["8,45 m/s","2,04 m/s","8,52 m/s","5,34 m/s"],2,"c<sub>2m</sub> = 0,4/(π·0,5·0,03) = 8,49 m/s; β<sub>2f</sub> = 90 − 5 = 85° ⇒ w<sub>2</sub> = c<sub>2m</sub>/sin 85° = 8,52 m/s. 8,45 surt de multiplicar per sin en lloc de dividir."],
["2506",4,1,"Quina de les següents opcions no és una tendència actual en disseny de turbomàquines?",["Reduir els costos de fabricació i instal·lació","Fer estructures més rígides","Augmentar la concentració de potència","Augmentar la velocitat de rotació"],1,"La tendència és fer màquines més compactes, ràpides i barates, amb més potència per unitat; això porta a estructures més esveltes/flexibles (més problemes de vibracions), no més rígides."],
["2506",5,1,"Escolliu l’opció correcta en referència a l’anàlisi dimensional en turbomàquines:",["En la pràctica, mai s’utilitzen nombres que no siguin estrictament adimensionals","La corba característica H-Q de dues màquines geomètricament semblants són iguals","El rendiment d’un prototip és superior al model degut a la influència del NPSH","La velocitat específica ens permet classificar les bombes segons el seu disseny"],3,"n<sub>q</sub> = n√Q/H<sup>3/4</sup> no depèn de la mida i classifica el rodet (centrífug → semiaxial → axial). Les corbes iguals són les adimensionals ψ-φ; l’efecte d’escala ve de Re i rugositat, no de l’NPSH."],
["2506",6,5,"Quan augmentem l’angle de sortida dels àleps β<sub>2-àlep</sub> d’un rodet centrífug, mantenint el mateix cabal, velocitat de rotació i diàmetre de sortida i suposant un comportament ideal:",["c<sub>2u</sub> disminueix i l’angle α<sub>2</sub> augmenta","El mòdul de W<sub>2</sub> sempre augmenta","c<sub>2u</sub> disminueix","El mòdul de C<sub>2</sub> augmenta i l’angle α<sub>2</sub> disminueix"],3,"Amb c<sub>2m</sub> i u<sub>2</sub> fixos, més β<sub>2</sub> ⇒ menys w<sub>2u</sub> ⇒ més c<sub>2u</sub> ⇒ c<sub>2</sub> més gran i més tombada (α<sub>2</sub> menor). w<sub>2</sub> = c<sub>2m</sub>/sin β<sub>2</sub> no sempre augmenta."],
["2506",7,5,"Amb quina de les següents tècniques d’anàlisi de fluids es pot derivar l’equació de l’Euler?",["Anàlisi integral","Anàlisi dimensional","Anàlisi diferencial","Anàlisi numèric"],0,"Euler s’obté aplicant el balanç integral de moment angular (teorema de transport de Reynolds) a un volum de control que conté el rodet. El diferencial és la base del CFD."],
["2506",8,4,"El terme de difusió en un circuit amb una turbina representa:",["L’energia cinètica perduda a la sortida de la canonada d’impulsió","L’energia cinètica perduda a la sortida de la canonada de pressió","L’energia cinètica perduda a la sortida de la canonada de l’aspiració","L’energia cinètica perduda a l’entrada de la canonada de pressió"],2,"En una turbina el fluid acaba sortint pel tub d’aspiració cap al canal de desguàs: l’energia cinètica c²/2g que hi queda es perd. «Impulsió» és vocabulari de bomba."],
["2506",9,5,"En un rodet centrífug treballant amb cabals per sota de disseny, suposant β<sub>2f</sub> < 90º i δ = 0º en tot el rang de funcionament:",["C<sub>1</sub> < C<sub>1-disseny</sub> i β<sub>1f</sub> < β<sub>1f-disseny</sub>","W<sub>1</sub> < W<sub>1-disseny</sub> i α<sub>1f</sub> < α<sub>1f-disseny</sub>","W<sub>2</sub> < W<sub>2-disseny</sub> i β<sub>2f</sub> < β<sub>2f-disseny</sub>","C<sub>2m</sub><C<sub>2m-disseny</sub> i α<sub>2f</sub> > α<sub>2f-disseny</sub>"],0,"Menys Q ⇒ c<sub>1</sub> = c<sub>1m</sub> més petita i, amb la mateixa u<sub>1</sub>, β<sub>1f</sub> més petit. A la sortida β<sub>2f</sub> no canvia (δ = 0) i α<sub>2f</sub> disminueix; α<sub>1</sub> segueix sent 90°."],
["2506",10,5,"Quina trajectòria seguiria un fluid a través d’un rodet centrífug que treballa en el seu punt de disseny, vista des del sistema rotatiu del rodet?",["El flux entraria radialment i aniria adquirint inclinació i velocitat en direcció contrària a la de gir del rodet","El flux entraria radialment i aniria adquirint inclinació i velocitat en la mateixa direcció de gir del rodet","El flux entraria alineat amb els àleps i aniria adquirint velocitat seguint els canals entre aquests","El flux entraria alineat amb els àleps i s’aniria inclinant seguint l’angle dels àleps"],3,"Des del rotor es veu w: en disseny entra tangent a l’àlep (i = 0) i segueix el canal. Com que el canal s’eixampla, w<sub>2</sub> < w<sub>1</sub>: no «adquireix velocitat» (c és fals)."],
["2506",11,5,"Sobre la incidència a l’entrada i la desviació a la sortida i els seus efectes sobre el funcionament d’una bomba centrífuga podem dir:",["La incidència i la desviació tenen un efecte important en el rendiment hidràulic","La desviació causa una reducció en les prestacions de la bomba però no afecta al rendiment hidràulic","Una incidència positiva fa augmentar el rendiment respecte a la incidència igual a 0.","Per a cabals alts, la desviació és més important que per cabals baixos."],1,"La desviació redueix c<sub>2u</sub> i H<sub>th</sub>, però no és una dissipació d’energia: no toca η<sub>h</sub>. La incidència ≠ 0 sí que genera pèrdues per xoc i baixa el rendiment."],
["2506",12,1,"Bombes centrífugues d’una etapa amb H altes :",["Tenen pèrdues als discos relativament baixes","Tenen pèrdues volumètriques relativament baixes","Tenen una diferència de diàmetres entre sortida i entrada gran si es compara amb bombes amb H més moderades","Son bombes amb una corba característica de potència mecànica (o elèctrica) bastant horizontal"],2,"H alta ⇒ n<sub>q</sub> baixa ⇒ rodet molt radial, D<sub>2</sub> ≫ D<sub>1</sub>. Justament tenen pèrdues de disc i volumètriques altes (diferència de pressió gran)."],
["2506",13,2,"En el següent gràfic s’ha representat el NPSH X, a =Y i b =Z; obtingut en un banc d’assaig. Que es X,Y,Z?",["X= disponible, a=desenvolupada, b=incipient","X=disponible, a=incipient, b=desenvolupada","X=requerit, a=incipient, b=desenvolupada","X=requerit, a=desenvolupada, b=incipient"],3,"Al banc es baixa l’NPSH a cabal constant: és el requerit. b (NPSH alt) és on comencen les bombolles (incipient); a, on H ja ha caigut un 3 % (desenvolupada).","npsh"],
["2506",14,2,"Suposeu que un cop instal·lada la bomba al vostre circuit mesureu un NPSH tal que a<NPSH<b. Que podem concloure?",["No ho podem determinar ja que no tenim les mateixes condicions que en el banc d’assaig","La bomba treballarà sense cap tipus de cavitació","La bomba treballarà amb cavitació desenvolupada","La bomba treballarà amb cavitació incipient"],3,"Entre l’NPSH de desenvolupada (a) i el d’incipient (b) hi ha bombolles però l’H encara no cau: cavitació incipient.","npsh"],
["2506",15,5,"Els ventiladors amb àleps corbats endavant comparativament amb un ventilador de les mateixes dimensions i corbats enrere:",["Tenen més rendiment","Tenen més prestacions","Són més estables","Tenen un angle de sortida d’àleps més petit"],1,"β<sub>2</sub> > 90° ⇒ c<sub>2u</sub> > u<sub>2</sub> ⇒ més altura i cabal per a la mateixa mida i velocitat (més prestacions), però menys rendiment i corba menys estable."],
["2506",16,4,"Per una turbina, es disposa d’un embassament a 500 m.a.s.l i un altre a 300 m.a.s.l. La turbina s’instal·la-la a cota 290 m.a.s.l. Si les pèrdues a les canonades son de 5metres i es pot negligir el terme de difussió. Quin es el salt brut i salt net de la màquina? NOTA: m.a.s.l= metres sobre nivell de mar",["Hb=210m, Hn=205m","Hb=210m, Hn=215m","Hb=200m, Hn=205m","Hb=200m, Hn=195m"],3,"El salt brut és entre superfícies lliures: 500 − 300 = 200 m (la cota de la turbina no hi compta). H<sub>n</sub> = 200 − 5 = 195 m."],
["2506",17,4,"Una turbina treballa amb un salt net de 300m. El cabal que passa pel rodet en condicions de disseny es de 10 m^3/s. El rendiment hidràulic del 92% i el volumètric 98%. Suposeu el rendiment mecànic del 99% i el rendiment del generador de 95%. Quina es la potència elèctrica que generarà la turbina? g=9.81 i ρ=1000 kg/m^3",["30,03 MW","35,42 MW","25,46 MW","24,95 MW"],2,"El cabal donat ja és el del rodet: no cal η<sub>v</sub>. P = ρgQ<sub>rodet</sub>H<sub>n</sub>·η<sub>h</sub>η<sub>m</sub>η<sub>gen</sub> = 9810·10·300·0,92·0,99·0,95 = 25,46 MW. 24,95 surt de multiplicar també per η<sub>v</sub>."],
["2506",18,4,"Una turbina Francis treballa amb 90MW a condicions de disseny. S’observa que a 40MW la turbina es molt inestable i a 110MW també i per tant es limita el seu rang de funcionament entre aquests dos valors (suposem salt constant i igual al de disseny). Que succeeix en aquest dos extrems?",["A 40MW tenim cavitació a l’entrada del àlep i a 110MW cavitació a la sortida.","A 40MW tenim una torxa centrada i estreta i a 110MW una torxa amb rotació","A 40MW tenim una torxa amb rotació i a 110 MW tenim una torxa estreta.","En els dos límits tenim cavitació a l’entrada de l’àlep que causa el límit de funcionament de la màquina"],2,"Càrrega parcial (40 MW): c<sub>2u</sub> > 0, torxa ampla amb rotació (vòrtex helicoidal). Sobrecàrrega (110 MW): torxa estreta i centrada. b) els inverteix."],
["2506",19,7,"Quina de les següents afirmacions respecte al funcionament d’un aerogenerador es falsa:",["La velocitat de rotació variable permet modificar el “pitch” dels àleps","En els aerogeneradors moderns, des de un punt de vista mecànic el control es basa en la posició de “pitch” , la velocitat de rotació de les pales i la orientació de la góndola segons la direcció del vent.","La velocitat de rotació variable és útil per a reduir tensions durant ràfegues","La velocitat de rotació permet controlar l’angle d’incidència relatiu del vent respecte a les pales"],0,"La falsa és a): el pitch és el gir de la pala sobre el seu eix, un actuador independent de la velocitat de rotació. La velocitat sí canvia l’angle relatiu (via u = ωr) i ajuda en ràfegues."],
["2506",20,7,"El aerogenerador SG DD-XXX, un dels mes potents del mon treballa amb una velocitat de 11m/s i extreu una potencia elèctrica de 21.5 MW en condicions de disseny. Suposeu un rendiment elèctric del 94%. Suposeu densitat aire 1.2 Kg/m^3. XXX representa el diàmetre del rotor. Quin pot ser aquest valor?",["228 m","248 m","276 m","320 m"],2,"Amb C<sub>p</sub> ≈ 0,48 (bon aerogenerador): A = 2P<sub>el</sub>/(ρc³C<sub>p</sub>η) = 59 670 m² ⇒ D = 276 m. Les altres opcions corresponen a C<sub>p</sub> de Betz (0,593) o massa baixos."],

// ===== Reavaluació 01/07/25 =====
["2507",1,1,"Una turbina hidràulica és bàsicament una màquina:",["Generadora de flux incompressible","Generadora de flux compressible","Receptora de flux incompressible","Receptora de flux compressible"],2,"Extreu energia de l’aigua (receptora) i l’aigua és incompressible."],
["2507",2,2,"Quina relació tenen les pèrdues a les canonades h<sub>f</sub> , la diferencia de cotes H<sub>o</sub> i l’altura d’elevació d’una bomba H<sub>b</sub>?",["H<sub>b</sub>=H<sub>o</sub>+h<sub>f</sub>","H<sub>b</sub>=H<sub>o</sub>-h<sub>f</sub>","H<sub>o</sub>=H<sub>b</sub>+h<sub>f</sub>","H<sub>o</sub>=H<sub>b</sub>"],0,"Al punt de funcionament la bomba ha de vèncer el desnivell més les pèrdues: H<sub>b</sub> = H<sub>o</sub> + h<sub>f</sub>. b) i c) són la relació de turbina."],
["2507",3,1,"Una bomba te l’equació Hb= 200-16*Q<sup>2</sup> (unitats sistema internacional). Quina equació característica tindrà una bomba a escala, amb el doble de diàmetre, segons les relacions de semblança?",["Hb= 200-16*Q<sup>2</sup>","Hb= 400-1* Q<sup>2</sup>","Hb=600-8* Q<sup>2</sup>","Hb=800-1* Q<sup>2</sup>"],3,"Mateixa n, D×2: k<sub>H</sub> = 4, k<sub>Q</sub> = 8. A’ = 4·200 = 800; B’ = 16·4/8² = 1 ⇒ H = 800 − Q²."],
["2507",4,5,"Una bomba centrífuga amb angle d’àleps a l’entrada de 45º treballa per sota de disseny amb un angle d’incidència de 5º, . El cabal que passa per la bomba és 1 m^3/s i es coneix que el diàmetre d’entrada és 0.5 m i l’amplada a l’entrada 0.05m . Quina es la velocitat de rotació de la bomba en rpm? Suposeu que no hi ha prerotació",["430 rpm","580 rpm","730 rpm","900 rpm"],1,"β<sub>1f</sub> = 45 − 5 = 40°. c<sub>1m</sub> = 1/(π·0,5·0,05) = 12,73 m/s ⇒ u<sub>1</sub> = c<sub>1m</sub>/tan 40° = 15,17 m/s ⇒ n = 60u<sub>1</sub>/(πD<sub>1</sub>) = 580 rpm."],
["2507",5,5,"A la sortida, la velocitat relativa te una desviació de 10 graus i l’angle dels àleps a la sortida es 30º. L’amplada a la sortida es la mateixa que a l’entrada i el diàmetre 1m. Quina es la velocitat u2 tangencial a la sortida?",["30.34 m/s","15.2 m/s","60.3 m/s","20.4 m/s"],0,"Mateixa ω: u<sub>2</sub> = u<sub>1</sub>·D<sub>2</sub>/D<sub>1</sub> = 15,17·2 = 30,34 m/s. 15,2 és u<sub>1</sub>."],
["2507",6,5,"Quina es l’altura d’elevació teòrica que dona la bomba?",["29.77 m","39.77 m","49.77 m","59.77 m"],1,"β<sub>2f</sub> = 30 − 10 = 20°; c<sub>2m</sub> = 1/(π·1·0,05) = 6,37 m/s; w<sub>2u</sub> = 6,37/tan 20° = 17,49 ⇒ c<sub>2u</sub> = 12,86. Sense prerotació: H<sub>th</sub> = u<sub>2</sub>c<sub>2u</sub>/g = 39,77 m."],
["2507",7,6,"Una bomba axial amb directrius a la sortida impulsa un cabal de 5 m3/s en condicions de disseny. El diàmetre de la punta de la bomba es Dt=1m, i el del cub Dh=0.3m. Si la bomba gira a 100 rpm, quina orientació tenen els àleps a l’entrada a la secció de la punta?",["53.18º","43.18º","33.18º","63.18º"],0,"u = π·100·1/60 = 5,24 m/s; c<sub>m</sub> = 5/[π/4·(1−0,09)] = 7,0 m/s. Directrius a la sortida ⇒ entrada axial; disseny ⇒ β<sub>1a</sub> = atan(c<sub>m</sub>/u) = 53,2°."],
["2507",8,6,"A la sortida d’aquesta bomba es te que els àleps tenen un angle de 80º i que no hi ha desviació. Quina es l’altura d’elevació que dona la bomba?",["5.13m","4.30 m","2.14 m","1.23 m"],2,"A la punta: w<sub>2u</sub> = c<sub>m</sub>/tan 80° = 1,23 ⇒ c<sub>2u</sub> = 5,24 − 1,23 = 4,0 m/s. H = u·c<sub>2u</sub>/g = 2,14 m. 1,23 és w<sub>2u</sub>."],
["2507",9,1,"Quina de les següents bombes te una empenta axial reduïda?",["Multicelular","Bomba de doble entrada","Bomba centrífuga normal","Bomba centrífuga de salt elevat"],1,"La doble entrada és simètrica i compensa l’empenta axial. La multicel·lular i les de salt elevat en tenen més."],
["2507",10,1,"Les pèrdues hidràuliques per fricció en bombes centrífugues:",["Son directament proporcionals al cabal al quadrat","Apareixen únicament quan la bomba treballa fora de disseny","Son màximes quan la bomba treballa amb vàlvula tancada a la sortida","Son mínimes quan la bomba no dona altura d’elevació"],0,"Fricció ≈ k·Q²: existeixen a qualsevol cabal (també en disseny) i són màximes a cabal màxim (H → 0), no amb vàlvula tancada. Les que són mínimes al BEP són les de xoc."],
["2507",11,2,"En un circuit de bombeig, es te el dipòsit inferior a 10 m y el superior a 110 m (sobre el nivell del mar). Les canonades tenen un coeficient de fricció de 0.03, la longitud a l’aspiració es de 100m i a la impulsió de 1000m. El diàmetre de canonades 1m. Quan la bomba treballa en disseny, el seu cabal es 1m^3/s. Quines serien les pèrdues a la canonada?",["10 m","7.8 m","5.13 m","2.73 m"],3,"h<sub>f</sub> = 8fLQ²/(π²D⁵g) = 8·0,03·1100·1²/(π²·1·9,81) = 2,73 m (L total = 100 + 1000)."],
["2507",12,3,"Suposeu que la bomba anteriorment descrita te una corba Hb1=200-97.27*Q<sup>2</sup>. Si posem en sèrie una bomba que te la següent corba característica Hb2=150-50*Q<sup>2</sup> i en el mateix circuit, quin cabal passarà pel circuit?",["1.8 m3/s","1.1 m3/s","1.3 m3/s","1.2 m3/s"],2,"Sèrie: H = 350 − 147,27Q². Circuit: H = 100 + 2,73Q². 250 = 150Q² ⇒ Q = 1,29 ≈ 1,3 m³/s."],
["2507",13,3,"En un altre circuit, que no es descriu, les dues bombes treballen en sèrie amb un Q=1m^3/s. Si tenen un rendiment de la màquina hidràulica de 0.8 i del motor elèctric un 0.95, quin es el cost horari de l’explotació del circuit? Suposeu preu de l’energia a 0.12 €/kWh",["225 €","275 €","314 €","365 €"],2,"H<sub>1</sub>(1) = 102,73 m, H<sub>2</sub>(1) = 100 m. P<sub>hid</sub> = 9810·1·202,73 = 1989 kW. P<sub>el</sub> = 1989/(0,8·0,95) = 2617 kW ⇒ 2617 kWh·0,12 = 314 €/h."],
["2507",14,2,"Quina de les següents mesures es efectiva per disminuir la cavitació en una bomba?",["Augmentar el diàmetre del tub d’aspiració","Fer que el dipòsit inferior treballi per sota la pressió atmosfèrica","Fer que la bomba treballi fora de disseny","Escalfar l’aigua que circula per la bomba abans de que entri a aquesta"],0,"Més diàmetre a l’aspiració ⇒ menys velocitat i menys h<sub>asp</sub> ⇒ NPSH<sub>d</sub> puja. b) i d) el baixen; c) sol pujar l’NPSH<sub>r</sub>."],
["2507",15,2,"Un petit circuit hidràulic amb una bomba incorporada funciona correctament sense cavitació a nivell de mar. Quan repliquem el mateix circuit (la mateixa bomba, la mateixa diferencia de cotes, les mateixes canonades i disposició) i el fem operar a 3000 m.a.s.l (metres sobre nivell de mar) s’observa que la bomba te cavitació tot i funcionar amb el mateix cabal. A que es degut?",["A 3000m l’aigua està més freda i això disminueix el NPSH disponible","A 3000m la bomba te un NPSH requerit mes alt","A 3000m la bomba te un NPSH requerit mes baix","A 3000m la pressió atmosfèrica es inferior i això disminueix el NPSH disponible"],3,"p<sub>atm</sub>/ρg baixa d’uns 10,3 m a uns 7 m ⇒ NPSH<sub>d</sub> baixa. L’NPSH<sub>r</sub> és propi de la bomba i no canvia; l’aigua freda tindria menys p<sub>v</sub> (milloraria)."],
["2507",16,5,"Quina de les següents característiques defineix els ventiladors d’àleps corbats endavant?",["β<sub>1-alep</sub>>90","β<sub>2-alep</sub><90","C<sub>2u</sub>>u<sub>2</sub>","C<sub>m1</sub>=C<sub>m2</sub>"],2,"β<sub>2a</sub> > 90° ⇒ w<sub>2u</sub> en el sentit de gir ⇒ c<sub>2u</sub> = u<sub>2</sub> − w<sub>2u</sub> > u<sub>2</sub>. b) és corbat enrere; el criteri és a la sortida (β<sub>2</sub>), no a l’entrada."],
["2507",17,4,"En quina de les següents turbines s’ha arribat a una potencia per unitat més elevada?",["Pelton","Francis","Kaplan","En les tres, la potencia màxima que s’ha aconseguit, es similar"],1,"Les Francis tenen els grups més potents (al voltant d’1 GW per unitat, p. ex. Baihetan) i són el tipus més instal·lat."],
["2507",18,4,"Marqueu la opció correcta pel que fa al mecanisme regulació de cabal en les següents turbines hidràuliques",["Francis: Injector, Kaplan: Injector, Pelton: Directrius","Francis: Directrius, Kaplan: Injector, Pelton: Injector","Francis: Directrius, Kaplan: Directrius, Pelton: Injector","Francis: Injector, Kaplan: Directrius, Pelton: Injector"],2,"Les de reacció (Francis i Kaplan) regulen amb el distribuïdor de directrius (la Kaplan a més gira els àleps). La Pelton, amb l’agulla de l’injector."],
["2507",19,4,"Quin es el fenomen més característic d’una Turbina Francis treballant en càrrega parcial?",["Cavitació a la punta de l’àlep","Erosió a la cullera","Torxa estreta i estable","Torxa ampla amb rotació"],3,"A càrrega parcial c<sub>2u</sub> > 0 ⇒ vòrtex ample amb rotació al tub d’aspiració. La torxa estreta és de sobrecàrrega; la cullera és de Pelton; la cavitació a la punta és típica de Kaplan."],
["2507",20,7,"Quin grup de variables ha de controlar un aerogenerador en condicions reals d’operació per a maximitzar la potencia extreta del vent en la major part de situacions possibles?",["Orientació de la gòndola, velocitat de rotació","Orientació de la gòndola, velocitat de rotació, pitch de les pales","Velocitat de rotació","Pitch de les pales"],1,"Gòndola encarada al vent, velocitat per mantenir λ òptim i pitch per a vents alts o ràfegues: les tres."],

// ===== Final 20/01/26 =====
["2601",1,4,"Una turbina Francis genera 400 MW de potència elèctrica. El rendiment de l’alternador es de 0,98, el mecànic 0,99 i el volumètric 0,99. Si pel circuit hidràulic baixen 200 m3/s i les cotes dels dipòsits inferior i superior són 100 m i 250 m, quin serà el rendiment hidràulic del rodet?",["0,85","0,9","0,95","No es pot calcular sense conèixer més detalls del circuit hidràulic."],3,"η<sub>h</sub> es defineix sobre el salt NET, i per passar del salt brut (150 m) al net cal conèixer les pèrdues del circuit, que no es donen. De fet, amb 150 m bruts la potència hidràulica bruta (294 MW) ni tan sols arriba a 400 MW."],
["2601",2,4,"La turbina Pelton té una capacitat de regulació superior a les Kaplan i a les Francis quan:",["Té un salt molt elevat.","Té un cabal molt elevat.","Té múltiples injectors.","En cap cas millora la capacitat de regulació de les Kaplan."],2,"Amb diversos injectors es poden tancar-ne alguns i deixar els altres a prop de la seva obertura òptima: rendiment alt en un rang de càrrega molt ampli."],
["2601",3,5,"Quina característica principal tindran els triangles de velocitat d’una turbina Francis treballant en càrregues parcials?",["La incidència serà negativa.","L’angle α a la sortida serà 90°.","La u a la sortida serà més gran.","C<sub>2u</sub> serà positiva."],3,"Amb menys cabal (c<sub>2m</sub> menor) i el mateix β<sub>2</sub>, c<sub>2u</sub> = u<sub>2</sub> − w<sub>2u</sub> > 0: el flux surt girant amb el rodet (causa de la torxa). α<sub>2</sub> = 90° només en disseny; u és fixa."],
["2601",4,7,"El límit de Betz correspon a la següent descripció:",["Rati entre potència mecànica i elèctrica, obtinguda en un aerogenerador experimentalment.","Rati entre potència mecànica i disponible en el fluid, obtinguda teòricament.","Rati entre potència mecànica i elèctrica, obtinguda en un aerogenerador teòricament.","Rati entre potència mecànica i disponible en el fluid, obtinguda experimentalment."],1,"C<sub>p,Betz</sub> = 16/27 ≈ 0,593 és el màxim teòric (teoria de disc actuador) de P<sub>mec</sub>/(½ρAc³). Els aerogeneradors reals arriben a 0,45-0,50."],
["2601",5,7,"Considereu la gràfica del formulari respecte al Cp d’un aerogenerador. L’aerogenerador pot variar la seva velocitat entre 5 i 20 rpm, orientar els àleps al vent i girar-los. Inicialment treballa amb un Cp 0,47, corresponent al màxim. En aquestes condicions (1) tenim c<sub>1,vent</sub>, n<sub>1</sub> = 10 rpm, β<sub>1</sub>. En una nova situació (2) tenim que el vent ha disminuït fins c<sub>2,vent</sub> = c<sub>1,vent</sub>/4. Quina seria la millor solució possible per n<sub>2</sub>, β<sub>2</sub>?",["n<sub>2</sub> = 5 rpm, β<sub>2</sub> = 0°","n<sub>2</sub> = 20 rpm, β<sub>2</sub> = 5°","n<sub>2</sub> = 5 rpm, β<sub>2</sub> = 5°","n<sub>2</sub> = 20 rpm, β<sub>2</sub> = 0°"],2,"Inicialment λ ≈ 8 (β = 0°). Amb vent/4, per mantenir λ caldria n = 2,5 rpm; el mínim és 5 rpm ⇒ λ = 16. A λ = 16 la corba de 0° ja és nul·la, i la de 5° encara dona C<sub>p</sub> ≈ 0,15: n = 5 rpm i β = 5°.","cp"],
["2601",6,6,"El rotating stall en els ventiladors axials succeeix quan:",["El ventilador treballa a cabals molt baixos i (el despreniment) gira, des del punt de vista absolut, en el mateix sentit que el ventilador.","El ventilador treballa a cabals molt baixos i gira, des del punt de vista absolut, en sentit contrari al ventilador.","El ventilador treballa a cabals molt elevats i gira, des del punt de vista absolut, en sentit contrari al ventilador.","El ventilador treballa a cabals molt elevats i gira, des del punt de vista absolut, en el mateix sentit que el ventilador."],0,"Apareix a cabals baixos. Respecte al rotor la cel·la es mou en sentit contrari al gir, però més lent que el rotor, així que vista des de fora gira en el MATEIX sentit (a una fracció de la velocitat)."],
["2601",7,5,"Quan anem millorant l’àlep d’un ventilador centrífug, és a dir, quan passem de xapa recta a xapa corbada, observem en general:",["Millor comportament respecte a l’eficiència i a l’abrasió.","Pitjor comportament respecte a l’eficiència i a l’abrasió.","Millor comportament respecte a l’eficiència i pitjor respecte a l’abrasió.","Pitjor comportament respecte a l’eficiència i millor respecte a l’abrasió."],2,"Xapa recta: robusta, bona amb pols i partícules (abrasió), rendiment mig. Xapa corbada (i encara més perfil aerodinàmic): més rendiment però més sensible a l’abrasió."],
["2601",8,2,"Quin sol ser el punt més crític respecte a la cavitació en els àleps de bombes centrífugues:",["Cara de pressió a l’entrada.","Cara de pressió a la sortida.","Cara de succió a la sortida.","Cara de succió a l’entrada."],3,"El mínim de pressió és a l’entrada, a la cara de succió de l’àlep."],
["2601",9,1,"Respecte a les corbes característiques en bombes axials:",["Tenen una corba de potència consumida ascendent.","Presenten inestabilitats a cabals alts.","Tenen una corba de potència consumida plana.","Presenten inestabilitats a cabals baixos."],3,"L’axial té zona inestable a cabals per sota del de disseny i la potència és màxima a Q = 0 (corba descendent). Ascendent és la de la centrífuga i plana la de la semiaxial."],
["2601",10,5,"Quines pèrdues s’han de considerar en passar de la corba teòrica amb infinits àleps fins a la corba real d’una bomba centrífuga",["Circulació, fricció, re-circulació i pèrdues per una incidència dolenta (“shock”)","Fricció, re-circulació i pèrdues per una incidència dolenta (“shock”)","Fricció, re-circulació","Fricció"],1,"De H<sub>th,∞</sub> a H<sub>th,finits</sub> hi ha la «circulació» (desviació), que NO és una pèrdua d’energia. De H<sub>th,finits</sub> a H<sub>real</sub>: fricció, xoc i recirculació. Per això a) és la trampa."],
["2601",11,1,"Quin tipus de màquina es fa servir en sistemes de potència fluida, com el sistema hidràulic d’una excavadora?",["Turbomàquina generadora de flux incompressible","Turbomàquina generadora de flux compressible","Màquina de desplaçament positiu de flux compressible","Màquina de desplaçament positiu de flux incompressible"],3,"L’oleohidràulica treballa a pressions molt altes i cabals petits: bombes volumètriques (pistons, engranatges) amb oli, incompressible."],
["2601",12,1,"En quin tipus d’anàlisi es basa la Mecànica de Fluids Computacional (CFD)?",["Anàlisi integral","Anàlisi diferencial","Anàlisi d’elements finits","Anàlisi dimensional"],1,"El CFD resol numèricament les equacions diferencials (Navier-Stokes) punt a punt. L’anàlisi integral dona Euler i balanços globals; els elements finits són un mètode numèric, no el tipus d’anàlisi."],
["2601",13,1,"Quan comparem model i prototipus d’una turbomàquina fabricats amb el mateix material i per on circula el mateix fluid:",["El número de Reynolds és més petit en el model, ja que la contribució relativa de les forces inercials és major.","Per extrapolar el rendiment del model al prototipus, s’ha de tenir en compte l’escala de velocitat de rotació.","La contribució relativa de les forces de fricció és major en el model i, per això, el rendiment és menor.","Per un punt homòleg de funcionament, el rendiment del prototip és proporcional al del model."],2,"Model petit ⇒ Re menor (pesen més les forces viscoses, no les inercials) i més rugositat relativa ⇒ més fricció relativa ⇒ menys rendiment. La correcció depèn de D, no de n."],
["2601",14,5,"Quina de les següents definicions descriu de manera més general el teorema de transport de Reynolds?",["Estableix que la variació del moment angular d’un flux és igual al parell de forces aplicat sobre el rodet.","Permet obtenir la velocitat absoluta d’una partícula a partir de la seva velocitat relativa i la velocitat del sistema de referència.","Relaciona l’evolució temporal d’una propietat d’un sistema amb el que entra, surt i s’acumula dins d’un volum de control.","Permet reduir el nombre de variables independents combinant-les en grups adimensionals."],2,"És el pont entre sistema i volum de control per a qualsevol propietat extensiva. a) és un cas particular (moment angular ⇒ Euler); b) és c = u + w; d) és Buckingham."],
["2601",15,2,"Tenim un circuit hidràulic amb una màquina reversible que pot treballar com a bomba o com a turbina. z1 és la cota del dipòsit inferior i z2 la cota del dipòsit superior. Escolliu la resposta correcta:",["És sempre cert que en mode bomba H<sub>bomba</sub> > z2-z1 i que en mode turbina H<sub>net</sub> > z2-z1.","Seguint la direcció del flux, la línia piezomètrica sempre acaba a l’alçada z2 en mode bomba i a l’alçada z1 en mode turbina.","El terme de difusió c<sup>2</sup>/2g té sempre el mateix valor, tant en mode turbina com en bomba.","Seguint la direcció del flux, la línia de càrrega sempre comença a l’alçada z1 en mode bomba i acaba a l’alçada z1 en mode turbina."],1,"La piezomètrica acaba a la superfície lliure del dipòsit d’arribada (p = 0 relativa, c → 0): z2 en bomba, z1 en turbina. En turbina H<sub>n</sub> < z2 − z1; la línia de càrrega arriba per sobre del dipòsit en c²/2g."],
["2601",16,6,"Un ventilador axial amb directrius a la sortida i dimensions Dp=1,8 m i Db=0,6 m treballa en el seu punt de disseny amb un cabal de 18 m3/s. Sabent que la velocitat de gir és de 120 rpm, quin angle β1a han de tenir els àleps al diàmetre mig de l’entrada per a tenir incidència i=0?",["46,54°","43,17°","35,13°","14,78°"],0,"D<sub>m</sub> = 1,2 m ⇒ u = π·120·1,2/60 = 7,54 m/s. c<sub>m</sub> = 18/[π/4·(1,8²−0,6²)] = 7,96 m/s. Entrada axial: β<sub>1a</sub> = atan(c<sub>m</sub>/u) = 46,5°."],
["2601",17,6,"L’angle dels àleps al diàmetre mig de la sortida és β2a=72° i la desviació δ=5°. Quina és la velocitat absoluta c2 a la sortida?",["8,03 m/s","9,37 m/s","9,79 m/s","8,89 m/s"],3,"β<sub>2f</sub> = 72 − 5 = 67° ⇒ w<sub>2u</sub> = 7,96/tan 67° = 3,38 ⇒ c<sub>2u</sub> = 7,54 − 3,38 = 4,16 m/s ⇒ c<sub>2</sub> = √(7,96² + 4,16²) ≈ 8,98 m/s. La clau oficial és d) 8,89 (l’opció més propera; diferència d’arrodoniment)."],
["2601",18,5,"Una bomba centrífuga treballa amb un cabal Q = 0,5 m3/s. Les seves dimensions són D1=0,3 m, b1=0,05 m, D2=0,5 m i b2=0,03 m. La velocitat de rotació és n=1000 rpm i l’angle de l’àlep a l’entrada és β1a=30°. Considerant entrada radial, amb quina incidència entra el flux al rodet?",["-17,51°","-4,04°","-12,49°","11,34°"],1,"c<sub>1m</sub> = 0,5/(π·0,3·0,05) = 10,61 m/s; u<sub>1</sub> = 15,71 m/s ⇒ β<sub>1f</sub> = atan(10,61/15,71) = 34,04°. i = β<sub>1a</sub> − β<sub>1f</sub> = −4,04° (cabal per sobre del de disseny)."],
["2601",19,5,"Quan la mateixa bomba treballa a un 30% del cabal anterior, el flux entra amb prerotació, inclinat 18° respecte la c1 del cas anterior. Amb quina velocitat w1 veuen els àleps entrar el flux en aquest punt de funcionament?",["15,01 m/s","18,96 m/s","16,03 m/s","12,40 m/s"],0,"c<sub>1m</sub> = 0,3·10,61 = 3,18 m/s; c<sub>1u</sub> = 3,18·tan 18° = 1,03 m/s (en el sentit de gir). w<sub>1u</sub> = 15,71 − 1,03 = 14,67 ⇒ w<sub>1</sub> = √(14,67² + 3,18²) = 15,01 m/s."],
["2601",20,5,"Quan la mateixa bomba treballa amb totes les condicions inicialment descrites per Q=0,5 m3/s, l’altura teòrica que dona és de H=20 m. Sabent que l’àlep té una inclinació a la sortida β2a=31°, quina desviació δ té el fluid?",["1,41°","-3,60°","2,32°","8,34°"],0,"u<sub>2</sub> = 26,18 m/s ⇒ c<sub>2u</sub> = 20·9,81/26,18 = 7,49 m/s. c<sub>2m</sub> = 0,5/(π·0,5·0,03) = 10,61 ⇒ w<sub>2u</sub> = 18,69 ⇒ β<sub>2f</sub> = 29,6°. δ = 31 − 29,6 = 1,4°."]
];
