[1,"Quina de les següents màquines NO és una turbomàquina de flux incompressible?",["Un ventilador centrífug","Una turbina Kaplan","Un compressor axial d’una turbina de gas","Un aerogenerador"],2,"El compressor d’una turbina de gas treballa amb gas a alta velocitat (Ma > 0,3) i canvis de densitat importants: flux compressible. Ventiladors, turbines hidràuliques i aerogeneradors són de flux incompressible."],
[1,"Escolliu l’opció correcta sobre la classificació de bombes segons la direcció del flux, per a dimensions i velocitat de gir semblants:",["Les axials s’utilitzen per a altures elevades i cabals baixos","Les centrífugues s’utilitzen per a altures elevades i cabals baixos","Les semiaxials tenen D1 = D2","En una bomba axial el flux surt radialment a 90°"],1,"Centrífuga: entra axial i surt radial, D1 ≪ D2, altures elevades i cabals baixos. Axial: D1 = D2, altures baixes i cabals grans. La semiaxial és el cas intermedi (D1 < D2)."],
[1,"Una bomba centrífuga multicel·lular és equivalent a:",["Diverses bombes en paral·lel, per aconseguir més cabal","Una bomba amb inductor, per reduir la cavitació","Diverses bombes en sèrie, per aconseguir més altura","Una bomba de doble entrada, per reduir l’empenta axial"],2,"Diversos rodets al mateix eix: el cabal passa per tots i les altures se sumen (sèrie). El paral·lel equivalent és la doble entrada, que dona més cabal i compensa l’empenta axial."],
[1,"Les pèrdues per fricció de disc en una bomba centrífuga afecten principalment:",["El rendiment hidràulic","El rendiment volumètric","L’altura teòrica d’Euler","El rendiment mecànic"],3,"La fricció del disc (fluid entre el rodet i la carcassa) consumeix potència a l’eix sense afectar l’altura: entra a η<sub>m</sub>. Creix com ω³D⁵, per això pesa en centrífugues grans d’altura elevada."],
[1,"Què representa el rendiment volumètric d’una bomba?",["La relació entre el cabal útil del circuit i el cabal que passa pel rodet","La relació entre l’altura real i l’altura teòrica","La relació entre la potència hidràulica i la potència mecànica","La relació entre el cabal del rodet i el cabal útil, sempre més gran que 1"],0,"η<sub>v</sub> = Q/Q<sub>th</sub> = Q/(Q + Q<sub>fuites</sub>) < 1: el rodet mou també el cabal que fuga. La relació d’altures és η<sub>h</sub> i la de potències, η<sub>bomba</sub>."],
[1,"Com és la corba de potència mecànica respecte al cabal en una bomba centrífuga i com s’arrenca?",["Màxima a Q = 0; s’arrenca amb vàlvula oberta","Mínima a Q = 0; s’arrenca amb vàlvula tancada","Plana; és indiferent com s’arrenca","Mínima a Q = 0; s’arrenca amb vàlvula oberta"],1,"En una centrífuga la potència creix amb el cabal i és mínima a Q = 0, per això s’arrenca amb la vàlvula d’impulsió tancada. L’axial és el cas contrari (màxim a Q = 0, vàlvula oberta)."],
[1,"Quants grups adimensionals independents surten de l’anàlisi dimensional d’una bomba si es consideren 8 variables (Q, D, n, ρ, μ, ε, E, P) i el rang de la matriu dimensional és 3?",["3","8","11","5"],3,"Teorema Π de Buckingham: p = n − r = 8 − 3 = 5 (φ, ψ, λ, Re i δ). En el rang normal Re i δ tenen efecte quasi constant i queda ψ = g<sub>1</sub>(φ), λ = g<sub>2</sub>(φ)."],
[1,"Què indica la velocitat específica n<sub>q</sub> = n·√Q / H<sup>3/4</sup> d’una bomba?",["El tipus de rodet més adequat (centrífug, semiaxial o axial), independentment de la mida","La velocitat de gir màxima abans de cavitar","El rendiment volumètric de la bomba","La relació entre el diàmetre d’entrada i el de sortida en mil·límetres"],0,"n<sub>q</sub> no depèn de la mida: n<sub>q</sub> baixa ⇒ rodet centrífug (H alta, Q petit); n<sub>q</sub> alta ⇒ axial. També dona idea del rendiment màxim assolible."],
[1,"Dos punts de funcionament de dues bombes geomètricament semblants són homòlegs quan:",["Tenen la mateixa altura i el mateix cabal","Treballen en el mateix circuit","Tenen els mateixos coeficients φ i ψ","Giren a la mateixa velocitat"],2,"Homòlegs = mateix punt de la corba adimensional ψ-φ (mateixos triangles de velocitats semblants). No vol dir mateix circuit: el punt homòleg no és el nou punt de funcionament."],
[1,"Quina funció té la voluta (cambra espiral) d’una bomba centrífuga?",["Augmentar la velocitat del flux abans del rodet","Reduir la cavitació a l’entrada","Donar prerotació al flux d’entrada","Recollir el flux a la sortida del rodet amb una distribució de velocitat homogènia i conduir-lo a la sortida"],3,"La secció creixent de l’espiral recull el cabal que surt del rodet al llarg de tota la perifèria mantenint una velocitat homogènia, i el porta a la brida d’impulsió."],
[1,"Una bomba impulsa Q = 0,05 m³/s d’aigua amb una altura H = 40 m i un rendiment de bomba η = 0,75. Quina potència mecànica cal a l’eix?",["19,6 kW","26,2 kW","14,7 kW","34,9 kW"],1,"P<sub>hid</sub> = ρgQH = 1000·9,81·0,05·40 = 19,62 kW. P<sub>mec</sub> = P<sub>hid</sub>/η = 19,62/0,75 = 26,2 kW. 19,6 és oblidar el rendiment i 14,7, multiplicar-hi en lloc de dividir.",1],
[1,"El motor d’una bomba entrega 15 kW a l’eix girant a 1450 rpm. Quin és el parell a l’eix?",["10,3 N·m","197,6 N·m","98,8 N·m","620,7 N·m"],2,"ω = 1450·2π/60 = 151,8 rad/s. τ = P/ω = 15000/151,8 = 98,8 N·m. Dividir per les rpm dona 10,3 i per les rps (24,2) dona 620,7: cal passar a rad/s.",1],
[1,"Una bomba consumeix 70 kW a 1500 rpm. Si la mateixa bomba, amb el mateix fluid, passa a girar a 1200 rpm, quina potència consumirà al punt homòleg?",["35,8 kW","44,8 kW","56,0 kW","22,9 kW"],0,"Mateixa bomba i fluid: P ∝ n³ ⇒ P’ = 70·(1200/1500)³ = 70·0,512 = 35,8 kW. 44,8 surt d’usar n² (llei de l’altura) i 56,0, n (llei del cabal).",1],
[1,"Un model de bomba de D = 0,25 m té un rendiment del 80 %. Quin rendiment s’espera per al prototip semblant de D = 1 m al punt homòleg, amb la llei (1−η<sub>p</sub>)/(1−η<sub>m</sub>) = (D<sub>m</sub>/D<sub>p</sub>)<sup>0,25</sup>?",["0,80","0,95","0,90","0,86"],3,"1 − η<sub>p</sub> = 0,20·(0,25)<sup>0,25</sup> = 0,20·0,707 = 0,141 ⇒ η<sub>p</sub> = 0,86. 0,95 surt de no posar l’exponent 0,25 i 0,90, d’usar l’arrel quadrada. El prototip (gran) ha de rendir més.",1],

// ===== T2 · Punt de funcionament i cavitació (12; 3 de càlcul) =====
[2,"Què és la cavitació en una bomba?",["L’ebullició de l’aigua per escalfament dins la carcassa","La formació de bombolles de vapor per una reducció local de la pressió fins a la pressió de vapor, a temperatura constant","L’entrada d’aire per les juntes de l’aspiració","La formació de bombolles per l’augment de pressió a la sortida del rodet"],1,"És una «ebullició» per baixada de pressió (no per calor): l’acceleració local del flux (Bernoulli) baixa p fins a p<sub>v</sub>. L’entrada d’aire per juntes és un altre problema."],
[2,"Com varia l’NPSH disponible d’una instal·lació quan augmenta el cabal?",["Disminueix, perquè augmenten les pèrdues a l’aspiració","Augmenta, perquè augmenta la velocitat","No canvia, només depèn de les cotes","Disminueix, perquè augmenta l’NPSH requerit"],0,"NPSH<sub>d</sub> = p<sub>0</sub>/ρg + (z<sub>0</sub>−z<sub>1</sub>) − h<sub>asp</sub>(Q) − p<sub>v</sub>/ρg, i h<sub>asp</sub> ∝ Q². L’NPSH requerit també puja amb Q, però és una propietat de la bomba, no de la instal·lació."],
[2,"Quan apareix el dany per erosió de cavitació?",["Quan les bombolles es formen a la cara de succió","Quan les bombolles creixen fins al radi crític","Quan les bombolles col·lapsen en arribar a una zona de pressió més alta (microjet i ona de xoc)","Quan l’aigua surt de la bomba"],2,"El creixement és lent i inofensiu; el col·lapse és molt ràpid i genera sobrepressions locals enormes (microjet contra la paret i ona de xoc), que erosionen el material."],
[2,"Quin criteri fa servir el fabricant per definir l’NPSH requerit (cavitació desenvolupada) en un banc d’assaig?",["El valor d’NPSH en què apareix la primera bombolla visible","El valor d’NPSH en què el soroll supera 80 dB","El valor d’NPSH en què el cabal cau un 3 %","El valor d’NPSH en què l’altura d’elevació cau un 3 % a cabal constant"],3,"Es baixa la pressió d’entrada a cabal constant fins que H cau un 3 %. La primera bombolla correspon a la cavitació incipient, amb un NPSH més alt."],
[2,"Quina mesura NO augmenta l’NPSH disponible d’una bomba que aspira d’un dipòsit obert?",["Escurçar la canonada d’aspiració","Instal·lar la bomba en una cota més alta","Treure colzes i vàlvules de l’aspiració","Refredar el líquid"],1,"Pujar la bomba fa (z<sub>0</sub> − z<sub>1</sub>) més negatiu i baixa l’NPSH<sub>d</sub>. Escurçar l’aspiració o treure singularitats redueix h<sub>asp</sub>; refredar redueix p<sub>v</sub>."],
[2,"El punt de funcionament d’una bomba en un circuit és:",["El punt de màxim rendiment de la bomba","El tall entre la corba característica de la bomba i la corba resistent del circuit","El punt on la bomba no dona cabal","El punt on l’NPSH disponible és igual al requerit"],1,"La bomba treballa on l’altura que dona iguala la que demana el circuit (H<sub>o</sub> + pèrdues). Coincidir amb el BEP és l’objectiu de disseny, no una condició."],
[2,"En la corba resistent H<sub>r</sub> = H<sub>o</sub> + kQ² d’un circuit entre dos dipòsits, el terme H<sub>o</sub> és:",["La diferència de cotes entre les superfícies lliures (més la diferència de pressions si els dipòsits són pressuritzats)","Les pèrdues per fricció a cabal nominal","L’altura de la bomba a cabal nul","El terme de difusió"],0,"H<sub>o</sub> és la part estàtica (independent del cabal): Δz entre superfícies lliures + Δp/ρg. Les pèrdues i el terme de difusió van amb Q² i formen kQ²."],
[2,"Si dues bombes iguals funcionen en el mateix circuit, una a nivell del mar i l’altra a 2000 m d’altitud, amb el mateix cabal i temperatura:",["La de 2000 m té més NPSH disponible","Les dues tenen el mateix NPSH disponible","La de 2000 m té menys NPSH disponible","La de 2000 m té menys NPSH requerit"],2,"A 2000 m la p<sub>atm</sub> és menor (≈ 79,5 kPa) i el terme p<sub>0</sub>/ρg de l’NPSH<sub>d</sub> baixa uns 2,2 m. L’NPSH requerit és de la bomba i no canvia."],
[2,"En un perfil hidrodinàmic, la cavitació apareix al punt M de la cara de succió quan p(M) < p<sub>v</sub>. Expressat amb el coeficient de pressió c<sub>p</sub> i el nombre de cavitació σ, la condició és:",["c<sub>p</sub>(M) > σ","c<sub>p</sub>(M) = σ","c<sub>p</sub>(M) < −σ","σ < 0"],2,"Amb c<sub>p</sub> = (p(M) − p<sub>ref</sub>)/(½ρC<sub>ref</sub>²) i σ = (p<sub>ref</sub> − p<sub>v</sub>)/(½ρC<sub>ref</sub>²), p(M) < p<sub>v</sub> equival a c<sub>p</sub>(M) < −σ. Com més gran és σ (més pressió de referència), més difícil és cavitar."],
[2,"Una bomba aspira aigua a 20 °C (p<sub>v</sub> = 2340 Pa) d’un dipòsit obert (p<sub>atm</sub> = 101 325 Pa) i està 3 m per sobre de la superfície lliure. Les pèrdues a l’aspiració són 1,2 m. Quin és l’NPSH disponible?",["11,89 m","7,09 m","6,13 m","5,89 m"],3,"NPSH<sub>d</sub> = p<sub>atm</sub>/ρg − (z<sub>B</sub>−z<sub>0</sub>) − h<sub>asp</sub> − p<sub>v</sub>/ρg = 10,33 − 3 − 1,2 − 0,24 = 5,89 m. 11,89 és sumar els 3 m (bomba en càrrega), 7,09 oblidar h<sub>asp</sub> i 6,13 oblidar p<sub>v</sub>.",1],
[2,"Una bomba amb NPSH<sub>r</sub> = 4 m aspira d’un dipòsit obert (p<sub>atm</sub> = 101 325 Pa) aigua amb p<sub>v</sub> = 2340 Pa. Si les pèrdues a l’aspiració són 0,8 m, a quina altura màxima sobre la superfície lliure es pot instal·lar?",["5,29 m","6,09 m","5,53 m","13,29 m"],0,"Límit: NPSH<sub>d</sub> = NPSH<sub>r</sub> ⇒ z<sub>màx</sub> = 10,33 − 0,8 − 0,24 − 4 = 5,29 m. 6,09 oblida h<sub>asp</sub>, 5,53 oblida p<sub>v</sub> i 13,29 suma l’NPSH<sub>r</sub>.",1],
[2,"Un circuit té una diferència de cotes de 30 m i una canonada de L = 500 m, D = 0,2 m i f = 0,02 (sense pèrdues singulars ni terme de difusió). Quina altura demana el circuit per a Q = 0,05 m³/s?",["6,5 m","36,5 m","42,9 m","31,3 m"],1,"h<sub>f</sub> = 8fLQ²/(π²D⁵g) = 8·0,02·500·0,05²/(π²·0,2⁵·9,81) = 6,46 m ⇒ H<sub>r</sub> = 30 + 6,46 = 36,5 m. 6,5 és només la pèrdua i 31,3 surt de posar D⁴ en lloc de D⁵.",1],

// ===== T3 · Regulació (10; 3 de càlcul) =====
[3,"Per què no es regula el cabal d’una bomba axial amb una vàlvula en sèrie?",["Perquè la vàlvula en sèrie augmenta el cabal","Perquè en reduir el cabal augmenten la potència consumida i el risc d’inestabilitat","Perquè les bombes axials no admeten vàlvules","Perquè la vàlvula en sèrie només funciona amb bombes multicel·lulars"],1,"Estrangular redueix el cabal de la bomba; en una axial això fa pujar la potència (màxima a Q = 0) i l’acosta a la zona inestable. Per a axials es prefereix bypass, velocitat variable o àleps orientables."],
[3,"Amb una vàlvula en bypass (en paral·lel amb la bomba):",["Baixen el cabal del circuit i el de la bomba","El cabal de la bomba augmenta i el del circuit disminueix","El cabal del circuit augmenta","L’altura de la bomba augmenta"],1,"Part del cabal impulsat torna a l’aspiració: Q<sub>b</sub> = Q<sub>circ</sub> + Q<sub>v</sub>. La bomba es desplaça cap a cabals més alts (i menys H) mentre el circuit rep menys."],
[3,"Quin mètode de regulació del punt de funcionament és òptim des del punt de vista del rendiment, encara que necessita un variador de freqüència?",["Vàlvula en sèrie","Vàlvula en bypass","Variació de la velocitat de gir","Retornar part del cabal al dipòsit inferior"],2,"Canviant n es desplaça tota la corba de la bomba (semblança) sense dissipar energia en una vàlvula. El límit és el cost del variador en màquines molt grans."],
[3,"Una bomba treballa al punt A girant a n<sub>1</sub>. Si es redueix la velocitat a n<sub>2</sub> sense canviar el circuit, el nou punt de funcionament:",["És l’homòleg d’A, amb Q<sub>2</sub> = Q<sub>1</sub>·n<sub>2</sub>/n<sub>1</sub>","És el mateix punt A","Només es pot trobar experimentalment","És el tall de la nova corba (transformada per semblança) amb la corba del circuit"],3,"Els homòlegs estan sobre una paràbola per l’origen, però el circuit té H<sub>o</sub> ≠ 0. Cal transformar tota la corba de la bomba i tornar a tallar-la amb el circuit."],
[3,"En connectar dues bombes iguals en paral·lel, la corba conjunta s’obté:",["Sumant les altures a igual cabal","Sumant els cabals a igual altura","Multiplicant l’altura per 2","Sumant cabals i altures"],1,"En paral·lel les dues bombes donen la mateixa H i els cabals se sumen. En sèrie és al revés: mateix cabal i se sumen les altures."],
[3,"La regulació per posició dels àleps (pitch) és característica de:",["Bombes axials amb àleps regulables","Bombes centrífugues multicel·lulars","Bombes de doble entrada","Qualsevol bomba centrífuga"],0,"Les axials d’àleps orientables tenen una corba per a cada angle i poden treballar amb bon rendiment en un rang ampli. Les centrífugues tenen els àleps fixos al rodet."],
[3,"Sobre la regulació amb vàlvula en sèrie, quina afirmació és correcta?",["L’energia entre la corba original i el punt de consigna es recupera a la sortida","Augmenta el cabal que passa per la bomba","L’energia que dona la bomba de més respecte al que demana el circuit original es dissipa a la vàlvula","És el mètode òptim en rendiment"],2,"La vàlvula afegeix una pèrdua h<sub>v</sub>: la bomba puja per la seva corba (menys Q, més H) i tot l’excés d’energia es dissipa. És simple però poc eficient."],
[3,"Una bomba H = 50 − 200Q² treballa en un circuit H = 20 + 100Q² (SI). Si s’hi afegeix una segona bomba idèntica en paral·lel, quin cabal circularà?",["0,632 m³/s","0,316 m³/s","0,447 m³/s","0,400 m³/s"],2,"Paral·lel: H = 50 − 200(Q/2)² = 50 − 50Q². Tall: 50 − 50Q² = 20 + 100Q² ⇒ Q = √(30/150) = 0,447 m³/s. Sola dona 0,316; 0,632 és duplicar el cabal (error típic) i 0,400 és el resultat en sèrie.",1],
[3,"La mateixa bomba (H = 50 − 200Q² a n<sub>1</sub>) en el circuit H = 20 + 100Q² passa a girar a n<sub>2</sub> = 0,8·n<sub>1</sub>. Quin és el nou cabal?",["0,200 m³/s","0,253 m³/s","0,316 m³/s","0,283 m³/s"],0,"Només canvia n: A’ = 50·0,8² = 32 i B igual ⇒ 32 − 200Q² = 20 + 100Q² ⇒ Q = √(12/300) = 0,200 m³/s. 0,253 = 0,316·0,8 és el punt homòleg, que no és sobre el circuit.",1],
[3,"La bomba H = 50 − 200Q² i el circuit H = 20 + 100Q² (SI). Es vol Q = 0,25 m³/s amb una vàlvula en sèrie h<sub>v</sub> = (40/α)Q². Quin grau d’obertura α cal?",["0,89","0,14","4,5","0,22"],3,"H<sub>b</sub>(0,25) = 37,5 m; circuit: 26,25 m ⇒ h<sub>v</sub> = 11,25 = (40/α)·0,0625 ⇒ 40/α = 180 ⇒ α = 0,22. 0,89 surt d’oblidar el quadrat de Q i 4,5 d’invertir la fracció.",1],

// ===== T4 · Turbines (12; 3 de càlcul) =====
[4,"Quin tipus de turbina és més adequat per a un salt d’uns 800 m i un cabal petit?",["Kaplan","Francis","Bulb","Pelton"],3,"Salts molt alts i cabals petits ⇒ n<sub>s</sub> molt baixa ⇒ Pelton (acció). Francis cobreix salts mitjans i Kaplan/bulb salts baixos amb molt de cabal."],
[4,"En una turbina, quina relació hi ha entre el cabal del circuit i el que passa pel rodet?",["El del rodet és més gran","El del rodet és més petit: η<sub>v</sub> = Q<sub>rodet</sub>/Q<sub>circuit</sub>","Són sempre iguals","Depèn de si la turbina és d’acció o de reacció"],1,"En turbina les fuites no passen pel rodet i no fan treball: Q<sub>rodet</sub> = η<sub>v</sub>·Q<sub>circuit</sub>. En bomba és al revés (el rodet mou més cabal que el del circuit)."],
[4,"Quin és l’ordre correcte dels components d’una turbina Francis en el sentit del flux?",["Tub d’aspiració, rodet, directrius, cambra espiral","Directrius, cambra espiral, rodet, tub d’aspiració","Cambra espiral, directrius fixes, distribuïdor, rodet, tub d’aspiració","Cambra espiral, rodet, distribuïdor, tub d’aspiració"],2,"Cambra espiral (reparteix el cabal) → predistribuïdor fix → distribuïdor de directrius mòbils (regula) → rodet → tub d’aspiració (recupera energia cinètica)."],
[4,"Per què la turbina Kaplan manté bon rendiment en un rang de càrrega ampli?",["Perquè té doble regulació: directrius i àleps del rodet orientables","Perquè gira a velocitat variable","Perquè té diversos injectors","Perquè no té tub d’aspiració"],0,"Ajustant alhora directrius i àleps manté incidència i c<sub>2u</sub> ≈ 0 en molts punts. Els injectors múltiples són el mecanisme de la Pelton."],
[4,"En una turbina Pelton, la velocitat del raig depèn principalment de:",["L’obertura de l’injector","El nombre d’injectors","El diàmetre del rodet","El salt net: c ≈ √(2gH<sub>n</sub>)"],3,"L’injector converteix la pressió en velocitat: c ≈ √(2gH<sub>n</sub>). L’obertura canvia la secció, i per tant el cabal, però no la velocitat del raig."],
[4,"Quina és la relació òptima ideal entre la velocitat de la cullera u i la del raig c en una Pelton, i la real?",["Ideal 1; real 0,9","Ideal 0,5; real ≈ 0,40-0,48","Ideal 0,25; real 0,3","Ideal 0,5; real 0,6"],1,"Amb θ = u/c = 0,5 el raig surt sense component tangencial absoluta (màxim teòric). Per les pèrdues reals l’òptim es desplaça una mica per sota: 0,40-0,48."],
[4,"En una turbina hidràulica, el salt net és:",["El salt brut més les pèrdues de les canonades","La diferència de cotes entre la turbina i el dipòsit inferior","L’energia per unitat de pes que el rodet transforma realment en treball","El salt brut menys les pèrdues de càrrega del circuit (canonada forçada i aspiració) i el terme de difusió"],3,"H<sub>n</sub> = H<sub>b</sub> − h<sub>pèrdues</sub> − c²/2g de sortida: és l’energia disponible entre entrada i sortida de la màquina. El rodet n’aprofita H<sub>n</sub>·η<sub>h</sub>."],
[4,"Per què la potència hidràulica és clau en el mercat elèctric amb molta eòlica i solar?",["Perquè és la font més barata","Perquè no necessita regulació","Perquè pot ajustar la potència en pocs segons movent les directrius i emmagatzemar energia amb bombament","Perquè sempre funciona al punt de disseny"],2,"La generació ha d’igualar el consum en tot moment. La hidràulica regula molt ràpid i, amb centrals reversibles, absorbeix excedents: compensa la variabilitat de l’eòlica i la solar."],
[4,"Què és la torxa (vòrtex) al tub d’aspiració d’una Francis a càrrega parcial?",["Un vòrtex ample amb rotació produït per la component c<sub>2u</sub> > 0 a la sortida del rodet","Una zona de cavitació a l’entrada de l’àlep produïda per incidència negativa","Una fuita de cabal entre el rodet i la carcassa","Un vòrtex estret i centrat sense rotació"],0,"A càrrega parcial el flux surt girant amb el rodet (c<sub>2u</sub> > 0) i forma un vòrtex helicoidal ample que genera pulsacions i vibracions. La torxa estreta i centrada és de sobrecàrrega."],
[4,"Una Pelton treballa amb H<sub>n</sub> = 600 m, θ = u/c = 0,46 i un alternador de 6 parells de pols a 50 Hz. Quin és el diàmetre del rodet (suposant c = √(2gH<sub>n</sub>))?",["0,95 m","1,91 m","2,07 m","3,81 m"],1,"c = √(2·9,81·600) = 108,5 m/s ⇒ u = 0,46·108,5 = 49,9 m/s. n = 50/6 = 8,33 rps = 500 rpm ⇒ ω = 52,4 rad/s. D = 2u/ω = 1,91 m. 0,95 és el radi i 2,07 surt d’usar θ = 0,5.",1],
[4,"Una turbina Francis turbina 40 m³/s amb un salt net de 120 m, amb rendiment de turbina 0,92 i d’alternador 0,97. Quina potència elèctrica dona?",["47,1 MW","43,3 MW","42,0 MW","52,8 MW"],2,"P<sub>hid</sub> = ρgQH<sub>n</sub> = 9810·40·120 = 47,1 MW. P<sub>el</sub> = 47,1·0,92·0,97 = 42,0 MW. 47,1 és la hidràulica, 43,3 oblida l’alternador i 52,8 divideix pels rendiments (com en una bomba).",1],
[4,"Un alternador de 8 parells de pols connectat a una xarxa de 50 Hz fixa la velocitat de la turbina en:",["750 rpm","375 rpm","187,5 rpm","3000 rpm"],1,"n = 60·f/p = 60·50/8 = 375 rpm (velocitat síncrona). 750 surt de confondre parells de pols amb pols (p = 4) i 3000 és la d’un sol parell.",1],

// ===== T5 · Cinemàtica centrífuga (15; 5 de càlcul) =====
[5,"En el triangle de velocitats d’un rodet, quina relació vectorial es compleix sempre?",["c = u − w","w = c + u","u = c + w","c = u + w"],3,"La velocitat absoluta és la suma de l’arrossegament (u = ωr, tangencial) i la relativa (w, la que veu l’àlep): c = u + w."],
[5,"Quina és l’equació d’Euler per a una màquina generadora?",["gH<sub>th</sub> = u<sub>2</sub>c<sub>2u</sub> − u<sub>1</sub>c<sub>1u</sub>","gH<sub>th</sub> = u<sub>1</sub>c<sub>1u</sub> − u<sub>2</sub>c<sub>2u</sub>","gH<sub>th</sub> = u<sub>2</sub>c<sub>2m</sub> − u<sub>1</sub>c<sub>1m</sub>","gH<sub>th</sub> = w<sub>2</sub>u<sub>2</sub> − w<sub>1</sub>u<sub>1</sub>"],0,"L’energia transferida és la variació del moment angular per unitat de massa: u<sub>2</sub>c<sub>2u</sub> − u<sub>1</sub>c<sub>1u</sub> (en receptora, el signe contrari). Només hi intervenen les components tangencials de c."],
[5,"En la forma «tres termes» de l’equació d’Euler, quin terme representa l’energia que el rodet dona en forma de pressió per efecte centrífug?",["(c<sub>2</sub>² − c<sub>1</sub>²)/2","(u<sub>2</sub>² − u<sub>1</sub>²)/2","(w<sub>1</sub>² − w<sub>2</sub>²)/2","u<sub>2</sub>c<sub>2u</sub>"],1,"E = (c<sub>2</sub>²−c<sub>1</sub>²)/2 [dinàmica] + (u<sub>2</sub>²−u<sub>1</sub>²)/2 [centrífuga] + (w<sub>1</sub>²−w<sub>2</sub>²)/2 [difusió relativa]. En una axial u<sub>1</sub> = u<sub>2</sub> i el terme centrífug desapareix."],
[5,"Amb entrada sense prerotació (c<sub>1u</sub> = 0) i àleps corbats enrere (β<sub>2f</sub> < 90°), com és la corba teòrica H<sub>th</sub>-Q?",["Una recta creixent","Una recta horitzontal","Una recta decreixent","Una paràbola amb màxim"],2,"H<sub>th</sub> = u<sub>2</sub>²/g − u<sub>2</sub>cot β<sub>2f</sub>·Q/(πD<sub>2</sub>b<sub>2</sub>g): amb cot β > 0 la pendent és negativa. Amb β = 90° seria horitzontal i amb β > 90°, creixent."],
[5,"Què és l’angle d’incidència a l’entrada d’un rodet?",["La diferència entre l’angle de l’àlep i l’angle del flux relatiu: i = β<sub>1a</sub> − β<sub>1f</sub>","La diferència entre α<sub>1</sub> i α<sub>2</sub>","L’angle entre c i u a la sortida","L’angle de desviació a la sortida"],0,"i = β<sub>1a</sub> − β<sub>1f</sub>. En disseny i = 0; a cabal baix i > 0 i a cabal alt i < 0. Amb i ≠ 0 apareixen pèrdues per xoc."],
[5,"Per què apareix desviació a la sortida d’un rodet real?",["Per la fricció del fluid amb les parets","Per la cavitació a la sortida","Perquè el nombre d’àleps és finit i el flux no queda perfectament guiat","Perquè la velocitat de gir no és constant"],2,"Amb àleps finits hi ha diferència de pressions entre cares i un remolí relatiu al canal: el flux surt amb β<sub>2f</sub> < β<sub>2a</sub>. No és una pèrdua d’energia, però redueix c<sub>2u</sub> i H<sub>th</sub>."],
[5,"Quins tres tipus d’àleps de sortida es fan servir en ventiladors centrífugs, ordenats de més a menys rendiment?",["Radials, corbats enrere, corbats endavant","Corbats enrere, radials, corbats endavant","Corbats endavant, radials, corbats enrere","Tots tenen el mateix rendiment"],1,"Corbats enrere (β<sub>2</sub> < 90°): millor rendiment. Radials (90°): robustos, bons amb partícules. Corbats endavant (β<sub>2</sub> > 90°): més prestacions per mida però pitjor rendiment."],
[5,"La prerotació a l’entrada en el sentit de gir del rodet (c<sub>1u</sub> > 0) fa que l’altura teòrica:",["Augmenti","No canviï","Es dupliqui","Disminueixi"],3,"H<sub>th</sub> = (u<sub>2</sub>c<sub>2u</sub> − u<sub>1</sub>c<sub>1u</sub>)/g: un c<sub>1u</sub> positiu resta. En canvi redueix w<sub>1</sub>, cosa que ajuda contra la cavitació."],
[5,"En una turbina Francis (receptora) en el punt de disseny, quina condició es busca a la sortida del rodet?",["c<sub>2u</sub> = u<sub>2</sub>","w<sub>2</sub> = 0","Sortida sense component tangencial absoluta (c<sub>2u</sub> = 0, α<sub>2</sub> = 90°)","c<sub>2m</sub> = 0"],2,"Amb c<sub>2u</sub> = 0 s’aprofita tot el moment angular (gH = u<sub>1</sub>c<sub>1u</sub>) i no hi ha torxa al tub d’aspiració. Fora de disseny apareix c<sub>2u</sub> ≠ 0."],
[5,"Si en un rodet centrífug es redueix l’amplada de sortida b<sub>2</sub> mantenint Q, n, D<sub>2</sub> i β<sub>2f</sub> < 90°, què passa amb H<sub>th</sub>?",["Augmenta, perquè augmenta c<sub>2m</sub>","Disminueix, perquè augmenta c<sub>2m</sub> i amb ella w<sub>2u</sub>, i c<sub>2u</sub> baixa","No canvia","Augmenta, perquè disminueix u<sub>2</sub>"],1,"c<sub>2m</sub> = Q/(πD<sub>2</sub>b<sub>2</sub>) puja ⇒ w<sub>2u</sub> = c<sub>2m</sub>/tan β<sub>2f</sub> puja ⇒ c<sub>2u</sub> = u<sub>2</sub> − w<sub>2u</sub> baixa ⇒ H<sub>th</sub> baixa. u<sub>2</sub> només depèn de n i D<sub>2</sub>."],
[5,"Una bomba centrífuga gira a 2900 rpm, D<sub>2</sub> = 0,25 m, b<sub>2</sub> = 0,015 m, Q = 0,03 m³/s, β<sub>2f</sub> = 25° i entrada sense prerotació. Quina és l’altura teòrica d’Euler?",["146,9 m","142,3 m","125,8 m","53,8 m"],2,"u<sub>2</sub> = π·2900·0,25/60 = 37,96 m/s; c<sub>2m</sub> = 0,03/(π·0,25·0,015) = 2,55 m/s; c<sub>2u</sub> = u<sub>2</sub> − c<sub>2m</sub>/tan 25° = 32,50 m/s ⇒ H<sub>th</sub> = u<sub>2</sub>c<sub>2u</sub>/g = 125,8 m. 146,9 és u<sub>2</sub>²/g (cabal nul) i 142,3 surt de multiplicar per tan en lloc de dividir.",1],
[5,"Un rodet centrífug gira a 1450 rpm amb D<sub>1</sub> = 0,1 m i b<sub>1</sub> = 0,02 m, i l’àlep d’entrada té β<sub>1a</sub> = 20°. Amb entrada radial i Q = 0,012 m³/s, quina incidència té el flux?",["−5,9°","+5,9°","+14,1°","−55,9°"],1,"c<sub>1m</sub> = 0,012/(π·0,1·0,02) = 1,91 m/s; u<sub>1</sub> = π·1450·0,1/60 = 7,59 m/s ⇒ β<sub>1f</sub> = atan(1,91/7,59) = 14,1°. i = 20 − 14,1 = +5,9° (cabal per sota del de disseny). El signe negatiu és invertir la definició.",1],
[5,"Una turbina Francis té H<sub>n</sub> = 80 m, η<sub>h</sub> = 0,90 i u<sub>1</sub> = 30 m/s, i surt sense component tangencial. Quina c<sub>1u</sub> cal a l’entrada del rodet?",["23,5 m/s","26,2 m/s","29,1 m/s","30,0 m/s"],0,"Euler en receptora: u<sub>1</sub>c<sub>1u</sub> = g·H<sub>n</sub>·η<sub>h</sub> = 9,81·80·0,90 = 706,3 ⇒ c<sub>1u</sub> = 23,5 m/s. Sense η<sub>h</sub> sortirien 26,2 m/s i dividint-hi, 29,1.",1],
[5,"Un ventilador centrífug d’àleps corbats endavant (β<sub>2f</sub> = 150°) té u<sub>2</sub> = 20 m/s i c<sub>2m</sub> = 5 m/s, sense prerotació. Quin increment de pressió total teòric dona (ρ<sub>aire</sub> = 1,2 kg/m³)?",["480 Pa","272 Pa","344 Pa","688 Pa"],3,"w<sub>2u</sub> = c<sub>2m</sub>/tan 150° = −8,66 ⇒ c<sub>2u</sub> = u<sub>2</sub> − w<sub>2u</sub> = 28,66 m/s (> u<sub>2</sub>). Δp<sub>t</sub> = ρu<sub>2</sub>c<sub>2u</sub> = 1,2·20·28,66 = 688 Pa. 480 Pa seria radial (c<sub>2u</sub> = u<sub>2</sub>) i 272 Pa, corbat enrere a 30°.",1],
[5,"Per al rodet de 2900 rpm, D<sub>2</sub> = 0,25 m, Q = 0,03 m³/s i c<sub>2u</sub> = 32,5 m/s (entrada sense prerotació), quin parell exerceix el rodet sobre el fluid?",["243,7 N·m","121,9 N·m","142,4 N·m","37,0 N·m"],1,"Moment angular: τ = ρQ(r<sub>2</sub>c<sub>2u</sub> − r<sub>1</sub>c<sub>1u</sub>) = 1000·0,03·0,125·32,5 = 121,9 N·m. 243,7 surt d’usar D<sub>2</sub> en lloc de r<sub>2</sub>, 142,4 d’usar u<sub>2</sub> en lloc de c<sub>2u</sub> i 37,0 és la potència en kW.",1],

// ===== T6 · Cinemàtica axial i Pelton (12; 4 de càlcul) =====
[6,"En una màquina axial, quina relació es compleix entre l’entrada i la sortida del rodet al mateix radi?",["u<sub>1</sub> = u<sub>2</sub> i c<sub>1m</sub> = c<sub>2m</sub>","u<sub>2</sub> > u<sub>1</sub>","c<sub>1m</sub> > c<sub>2m</sub>","w<sub>1</sub> = w<sub>2</sub>"],0,"Al mateix radi u = ωr és igual, i la secció de pas (corona circular) és la mateixa ⇒ c<sub>m</sub> = Q/[π(D<sub>t</sub>²−D<sub>h</sub>²)/4] constant. Per això el terme centrífug d’Euler és zero."],
[6,"En una bomba axial, d’on surt l’augment de pressió estàtica en el rodet?",["Del terme centrífug (u<sub>2</sub>² − u<sub>1</sub>²)/2","De la reducció de la velocitat relativa (w<sub>1</sub>² − w<sub>2</sub>²)/2","Del terme d’energia cinètica absoluta","De la gravetat"],1,"Amb u<sub>1</sub> = u<sub>2</sub> el terme centrífug és nul: tota la pressió estàtica ve de la difusió relativa, w<sub>2</sub> < w<sub>1</sub>. Per això les axials donen poca altura per etapa."],
[6,"Per què els àleps d’una bomba axial o d’una Kaplan estan torçats (l’angle canvia de la base a la punta)?",["Per reduir el soroll","Perquè c<sub>m</sub> canvia molt amb el radi","Perquè u = ωr creix amb el radi mentre c<sub>m</sub> és constant, i l’angle del flux relatiu disminueix cap a la punta","Per facilitar la fabricació"],2,"tan β = c<sub>m</sub>/w<sub>u</sub>: com que u creix cap a la punta, β ha de ser més petit a la punta perquè la incidència sigui nul·la a tots els radis."],
[6,"En una bomba axial amb directriu a la sortida, en el punt de disseny:",["El flux entra amb prerotació i surt axial del rodet","c<sub>2u</sub> = 0 a la sortida del rodet","La directriu augmenta c<sub>u</sub>","El flux entra axial al rodet, surt amb c<sub>2u</sub> > 0 i la directriu el torna axial recuperant pressió"],3,"El rodet dona moment angular (c<sub>2u</sub> > 0); la directriu fixa elimina aquest gir (c<sub>3u</sub> = 0) i transforma l’energia cinètica tangencial en pressió."],
[6,"El vòrtex de punta (tip vortex) en una màquina axial és causat per:",["El flux que passa per l’escletxa entre la punta de l’àlep i la carcassa, de la cara de pressió a la de succió","La prerotació a l’entrada","El despreniment a la base de l’àlep","La desviació a la sortida"],0,"La diferència de pressió entre les dues cares de l’àlep empeny fluid per l’escletxa de punta i forma un vòrtex; és una font de pèrdues i de cavitació a la punta (típic de Kaplan)."],
[6,"En una turbina Pelton, des del punt de vista de la cinemàtica, quina afirmació és correcta?",["És una turbina de reacció amb rodet a pressió","El raig entra a la cullera amb velocitat relativa w<sub>1</sub> = c − u i, idealment, en surt amb el mateix mòdul però gairebé en sentit contrari","La cullera desvia el raig 90°","La velocitat u és la mateixa que la del raig"],1,"És una turbina d’acció a pressió atmosfèrica. La cullera gira el raig uns 160-170°; sense fricció |w<sub>2</sub>| = |w<sub>1</sub>| = c − u, i amb u = c/2 el raig surt quasi sense velocitat absoluta."],
[6,"En un ventilador axial, el despreniment rotatiu (rotating stall):",["Apareix a cabals alts per incidència negativa","Es propaga, vist des del rotor, en el mateix sentit de gir","Apareix a cabals baixos: una cel·la despresa bloqueja canals i es propaga d’àlep a àlep","Només apareix en ventiladors centrífugs"],2,"A cabal baix la incidència és gran i el flux es despren a la cara de succió d’algun àlep; la cel·la es propaga als veïns en sentit contrari al gir (vist des del rotor). Vista des de fora gira en el mateix sentit, més lenta."],
[6,"Quina configuració de directrius d’un rodet axial busca reduir w i la fricció amb els àleps del rodet?",["Directrius a l’entrada que donen prerotació en el sentit de gir","Directrius a la sortida","Sense directrius","Directrius a l’entrada que donen prerotació en sentit contrari al gir"],0,"Prerotació en el sentit de gir ⇒ w<sub>1u</sub> = u − c<sub>1u</sub> més petit ⇒ |w| menor ⇒ menys fricció. La prerotació contrària al gir dona més energia al rodet però amb w més gran."],
[6,"Una bomba axial té D<sub>t</sub> = 0,4 m, D<sub>h</sub> = 0,2 m, gira a 1450 rpm i impulsa 0,3 m³/s amb entrada axial. Quin angle β<sub>1a</sub> cal al diàmetre mig per tenir incidència nul·la?",["82,0°","5,98°","7,96°","11,8°"],2,"c<sub>m</sub> = 0,3/[π/4·(0,4²−0,2²)] = 3,18 m/s; D<sub>m</sub> = 0,3 m ⇒ u = π·1450·0,3/60 = 22,78 m/s. β<sub>1a</sub> = atan(c<sub>m</sub>/u) = 7,96°. 5,98° i 11,8° són els de la punta i de la base; 82° és l’angle complementari.",1],

const MANDAMIENTOS=[
[1,"Tres pèrdues, tres rendiments","η<sub>h</sub> = H/H<sub>th</sub> (altura), η<sub>v</sub> = Q/Q<sub>th</sub> (en bomba el rodet mou MÉS cabal que el circuit), η<sub>m</sub> (coixinets, juntes i fricció de disc, que creix com ω³D⁵ en centrífugues d’H alta). η<sub>bomba</sub> = η<sub>h</sub>η<sub>v</sub>η<sub>m</sub>.","P<sub>hid</sub> = ρgQH [W] · P<sub>mec</sub> = P<sub>hid</sub>/η · τ = P<sub>mec</sub>/ω, ω = 2πn/60 [rad/s]"],
[1,"Centrífuga contra axial","Centrífuga: H-Q estable, potència mínima a Q = 0, s’arrenca amb vàlvula tancada. Axial: zona inestable a cabal baix, potència màxima a Q = 0, s’arrenca amb vàlvula oberta. Multicel·lular = sèrie (més H); doble entrada = paral·lel (més Q, menys empenta axial). Inductor: més pressió a l’entrada contra la cavitació. Difusor: cinètica → pressió."],
[1,"Semblança: transforma la corba sencera","Entre punts homòlegs H ∝ n²D², Q ∝ nD³, P ∝ ρn³D⁵ (mateixa corba ψ-φ). Per a H = A − BQ²: A’ = k<sub>H</sub>A i B’ = B·k<sub>H</sub>/k<sub>Q</sub>². Si només canvia n, B no canvia.","k<sub>H</sub> = (n’/n)²(D’/D)² · k<sub>Q</sub> = (n’/n)(D’/D)³ · k<sub>P</sub> = (ρ’/ρ)(n’/n)³(D’/D)⁵"],
[1,"Escala i classificació","La màquina gran rendeix més (Re més alt, menys rugositat relativa). Ventilador i bomba: generadores incompressibles (Ma < 0,3); turbina i aerogenerador: receptores; oleohidràulica: desplaçament positiu.","(1 − η<sub>p</sub>)/(1 − η<sub>m</sub>) = (D<sub>m</sub>/D<sub>p</sub>)<sup>0,25</sup>"],
[2,"Cavitació: on, quan i quin dany","Mínim de pressió a l’entrada de l’àlep, cara de succió. Cavita si NPSH<sub>d</sub> < NPSH<sub>r</sub>. Primer incipient (bombolles), després desenvolupada (H cau un 3 %): NPSH<sub>inc</sub> > NPSH<sub>des</sub>. El dany és al col·lapse (microjet i ona de xoc), no quan creixen."],
[2,"NPSH disponible","Puja si baixes la bomba, augmentes el diàmetre o escurces l’aspiració, refredes el líquid o pressuritzes el dipòsit INFERIOR. Baixa amb el cabal i amb l’altitud (p<sub>atm</sub> menor). L’NPSH<sub>r</sub> és de la bomba (assaig del fabricant) i creix amb Q.","NPSH<sub>d</sub> = p<sub>0</sub>/ρg + (z<sub>0</sub> − z<sub>1</sub>) − h<sub>asp</sub> − p<sub>v</sub>/ρg [m]"],
[2,"Circuit i punt de funcionament","El punt de funcionament és el tall bomba-circuit; H<sub>b</sub> = H<sub>o</sub> + h<sub>f</sub> > H<sub>o</sub>. La piezomètrica acaba a la superfície del dipòsit d’arribada; la de càrrega hi arriba c²/2g per sobre (terme de difusió).","H<sub>r</sub> = H<sub>o</sub> + kQ² · h<sub>f</sub> = 8fLQ²/(π²D⁵g) [m]"],
[3,"Com es regula","Vàlvula en sèrie: menys Q, més H de bomba, dissipa (no en axials). Bypass: més cabal per la bomba i menys pel circuit (sí en axials). Velocitat variable: òptim en rendiment, cal variador. Pitch: només axials. El nou punt NO és l’homòleg: talla la nova corba amb el circuit.","h<sub>v</sub> = (K/α)Q² · bypass: Q<sub>b</sub> = Q<sub>circ</sub> + Q<sub>v</sub>, H<sub>b</sub> = h<sub>v</sub>(Q<sub>v</sub>)"],
[3,"Sèrie i paral·lel","Sèrie: mateix Q, se sumen les H. Paral·lel: mateixa H, se sumen els Q. Amb el mateix circuit mai obtens 2H ni 2Q: el tall es desplaça.","Dues iguals H = A − BQ²: sèrie H = 2A − 2BQ² · paral·lel H = A − (B/4)Q²"],
[4,"Quina turbina i com es regula","Pelton: salt molt alt, cabal petit (n<sub>s</sub> més baixa), acció, injector (diversos injectors ⇒ bona regulació). Francis: salts mitjans, directrius, grups més potents. Kaplan: salt baix i molt cabal, doble regulació (directrius i àleps)."],
[4,"Salt net i rendiments de turbina","H<sub>n</sub> = H<sub>b</sub> − pèrdues (canonada forçada i aspiració) − difusió. En turbina Q<sub>rodet</sub> = η<sub>v</sub>Q<sub>circuit</sub> i η<sub>h</sub> = H<sub>aprofitat</sub>/H<sub>n</sub>. Els rendiments multipliquen (al revés que en bomba).","P<sub>el</sub> = ρgQH<sub>n</sub>·η<sub>turb</sub>·η<sub>gen</sub> [W] · n = 60f/p [rpm], p = parells de pols"],
[4,"La torxa de la Francis","Càrrega parcial: c<sub>2u</sub> > 0, torxa ampla amb rotació (vibracions). Sobrecàrrega: c<sub>2u</sub> < 0, torxa estreta i centrada. Ordre del flux: cambra espiral → directrius → rodet → tub d’aspiració."],
[5,"Triangles de velocitats","c = u + w. β és l’angle de w respecte a u; α, el de c. En centrífuga D<sub>1</sub> ≠ D<sub>2</sub> ⇒ u<sub>1</sub> ≠ u<sub>2</sub>. Amb u fix, més c<sub>m</sub> ⇒ β més gran.","u = πDn/60 [m/s] · c<sub>m</sub> = Q/(πDb) · tan β = c<sub>m</sub>/w<sub>u</sub> · w<sub>u</sub> = u − c<sub>u</sub>"],
[5,"Euler","Generadora: gH<sub>th</sub> = u<sub>2</sub>c<sub>2u</sub> − u<sub>1</sub>c<sub>1u</sub> (receptora, al revés). Sense prerotació, H<sub>th</sub> és una recta en Q: màxim u<sub>2</sub>²/g a Q = 0; horitzontal si β<sub>2</sub> = 90°. Prerotació en el sentit de gir ⇒ menys H<sub>th</sub>.","H<sub>th</sub> = u<sub>2</sub>²/g − u<sub>2</sub>·cot β<sub>2f</sub>·Q/(πD<sub>2</sub>b<sub>2</sub>g) [m]"],
[5,"Incidència i desviació","i = β<sub>1a</sub> − β<sub>1f</sub>: positiva a cabal baix, negativa a cabal alt, causa pèrdues per xoc. d = β<sub>2a</sub> − β<sub>2f</sub> > 0 sempre (àleps finits): baixa c<sub>2u</sub> i H<sub>th</sub> però NO és una pèrdua (no toca η<sub>h</sub>). Més àleps ⇒ menys desviació."],
[5,"Àleps de sortida","Corbats enrere (β<sub>2</sub> < 90°): més rendiment. Radials: robustos amb partícules. Corbats endavant (β<sub>2</sub> > 90°): c<sub>2u</sub> > u<sub>2</sub>, més prestacions, canals curts, menys rendiment. Xapa corbada: més eficiència, pitjor amb abrasió."],
[5,"Difusor i sortida de la Francis","Les directrius del difusor s’orienten amb c<sub>2</sub> (tan α<sub>2</sub> = c<sub>2m</sub>/c<sub>2u</sub>), no amb w. La Francis en disseny surt amb c<sub>2u</sub> = 0 (α<sub>2</sub> = 90°), i l’equació és gH<sub>n</sub>η<sub>h</sub> = u<sub>1</sub>c<sub>1u</sub>."],
[6,"Màquines axials","Al mateix radi u<sub>1</sub> = u<sub>2</sub> i c<sub>m</sub> constant: no hi ha terme centrífug, la pressió estàtica ve de w<sub>2</sub> < w<sub>1</sub>. u creix cap a la punta ⇒ β més petit a la punta (àlep torçat).","c<sub>m</sub> = Q/[π(D<sub>t</sub>² − D<sub>h</sub>²)/4] · H<sub>est</sub> = (w<sub>1</sub>² − w<sub>2</sub>²)/2g [m]"],
[6,"Directrius i fenòmens axials","Directriu de sortida: c<sub>3u</sub> = 0, flux axial i recupera pressió. Directriu d’entrada amb prerotació en el sentit de gir: menys w, menys fricció. Rotating stall: cabal baix, despreniment a la cara de succió que es propaga. Tip vortex: escletxa de punta, de pressió a succió."],

// ---------- QÜESTIONARI ----------
// mode "inst": correcció immediata · mode "exam": correcció al final amb +1 / −1/3 / 0
let Q=null;
// Les noves barregen l’ordre de les opcions a cada intent; les oficials es mantenen tal qual
function mixOpts(q){if(q.src!=="nueva")return q;const p=shuffle([0,1,2,3]);return {...q,o:p.map(k=>q.o[k]),a:p.indexOf(q.a)}}
function startQuiz(cfg){
  stopTimer();
  Q={...cfg,qs:cfg.qs.map(mixOpts),i:0,ans:[]};
  if(cfg.timer){Q.end=Date.now()+cfg.timer*60000;TIMER=setInterval(tick,1000)}
  renderQ();
}
function tick(){
  if(!Q||!Q.end){stopTimer();return}
  const left=Math.max(0,Q.end-Date.now()),el=document.getElementById("timer");
  if(el){const m=Math.floor(left/60000),s=Math.floor(left%60000/1000);el.textContent=`${m}:${String(s).padStart(2,"0")}`;el.classList.toggle("low",left<5*60000)}
  if(left<=0){stopTimer();finishExam(true)}
}
function srcTag(q){return (q.src=="nueva"?"Nova":"Oficial · "+EXAMS[q.src])+(q.calc?" · càlcul":" · teoria")}
function renderQ(){
  const q=Q.qs[Q.i],T=TEMAS[q.t],n=Q.qs.length;
  setHeader(Q.title,true,Q.back);
  const answered=Q.ans[Q.i]!==undefined;
  app.innerHTML=`
  <div class="bar"><i style="width:${100*Q.i/n}%"></i></div>
  <div class="meta"><span class="sub" style="font-variant-numeric:tabular-nums">Pregunta ${Q.i+1} de ${n}${Q.end?` · <span class="timer" id="timer"></span>`:""}</span>
    <span style="display:flex;gap:6px;flex-wrap:wrap"><span class="tag" style="color:${T.c}">${tlab(q.t)} · ${T.el}</span><span class="tag" style="color:var(--muted)">${esc(srcTag(q))}</span></span></div>
  <p class="q">${q.src!="nueva"?q.n+". ":""}${fmt(q.q)}</p>
  ${figHTML(q)}
  <div class="opts" role="group" aria-label="Opcions">${q.o.map((o,k)=>`<button class="opt" id="opt${k}" data-k="${k}"><span class="l">${L[k]})</span><span>${fmt(o)}</span></button>`).join("")}</div>
  <div id="fb"></div>
  <div class="actions" id="acts"></div>`;
  if(Q.end)tick();
  const opts=[...app.querySelectorAll(".opt")];
  const acts=document.getElementById("acts");
  if(Q.mode=="inst"){
    opts.forEach(b=>b.onclick=()=>answerInst(+b.dataset.k));
    if(answered)showFeedback();
  }else{
    let sel=Q.ans[Q.i]??null;
    const paint=()=>opts.forEach(b=>b.classList.toggle("sel",+b.dataset.k===sel));
    paint();
    opts.forEach(b=>b.onclick=()=>{sel=+b.dataset.k===sel?null:+b.dataset.k;Q.ans[Q.i]=sel;paint();drawActs()});
    function drawActs(){
      const last=Q.i==n-1;
      acts.innerHTML=`${Q.i>0?'<button class="btn ghost" id="prev">Anterior</button>':""}<button class="btn" id="next">${last?"Corregir":(sel==null?"Deixar en blanc":"Següent")}</button>`;
      const p=document.getElementById("prev"); if(p)p.onclick=()=>{Q.i--;renderQ()};
      document.getElementById("next").onclick=()=>{if(Q.ans[Q.i]===undefined)Q.ans[Q.i]=null;if(last)finishExam();else{Q.i++;renderQ()}};
    }
    drawActs();
  }
}
function answerInst(k){
  if(Q.ans[Q.i]!==undefined)return;
  const q=Q.qs[Q.i];Q.ans[Q.i]=k;record(q.id,k===q.a);showFeedback();
}
function expBlock(q,k){
  const ok=k===q.a,blank=k==null;
  const lab=x=>`(${L[x]})`;
  let head=blank?"En blanc":ok?"Correcta":"Incorrecta";
  let lines=`<p><b>Resposta correcta: ${lab(q.a)}</b> ${fmt(q.o[q.a])}</p>`;
  if(!ok&&!blank)lines=`<p>Has marcat ${lab(k)}: ${fmt(q.o[k])}</p>`+lines;
  return `<div class="exp ${blank?"blank":ok?"good":"wrong"}"><div class="verdict">${head}</div>${lines}<p>${fmt(q.e)}</p></div>`;
}
function showFeedback(){
  const q=Q.qs[Q.i],k=Q.ans[Q.i];
  app.querySelectorAll(".opt").forEach(b=>{const j=+b.dataset.k;b.disabled=true;if(j===q.a)b.classList.add("ok");else if(j===k)b.classList.add("bad")});
  document.getElementById("fb").innerHTML=expBlock(q,k);
  const last=Q.i==Q.qs.length-1;
  document.getElementById("acts").innerHTML=`${Q.i>0?'<button class="btn ghost" id="prev">Anterior</button>':""}<button class="btn" id="next">${last?"Veure resultat":"Següent"}</button>`;
  const p=document.getElementById("prev");if(p)p.onclick=()=>{Q.i--;renderQ()};
  document.getElementById("next").onclick=()=>{if(last)finishInst();else{Q.i++;renderQ()}};
  document.getElementById("fb").scrollIntoView({behavior:"smooth",block:"nearest"});
}
function finishInst(){
  const ok=Q.qs.filter((q,i)=>Q.ans[i]===q.a).length,n=Q.qs.length;
  setHeader(Q.title,true,Q.back);
  const wrong=Q.qs.map((q,i)=>[q,Q.ans[i]]).filter(([q,k])=>k!==q.a);
  app.innerHTML=`<div class="hero"><div class="big">${ok}/${n}</div><div class="sub">${Math.round(100*ok/n)} % d’encerts.${wrong.length?" Les fallades queden al bloc de repàs.":" Cap fallada."}</div></div>
  <div class="actions"><button class="btn" id="again">Repetir</button>${wrong.length?'<button class="btn ghost" id="redo">Només les fallades</button>':""}</div>
  <h2>Revisió de les fallades</h2><div class="list">${wrong.length?wrong.map(([q,k])=>revCard(q,k)).join(""):'<p class="empty">Tot correcte.</p>'}</div>`;
  const cfg={title:Q.title,mode:Q.mode,back:Q.back};
  const literal=Q.qs[0].src!="nueva"&&(Q.title.startsWith("Final")||Q.title.startsWith("Reav")||Q.title.startsWith("Parcial")||Q.title.startsWith("Exàmens"));
  const base=Q.qs;
  document.getElementById("again").onclick=()=>startQuiz({...cfg,qs:literal?base:shuffle(base)});
  const r=document.getElementById("redo");if(r)r.onclick=()=>startQuiz({...cfg,title:"Fallades",qs:wrong.map(x=>x[0])});
}
function finishExam(timeout){
  stopTimer();
  let ok=0,bad=0,bl=0;
  Q.qs.forEach((q,i)=>{const k=Q.ans[i];if(k==null){bl++}else{record(q.id,k===q.a);k===q.a?ok++:bad++}});
  const n=Q.qs.length,pts=ok-bad/3,nota=Math.max(0,10*pts/n);
  S.sims.push({d:Date.now(),title:Q.title,n,ok,bad,bl,nota:+nota.toFixed(2)});S.sims=S.sims.slice(-30);save();
  setHeader(Q.title,true);
  app.innerHTML=`${timeout?'<p class="sub" style="margin-top:16px;color:var(--bad)">S’ha acabat el temps: les que no havies contestat compten com en blanc.</p>':""}<div class="hero"><div class="big">${nf(nota,1)}</div><div class="sub">Nota sobre 10 · ${ok} bé (+${ok}), ${bad} malament (−${nf(bad/3,2)}), ${bl} en blanc · ${nf(pts,2)} / ${n} punts</div></div>
  <div class="actions"><button class="btn" id="again">${Q.title.startsWith("Examen")?"Repetir":"Un altre simulacre"}</button></div>
  <h2>Correcció completa</h2><div class="list">${Q.qs.map((q,i)=>revCard(q,Q.ans[i])).join("")}</div>`;
  const title=Q.title,gen=Q.gen,timer=Q.timer;
  document.getElementById("again").onclick=()=>startQuiz({title,qs:gen?gen():Q.qs,mode:"exam",gen,timer});
}
function revCard(q,k){const T=TEMAS[q.t];return `<div class="rev"><span class="tag" style="color:${T.c}">${tlab(q.t)} · ${esc(srcTag(q))}</span><p class="q">${q.src!="nueva"?q.n+". ":""}${fmt(q.q)}</p>${figHTML(q)}${expBlock(q,k)}</div>`}

const HAS_TTS=typeof window!=="undefined"&&"speechSynthesis" in window;
const AU={t:null,i:0,list:[],playing:false,cur:null,rate:1};
try{AU.rate=+localStorage.getItem("turbo-rate")||1}catch(e){}
function caVoice(){const v=speechSynthesis.getVoices();return v.find(x=>/^ca[-_]/i.test(x.lang))||v.find(x=>/^ca$/i.test(x.lang))||v.find(x=>/^es[-_]ES/i.test(x.lang))||null}
function audioSentences(t){return AUDIOS[t].flatMap((p,pi)=>(p.match(/[^.!?:;]+[.!?:;]+|[^.!?:;]+$/g)||[p]).map(s=>({s:s.trim(),pi})).filter(x=>x.s))}
function audioMinutes(t){return Math.max(1,Math.round(AUDIOS[t].join(" ").split(/\s+/).length/150))}
function stopAudio(){AU.playing=false;AU.cur=null;AU.i=0;AU.t=null;if(HAS_TTS){try{speechSynthesis.cancel()}catch(e){}}}
function speakNext(){
  if(!AU.playing)return;
  if(AU.i>=AU.list.length){AU.playing=false;AU.i=0;audioPaint();return}
  const it=AU.list[AU.i],u=new SpeechSynthesisUtterance(it.s);
  const v=caVoice();u.lang=v?v.lang:"ca-ES";if(v)u.voice=v;u.rate=AU.rate;
  const go=()=>{if(AU.cur===u&&AU.playing){AU.i++;speakNext()}};
  u.onend=go;u.onerror=go;AU.cur=u;speechSynthesis.speak(u);audioPaint();
}
function audioPlay(t){
  if(AU.t!==t){if(HAS_TTS)speechSynthesis.cancel();AU.t=t;AU.list=audioSentences(t);AU.i=0}
  AU.playing=true;speakNext();
}
function audioPause(){AU.playing=false;AU.cur=null;speechSynthesis.cancel();audioPaint()}
function audioRestart(t){if(HAS_TTS)speechSynthesis.cancel();AU.t=t;AU.list=audioSentences(t);AU.i=0;AU.cur=null;AU.playing=true;speakNext()}
function audioPaint(){
  document.querySelectorAll("[data-au]").forEach(card=>{
    const t=+card.dataset.au,mine=AU.t===t,now=mine&&AU.playing,mid=mine&&!AU.playing&&AU.i>0;
    card.querySelector(".au-play").textContent=now?"Pausa":mid?"Continuar":"Escoltar";
    card.querySelector(".au-play").setAttribute("aria-pressed",now?"true":"false");
    card.querySelector(".au-restart").hidden=!(mine&&AU.i>0);
    const pi=mine&&AU.list[AU.i]?AU.list[AU.i].pi:-1;
    card.querySelectorAll(".para").forEach((p,k)=>p.classList.toggle("now",mine&&(AU.playing||AU.i>0)&&k===pi));
    const bar=card.querySelector(".au-bar i");bar.style.width=(mine&&AU.list.length?100*AU.i/AU.list.length:0)+"%";
  });
}
function audioView(){
  setHeader("Àudios per tema",true);
  if(!HAS_TTS){app.innerHTML=`<p class="empty">Aquest navegador no pot llegir text en veu alta. Obre l’app amb Safari (iPhone) o Chrome (Android).</p>`;return}
  const rates=[0.9,1,1.15,1.3];
  const v=caVoice();
  app.innerHTML=`<p class="sub" style="margin-top:16px">Un resum parlat de cada tema amb la veu del mòbil. Funciona sense connexió. Si no sents res, treu el mode silenci.${v&&!/^ca/i.test(v.lang)?" No s’ha trobat cap veu catalana: es llegeix amb la castellana.":""}</p>
  <div class="speed" role="group" aria-label="Velocitat">${rates.map(r=>`<button class="chip${r===AU.rate?" on":""}" data-rate="${r}">${String(r).replace(".",",")}×</button>`).join("")}</div>
  <div class="list">${TEMAS_EXAM.map(t=>`<div class="stat au" data-au="${t}" style="border-left:4px solid ${TEMAS[t].c}">
    <div class="top"><b>Tema ${t}. ${TEMAS[t].n}</b><span class="pct">~${audioMinutes(t)} min</span></div>
    <div class="meter au-bar"><i style="width:0;background:${TEMAS[t].c}"></i></div>
    <div class="actions" style="margin-top:10px"><button class="btn au-play" aria-pressed="false">Escoltar</button><button class="btn ghost au-restart" hidden>Des del principi</button></div>
    <details class="au-text"><summary>Veure el text</summary>${AUDIOS[t].map(p=>`<p class="para">${esc(p)}</p>`).join("")}</details>
  </div>`).join("")}</div>`;
  app.querySelectorAll("[data-au]").forEach(card=>{const t=+card.dataset.au;
    card.querySelector(".au-play").onclick=()=>{if(AU.t===t&&AU.playing)audioPause();else audioPlay(t)};
    card.querySelector(".au-restart").onclick=()=>audioRestart(t);
  });
  app.querySelectorAll("[data-rate]").forEach(b=>b.onclick=()=>{AU.rate=+b.dataset.rate;try{localStorage.setItem("turbo-rate",AU.rate)}catch(e){}
    app.querySelectorAll("[data-rate]").forEach(x=>x.classList.toggle("on",x===b));
    if(AU.playing){const t=AU.t;audioPause();audioPlay(t)}});
  if(HAS_TTS&&speechSynthesis.getVoices().length===0)speechSynthesis.onvoiceschanged=()=>{};
  audioPaint();
}

// ---------- MANAMENTS ----------
function mandView(){
  setHeader("Els 20 manaments",true);
  const cnt={};MANDAMIENTOS.forEach(m=>cnt[m[0]]=(cnt[m[0]]||0)+1);
  app.innerHTML=`<p class="sub" style="margin-top:16px">Amb aquestes 20 idees es respon la major part del material oficial. El repartiment segueix el pes de cada tema als exàmens:</p>
  <div class="segbar" role="img" aria-label="Pes de cada tema">${TEMAS_EXAM.map(t=>`<i style="width:${(100*PES[t]/TEMAS_EXAM.reduce((x,k)=>x+PES[k],0)).toFixed(1)}%;background:${TEMAS[t].c}" title="T${t} ${PES[t]} %"></i>`).join("")}</div>
  <div class="chips">${TEMAS_EXAM.map(t=>`<span class="chipt" style="color:${TEMAS[t].c}">T${t} · ${cnt[t]||0} · ${PES[t]} %</span>`).join("")}</div>
  <div class="list" style="margin-top:14px">${MANDAMIENTOS.map((m,i)=>{const T=TEMAS[m[0]];return `<div class="stat" style="border-left:4px solid ${T.c}"><div class="top"><b>${i+1}. ${esc(m[1])}</b><span class="tag" style="color:${T.c};flex:none">T${m[0]}</span></div><p style="margin:6px 0 0">${fmt(m[2])}</p>${m[3]?`<div class="formula">${fmt(m[3])}</div>`:""}</div>`}).join("")}</div>
  <h2>Com atacar el test</h2>
  <div class="stat"><ol class="tips">
    <li><b>Busca la peça canviada.</b> Moltes falses són una frase del temari amb una sola peça girada: succió↔pressió, entrada↔sortida, sèrie↔bypass, càrrega parcial↔sobrecàrrega, incipient↔desenvolupada, c↔w.</li>
    <li><b>«Sempre», «tots», «únicament»</b> solen ser falses (p. ex. «tots els rendiments baixen a cabal baix»).</li>
    <li><b>Homòleg ≠ punt de funcionament.</b> Si una opció aplica semblança directament al punt de tall, desconfia.</li>
    <li><b>En càlcul, revisa unitats:</b> rpm → rad/s, m³/h → m³/s, D o r, H (m) o E (J/kg), Pa o m.</li>
    <li><b>En blanc o no?</b> Amb −1/3 per error, endevinar entre 4 dona de mitjana 0. Si en descartes una amb seguretat, contestar ja suma (+1/9 de mitjana); si en descartes dues, +1/3.</li>
  </ol></div>
  <div class="actions"><button class="btn" id="goProb">Les ${PROBABLES.length} més probables</button></div>`;
  document.getElementById("goProb").onclick=()=>startQuiz({title:"Més probables",qs:shuffle(PROBABLES.map(id=>BYID[id])),mode:"inst"});
}

// ---------- MANAMENTS EXPRÉS (una frase o una relació) ----------

function miniView(){
  setHeader("Manaments exprés",true);
  app.innerHTML=`<p class="sub" style="margin-top:16px">Una idea o una relació per línia. Per a l’explicació completa, obre els 20 manaments.</p>
  ${Object.keys(TEMAS).map(t=>{const it=MINI.filter(m=>m[0]==t);return it.length?`<h2 style="color:${TEMAS[t].c}">${t<7?"Tema "+t+". ":""}${TEMAS[t].n}</h2><div class="list">${it.map(m=>`<div class="mini"><span class="tag" style="color:${TEMAS[t].c}">${tlab(+t)}</span><span>${fmt(m[1])}</span></div>`).join("")}</div>`:""}).join("")}

// ---------- FALLADES (teoria o càlcul) ----------
function failView(k){
  const K=KIND[k];
  setHeader("Fallades · "+K.n.toLowerCase(),true);
  const ids=failedIds().filter(id=>K.f(BYID[id]));
  if(!ids.length){app.innerHTML=`<p class="empty">No tens preguntes de ${K.n.toLowerCase()} fallades pendents.<br>Quan en fallis una, apareixerà aquí fins que l’encertis.</p>`;return}
  const qs=ids.map(id=>BYID[id]);
  const byT={};qs.forEach(q=>(byT[q.t]=byT[q.t]||[]).push(q));
  const back=()=>failView(k);
  app.innerHTML=`<div class="hero"><div class="big">${qs.length}</div><div class="sub">Preguntes de ${K.n.toLowerCase()} amb l’última resposta incorrecta. Quan les encertes, desapareixen.</div></div>
  <div class="actions"><button class="btn" id="go">Repassar-les totes</button></div>
  <h2>Per tema</h2><div class="list">${Object.keys(byT).sort().map(t=>`<button class="row" data-t="${t}">${badge(t)}<span class="txt"><b>${t<7?"Tema "+t:"Aerogeneradors"}</b><span class="sub">${TEMAS[t].n}</span></span><span class="pct">${byT[t].length}</span></button>`).join("")}</div>
  <h2>Llistat</h2><div class="list">${qs.map(q=>revCard(q,null).replace('class="exp blank"','class="exp good"').replace(">En blanc<",">Solució<")).join("")}</div>`;
  document.getElementById("go").onclick=()=>startQuiz({title:"Fallades · "+K.n.toLowerCase(),qs:shuffle(qs),mode:"inst",back});
  app.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>startQuiz({title:"Fallades "+tlab(+b.dataset.t)+" · "+K.n.toLowerCase(),qs:shuffle(byT[b.dataset.t]),mode:"inst",back}));
}

// ---------- ESTADÍSTIQUES (teoria o càlcul) ----------
function statsView(k){
  const K=KIND[k];
  setHeader("Estadístiques · "+K.n.toLowerCase(),true);
  const stat=set=>{let n=0,ok=0,seen=0;set.forEach(q=>{const r=S.q[q.id];if(r){n+=r.n;ok+=r.ok;seen++}});return{n,ok,seen,total:set.length,pct:n?Math.round(100*ok/n):null}};
  const rows=Object.keys(TEMAS).map(t=>({t,...stat(ALL.filter(q=>q.t==t&&K.f(q)))})).filter(r=>r.total);
  const ranked=rows.filter(r=>r.pct!=null).sort((a,b)=>a.pct-b.pct);
  const worst=ranked[0],best=ranked[ranked.length-1];
  const tot=stat(ALL.filter(K.f));
  const sims=S.sims.slice().reverse().slice(0,10);
  const offRow=(lab,set)=>{set=set.filter(K.f);return set.length?`<div class="stat"><div class="top"><span>${lab} <span class="sub">(${set.length})</span></span><span class="pct">${pctSet(set)}</span></div></div>`:""};
  app.innerHTML=`
  <div class="hero"><div class="big">${tot.pct==null?"–":tot.pct+" %"}</div><div class="sub">Encerts en ${K.n.toLowerCase()}: ${tot.ok}/${tot.n} respostes · ${tot.seen}/${tot.total} preguntes vistes${ranked.length>=2?`<br>Millor: <b style="color:${TEMAS[best.t].c}">${tlab(+best.t)}</b> (${best.pct} %) · A reforçar: <b style="color:${TEMAS[worst.t].c}">${tlab(+worst.t)}</b> (${worst.pct} %)`:""}</div></div>
  <h2>Encerts per tema · ${K.n.toLowerCase()}</h2>
  <div class="list">${rows.map(r=>`<div class="stat"><div class="top"><span><b>${tlab(+r.t)}</b> ${TEMAS[r.t].n}</span><span class="pct">${r.pct==null?"sense dades":r.pct+" %"}</span></div>
    <div class="meter"><i style="width:${r.pct||0}%;background:${TEMAS[r.t].c}"></i></div>
    <div class="sub small" style="margin-top:6px;font-variant-numeric:tabular-nums">${r.ok}/${r.n} respostes correctes · ${r.seen}/${r.total} preguntes vistes</div></div>`).join("")}</div>
  <h2>Blocs oficials · ${K.n.toLowerCase()}</h2>
  <div class="list">${offRow("Final 10/04/26",EXAMEN)}${OLD_ORDER.map(x=>offRow(EXAMS[x],ANTERIORS.filter(q=>q.src==x))).join("")}${offRow("Preguntes noves",NUEVAS)}</div>
  <h2>Últims simulacres</h2>
  <div class="list">${sims.length?sims.map(s=>`<div class="stat"><div class="top"><span>${esc(s.title)} · ${new Date(s.d).toLocaleDateString("ca-ES",{day:"numeric",month:"short"})}</span><span class="pct" style="color:var(--fg)">${String(s.nota).replace(".",",")}</span></div><div class="sub small">${s.ok} bé · ${s.bad} malament · ${s.bl} en blanc</div></div>`).join(""):'<p class="empty">Encara no has fet cap simulacre.</p>'}</div>
  <h2>Dades</h2>
  <div id="resetBox"><button class="btn ghost" id="reset">Esborrar tot el progrés</button></div>`;
  document.getElementById("reset").onclick=()=>{
    document.getElementById("resetBox").innerHTML=`<div class="confirm"><span>Segur? S’esborren estadístiques, fallades i simulacres (teoria i càlcul).</span><button class="btn" id="yes" style="flex:none;padding:10px 16px">Esborrar</button><button class="btn ghost" id="no" style="flex:none;padding:10px 16px">Cancel·lar</button></div>`;
    document.getElementById("yes").onclick=()=>{S={q:{},sims:[]};save();statsView(k)};
    document.getElementById("no").onclick=()=>statsView(k);
  };
}
home();
