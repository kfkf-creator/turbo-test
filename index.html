<title>Turbomàquines Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Una columna estreta tipus llibreta; cada tema té el seu color */
:root{
  --bg:#eef2f3; --surface:#ffffff; --fg:#14232b; --muted:#5b6b73; --line:#d5dee2;
  --accent:#0b6e79; --accent-ink:#ffffff;
  --ok:#1d7a45; --ok-bg:#e3f4ea; --bad:#b3261e; --bad-bg:#fbe7e5; --blank:#8a6d10;
  --hl:#d9eef0; --t1:#c08f00; --t2:#2f9e5b; --t3:#c2362f; --t4:#7a4fc9; --t5:#c23a78; --t6:#1f74b8; --t7:#6b7a83;
  --display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f181c; --surface:#172429; --fg:#e4ecee; --muted:#93a4ab; --line:#2a3a40;
  --accent:#4cc3cf; --accent-ink:#06262a;
  --ok:#5fd08e; --ok-bg:#163527; --bad:#ff8a80; --bad-bg:#3a1c1a; --blank:#e3c25a;
  --hl:#1d3d42; --t1:#f0c43a; --t2:#5fd08e; --t3:#f07a72; --t4:#b49af0; --t5:#f07ab0; --t6:#6cb8f0; --t7:#a3b1b8;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f181c; --surface:#172429; --fg:#e4ecee; --muted:#93a4ab; --line:#2a3a40;
  --accent:#4cc3cf; --accent-ink:#06262a;
  --ok:#5fd08e; --ok-bg:#163527; --bad:#ff8a80; --bad-bg:#3a1c1a; --blank:#e3c25a;
  --hl:#1d3d42; --t1:#f0c43a; --t2:#5fd08e; --t3:#f07a72; --t4:#b49af0; --t5:#f07ab0; --t6:#6cb8f0; --t7:#a3b1b8;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding-block:12px;border-bottom:1px solid var(--line)}
header h1{font-family:var(--display);font-weight:800;font-size:1.25rem;margin:0;letter-spacing:-.01em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:10px;padding:6px 12px;font:inherit;font-weight:500;cursor:pointer}
.sub{color:var(--muted);font-size:.85rem}
h2{font-family:var(--display);font-weight:600;font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:26px 0 10px}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font:inherit;color:var(--fg);cursor:pointer}
.row:focus-visible,.opt:focus-visible,.btn:focus-visible,.back:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.row .txt{flex:1;min-width:0}
.row b{display:block;font-weight:600}
.badge{width:40px;height:40px;flex:none;border-radius:10px;display:grid;place-items:center;font-family:var(--mono);font-size:.8rem;font-weight:500;border:2px solid currentColor}
.badge sub{font-size:.6rem}
.pct{font-family:var(--mono);font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
.official{border-left:4px solid var(--accent)}
.tgroup{display:flex;flex-direction:column;gap:6px}
.tgroup+.tgroup{margin-top:8px}
.tname{font-weight:600;padding-left:2px}
.mini{display:flex;gap:10px;align-items:baseline;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 12px}
.mini .tag{flex:none}
.hero{margin-top:18px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;gap:14px;align-items:center}
.hero .big{white-space:nowrap;font-family:var(--display);font-weight:800;font-size:2.2rem;line-height:1;font-variant-numeric:tabular-nums}
.segbar{display:flex;height:12px;border-radius:99px;overflow:hidden;margin:12px 0 8px}
.segbar i{display:block;height:100%}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chipt{font-family:var(--mono);font-size:.75rem;padding:2px 8px;border-radius:99px;border:1px solid currentColor}
/* quiz */
.bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.meta{display:flex;justify-content:space-between;align-items:center;margin-top:12px;gap:8px;flex-wrap:wrap}
.tag{font-family:var(--mono);font-size:.75rem;padding:2px 8px;border-radius:99px;border:1px solid currentColor}
.q{font-size:1.06rem;font-weight:600;margin:14px 0 14px;text-wrap:pretty}
.fig{display:block;margin:0 0 14px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px;text-align:center}
.fig img{max-height:300px;width:auto;margin:0 auto;display:block}
.rev .fig img{max-height:180px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;font:inherit;color:var(--fg);cursor:pointer}
.opt .l{font-family:var(--mono);font-weight:500;flex:none;width:1.4em;color:var(--muted)}
.opt.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.ok .l{color:var(--ok)}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.opt.bad .l{color:var(--bad)}
.opt[disabled]{cursor:default}
.exp{margin-top:14px;border-radius:12px;padding:12px 14px;background:var(--surface);border:1px solid var(--line)}
.exp .verdict{font-family:var(--display);font-weight:800;font-size:1.05rem;margin-bottom:4px}
.exp.good .verdict{color:var(--ok)} .exp.wrong .verdict{color:var(--bad)} .exp.blank .verdict{color:var(--blank)}
.exp p{margin:6px 0 0}
.actions{display:flex;gap:8px;margin-top:16px}
.btn{flex:1;border:0;border-radius:12px;padding:13px;font:inherit;font-weight:600;cursor:pointer;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn[disabled]{opacity:.45;cursor:default}
.timer{font-family:var(--mono);font-size:.85rem;font-variant-numeric:tabular-nums}
.timer.low{color:var(--bad)}
/* stats */
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.stat .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.meter{height:10px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:8px}
.meter i{display:block;height:100%}
.empty{color:var(--muted);text-align:center;padding:30px 10px}
.rev{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.rev .q{font-size:.95rem;margin:4px 0 6px}
.small{font-size:.85rem}
.confirm{margin-top:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.formula{font-family:var(--mono);font-size:.82rem;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px;margin-top:8px;overflow-x:auto}
.speed{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:99px;padding:6px 12px;font:inherit;font-family:var(--mono);font-size:.8rem;cursor:pointer}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.au-text{margin-top:10px}.au-text summary{cursor:pointer;color:var(--muted);font-size:.85rem}
.para{margin:8px 0 0;padding:4px 6px;border-radius:6px;font-size:.92rem}
.para.now{background:var(--hl)}
.tips{margin:0;padding-left:1.1em}.tips li{margin:4px 0}
sub,sup{line-height:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

["2604",1,1,"Escolliu l’opció falsa en referència a la corba característica d’una bomba axial.",["En cas de tenir àleps regulables, hi ha tantes corbes característiques com posicions dels àleps.","La corba H-Q (altura-cabal) és generalment estable per tot el rang de funcionament.","La potència mecànica pot ser elevada a cabals baixos i, per aquest motiu, no es recomana arrancar la bomba amb vàlvula tancada","La corba H-Q representa l’altura real de la bomba en funció del cabal útil."],1,"La falsa és b): la H-Q d’una axial té una zona inestable a cabals inferiors al de disseny. a), c) i d) són certes: una corba per posició d’àleps, potència màxima a Q=0 (s’arrenca amb vàlvula oberta) i H real vs Q útil."],
["2604",2,1,"Quina és la funció de l’inductor en una bomba centrífuga?",["Augmentar la pressió a l’entrada de la bomba per tal de reduir la cavitació.","Augmentar la pressió a la sortida de la bomba per tal de reduir la cavitació.","Augmentar la velocitat del flux i disminuir la pressió a la sortida de la bomba.","Disminuir la velocitat del flux i augmentar la pressió a la sortida de la bomba."],0,"L’inductor és una etapa axial abans del rodet: puja la pressió a l’entrada i millora el comportament a cavitació. La trampa és d): això és el que fa el difusor, a la sortida."],
["2604",3,1,"Escolliu la resposta falsa. Quan treballem a cabals baixos (per sota del punt de disseny Q<sub>BEP</sub>) en una bomba centrífuga:",["Tots els rendiments (hidràulic, volumètric i mecànic) disminueixen respecte el BEP.","Les pèrdues per fricció a l’interior del rodet disminueixen respecte el BEP.","Les pèrdues per xoc a l’entrada del rodet augmenten respecte el BEP.","Podem tenir pèrdues per recirculació a l’entrada del rodet."],0,"La falsa és a): el que cau clarament és η<sub>h</sub>; no és cert que «tots» els rendiments baixin. b) certa (fricció ∝ Q²), c) certa (incidència no òptima), d) certa (recirculació a cabals molt baixos)."],
["2604",4,2,"Quina condició s’ha de complir en una bomba perquè aparegui cavitació?",["NPSHd > -NPSHreq","NPSHd < NPSHreq","NPSHd > NPSHreq","NPSHd<-NPSHreq"],1,"Hi ha cavitació quan l’energia disponible a l’entrada no arriba al mínim que demana la bomba: NPSH<sub>d</sub> < NPSH<sub>req</sub>. c) és la condició per NO tenir cavitació; a) i d) són distractors amb signe."],
["2604",5,2,"Quines de les següents opcions permet augmentar l’NPSH disponible (NPSHd) a l’entrada d’una bomba instal·lada en un circuit de bombeig entre dos dipòsits?",["Augmentar la cota d’instal·lació de la bomba respecte el dipòsit inferior.","Disminuir el nivell de líquid del dipòsit inferior.","Pressuritzar el dipòsit superior.","Disminuir la temperatura del fluid."],3,"Menys temperatura ⇒ menys p<sub>v</sub> ⇒ NPSH<sub>d</sub> = p<sub>0</sub>/γ + (z<sub>0</sub>−z<sub>1</sub>) − h<sub>asp</sub> − p<sub>v</sub>/γ puja. a) i b) baixen (z<sub>0</sub>−z<sub>1</sub>); c) el dipòsit superior no és a l’aspiració (caldria pressuritzar l’inferior)."],
["2604",6,2,"Escolliu l’opció correcta sobre l’NPSH requerit (NPSHreq) d’una bomba.",["L’NPSHreq defineix l’NPSH màxim per evitar tenir qualsevol tipus de cavitació a la bomba.","L’NPSHreq sempre disminueix a mesura que augmenta el cabal que circula per la bomba.","L’NPSHreq se sol determinar a partir de mesures experimentals en bancs d’assaig.","L’NPSHreq depèn de la bomba i del circuit a on vagi instal·lada."],2,"L’NPSH<sub>req</sub> el dona el fabricant a partir d’assajos (criteri de caiguda del 3 % d’H). a) és un mínim, no un màxim; b) normalment creix amb Q; d) només depèn de la bomba: el circuit fixa l’NPSH<sub>d</sub>."],
["2604",7,3,"Tenim un circuit de bombeig amb una bomba centrífuga que treballa en un punt de funcionament (H, Q), amb Q més gran que 0. Mantenint les mateixes característiques del circuit, s’hi instal·la una segona bomba, idèntica a la primera, en sèrie, de manera que el sistema passa a treballar en un nou punt (H’, Q’). Escolliu l’opció correcta:",["H’=2H i Q’=Q","H’=H i Q’=2Q.","H’=2H i Q’=2Q","Cap de les anteriors és correcte."],3,"En sèrie se sumen les altures a igual cabal, però el nou punt és el tall amb la mateixa corba resistent, que puja amb Q²: Q’ > Q i H’ < 2H. Per tant, cap de les anteriors (d)."],
["2604",8,1,"Tenim una bomba centrífuga amb una corba característica H=20-10Q<sup>2</sup>. Es considera una bomba geomètricament semblant que gira al doble de velocitat i té un diàmetre igual al 50% del de la bomba original. Quina de les següents corbes característiques correspon a la nova bomba?",["H’=20 - 160Q’<sup>2</sup>","H’=20 - 40Q’<sup>2</sup>","H’=20 - 10Q’<sup>2</sup>","H’=20 - 80Q’<sup>2</sup>"],0,"k<sub>H</sub> = (n’/n)²(D’/D)² = 4·0,25 = 1; k<sub>Q</sub> = (n’/n)(D’/D)³ = 2·0,125 = 0,25. H’ = k<sub>H</sub>·A − B·(k<sub>H</sub>/k<sub>Q</sub>²)·Q’² = 20 − 10·16·Q’² = 20 − 160Q’². 40 surt d’oblidar elevar k<sub>Q</sub> al quadrat."],
["2604",9,3,"La bomba original H=20-10Q<sup>2</sup> s’instal·la en un circuit amb una corba H=10+15Q<sup>2</sup>. Es vol modificar el sistema per tal que el nou punt de funcionament de la bomba sigui Q’=0,50 m<sup>3</sup>/s i H’=17,5 m. Quina de les següents opcions permet assolir aquest nou punt de funcionament?",["Instal·lar una vàlvula en bypass que recirculi un cabal de 0,232 m<sup>3</sup>/s.","Instal·lar una vàlvula en sèrie que introdueixi unes pèrdues addicionals h<sub>v</sub>=15Q<sup>2</sup>.","Fer girar la bomba a una velocitat n’=1,2n, mantenint el mateix circuit.","Instal·lar una segona bomba idèntica en sèrie, mantenint el mateix circuit."],1,"(0,5; 17,5) és sobre la corba de la bomba (20 − 10·0,25 = 17,5). Amb vàlvula en sèrie: 10 + (15 + k)·0,25 = 17,5 ⇒ k = 15. Sense regular, el tall original és Q = √(10/25) = 0,632 m³/s; cal reduir Q, així que bypass (augmenta Q de la bomba) no serveix."],
["2604",10,1,"En quina de les següents turbomàquines les pèrdues per fricció als discs solen ser comparativament més importants?",["Bombes axials","Bombes semiaxials","Bombes centrífugues per a altures baixes","Bombes centrífugues per a altures elevades"],3,"P<sub>disc</sub> = k·ω³·D⁵: pesa molt en rodets centrífugs grans d’altura elevada (n<sub>q</sub> baixa). Les axials pràcticament no tenen disc. Recorda que afecta η<sub>m</sub>, no η<sub>h</sub>."],
["2604",11,5,"En una bomba centrífuga ideal amb difusor, quin és l’efecte principal del difusor?",["Augmentar la velocitat del flux","Reduir la pressió estàtica","Transformar energia cinètica en energia de pressió","Augmentar la velocitat tangencial"],2,"El difusor frena el flux a la sortida del rodet i converteix energia cinètica en pressió. a), b) i d) descriuen just l’efecte contrari."],
["2604",12,5,"En un triangle de velocitats, si augmenta la velocitat meridiana mantenint la velocitat de rotació constant:",["L’angle β disminueix","L’angle β augmenta","L’angle α disminueix sempre","No afecta els angles"],1,"tan β = c<sub>m</sub>/w<sub>u</sub>: amb u constant, més c<sub>m</sub> fa el vector w més «dret» i β augmenta. L’efecte sobre α depèn de c<sub>u</sub>, per això «sempre» és fals."],
["2604",13,6,"Quina és la funció d’una directriu a la sortida en una màquina generadora axial?",["Augmentar C3u","Aconseguir flux axial i recuperar pressió","Fer W2=0","Reduir U2"],1,"La directriu de sortida endreça el flux (c<sub>3u</sub> = 0, sortida axial) i recupera en pressió l’energia cinètica tangencial. a) és el contrari; c) i d) no tenen sentit (w i u són del rodet)."],
["2604",14,5,"Quin és l’efecte de la desviació en un rodet centrífug?",["Augmenta C2u","No afecta","Redueix C2u","Augmenta U2"],2,"Amb àleps finits el flux surt amb β<sub>2f</sub> < β<sub>2a</sub> (desviació positiva): w<sub>2u</sub> creix i c<sub>2u</sub> = u<sub>2</sub> − w<sub>2u</sub> baixa, i amb ella H<sub>th</sub>. u<sub>2</sub> no canvia (només depèn de n i D)."],
["2604",15,6,"Quina condició (encara que no sigui suficient) s’ha de donar per tenir rotating stall o despreniment rotatiu?",["Cabal per sobre de disseny en algunes turbomàquines","Punt de màxim rendiment en algunes turbomàquines","Cabal per sota de disseny en algunes turbomàquines","Només es dona en turbines Pelton"],2,"El despreniment rotatiu apareix a cabals baixos (incidència gran), típicament en ventiladors i bombes axials. Al BEP o a cabal alt no hi ha aquest problema."],
["2604",16,5,"En un ventilador centrífug amb àleps corbats cap endavant, quina afirmació és correcta?",["Per a un mateix diàmetre i velocitat de gir, acostuma a donar menys cabal que un de àleps corbats cap enrere","El fluid surt del rodet amb una component de velocitat absoluta elevada","Sempre té millor rendiment que un ventilador amb àleps corbats cap enrere","S’utilitza principalment per a salts elevats i cabals petits"],1,"Amb β<sub>2</sub> > 90°, c<sub>2u</sub> > u<sub>2</sub>: surt amb c<sub>2</sub> molt alta (més prestacions, però més pèrdues). Té pitjor rendiment que els corbats enrere i dona més cabal, no menys."],
["2604",17,5,"En un rodet centrífug, considerant l’equació d’Euler, quina diferència conceptual hi ha entre el cas d’àleps infinits i àleps finits?",["En ambdós casos la component tangencial de la velocitat absoluta a la sortida és la mateixa","Amb àleps infinits, el flux segueix exactament la direcció dels àleps i es compleix el triangle de velocitats ideal","Amb àleps finits, no es pot aplicar l’equació d’Euler","Amb àleps infinits, la velocitat meridiana és nul·la"],1,"Àleps infinits ⇒ flux perfectament guiat (β<sub>2f</sub> = β<sub>2a</sub>). Amb àleps finits Euler segueix valent, però c<sub>2u</sub> és menor per la desviació."],
["2604",18,4,"Quina afirmació és certa sobre una turbina de reacció?",["El cabal és constant","Només transfereix energia cinètica","Hi ha caiguda de pressió","Està a pressió atmosfèrica"],2,"En una turbina de reacció (Francis, Kaplan) el rodet treballa a pressió i hi ha caiguda de pressió a través seu. «Només energia cinètica» i «a pressió atmosfèrica» descriuen la Pelton (acció)."],
["2604",19,6,"En una turbina hidràulica axial de reacció, el rodet gira a 128 rpm i el diàmetre mig és 1.80 m. El diàmetre exterior és 2.40 m i el diàmetre del cub és 1.20 m. El cabal és 18.7 m³/s. La directriu d’entrada està ajustada de manera que la velocitat absoluta entra al rodet amb un angle de 20 graus respecte la direcció tangencial. A la sortida del rodet, el flux surt sense component tangencial absoluta. Quina és l’alçada teòrica intercanviada al rodet?",["9.3 m","13.9 m","18.6 m","24.1 m"],2,"U = π·128·1,8/60 = 12,06 m/s. c<sub>m</sub> = 18,7/[π/4·(2,4²−1,2²)] = 5,51 m/s. c<sub>1u</sub> = c<sub>m</sub>/tan 20° = 15,14 m/s. H = U·c<sub>1u</sub>/g = 12,06·15,14/9,81 = 18,6 m (c<sub>2u</sub> = 0)."],
["2604",20,5,"Una bomba centrífuga ideal aspira sense prerotació i amb entrada radial. El rodet gira a 1146 rpm i el diàmetre de sortida és 0.40 m. L’amplada a la sortida és 0.08 m, el cabal és 0.60 m³/s i β2f=45º. Quina és l’alçada teòrica transferida?",["22.0 m","30.6 m","44.0 m","57.0 m"],2,"u<sub>2</sub> = π·1146·0,4/60 = 24,0 m/s. c<sub>2m</sub> = 0,6/(π·0,4·0,08) = 5,97 m/s. c<sub>2u</sub> = u<sub>2</sub> − c<sub>2m</sub>/tan 45° = 18,03 m/s. H<sub>th</sub> = u<sub>2</sub>c<sub>2u</sub>/g = 44,1 m. 57 m seria u<sub>2</sub>²/g (oblidar el terme de cabal)."],

// ===== Final 24/01/23 =====
["2301",1,5,"Pel rodet d’una bomba centrífuga representada a la figura.",["El despreniment que s’indica correspon a una situació on el cabal és més gran que el cabal de disseny","El despreniment que s’indica correspon a una situació on el cabal és més petit que el cabal de disseny","El despreniment que s’indica correspon a una situació de vòrtex de punta","Cap de les anteriors"],0,"Clau oficial: a). El despreniment dibuixat és a la cara de pressió de l’àlep, cosa que passa amb incidència negativa, és a dir, a cabal més gran que el de disseny (a cabal baix el despreniment és a la cara de succió).","desp"],
["2301",2,5,"Pel rodet d’una bomba centrífuga representada a la figura.",["El despreniment que s’indica es produeix a la cara de pressió i la bomba gira en sentit horari","El despreniment que s’indica es produeix a la cara de succió i la bomba gira en sentit antihorari","El despreniment que s’indica es produeix a la cara de succió i la bomba gira en sentit horari","El despreniment que s’indica es produeix a la cara de pressió i la bomba gira en sentit antihorari"],0,"Clau oficial: a). La cara de pressió és la que «empeny» el fluid (la de davant en el sentit de gir). Amb el despreniment en aquesta cara i la curvatura dels àleps de la figura, el rodet gira en sentit horari.","desp"],
["2301",3,5,"Per a la bomba centrífuga de la figura, tenint les dues bombes el mateix diàmetre exterior i girant a la mateixa velocitat de rotació, trieu la frase correcte:",["El rodet a dóna mes energia de pressió i més cabal que el rodet b","El rodet a dóna menys energia de pressió i menys cabal que el rodet b","El rodet a dóna mes energia de pressió i menys cabal que el rodet b","El rodet a dóna menys energia de pressió i més cabal que el rodet b"],3,"Mateix D<sub>2</sub> i n ⇒ mateixa u<sub>2</sub>. El rodet a té D<sub>1</sub> més gran (més semiaxial): el terme (u<sub>2</sub>²−u<sub>1</sub>²)/2 és menor (menys pressió) i té més secció de pas (més cabal).","rodab"],
["2301",4,2,"Per evitar el risc de cavitació en un bomba:",["Es convenient reduir la cota de la bomba i augmentar el diàmetre de la canonada d’aspiració","Es convenient augmentar la cota de la bomba i augmentar el diàmetre de la canonada d’aspiració","Es convenient augmentar la cota de la bomba i disminuir el diàmetre de la canonada d’aspiració","Es convenient disminuir la cota de la bomba i disminuir el diàmetre de la canonada d’aspiració"],0,"Per pujar NPSH<sub>d</sub>: baixar la bomba (puja z<sub>0</sub>−z<sub>1</sub>) i més diàmetre d’aspiració (menys velocitat ⇒ menys h<sub>asp</sub>). Les altres opcions inclouen almenys una mesura que el baixa."],
["2301",5,3,"En el gràfic següent es representen les corbes característiques de dues bombes a dues velocitats de rotació diferents n1 i n2 , i la corba d'un circuit. Trieu la resposta correcte:",["A i B són punts homòlegs","A i C són punts homòlegs","B i C són punts homòlegs","Cap de les anteriors"],2,"Els punts homòlegs d’una mateixa bomba a diferent velocitat estan sobre una paràbola H = kQ² que passa per l’origen (no sobre la corba del circuit, que té H<sub>0</sub> ≠ 0). B i C cauen sobre la mateixa paràbola per l’origen.","homol"],
["2301",7,6,"Entre la sortida i l’entrada de l’àlep d’una bomba axial sempre es compleix:",["w<sub>2</sub> < w<sub>1</sub>","w<sub>2</sub> > w<sub>1</sub>","c<sub>2</sub> < c<sub>1</sub>","c<sub>2</sub> > c<sub>1</sub>"],0,"En una generadora axial u<sub>1</sub> = u<sub>2</sub> i c<sub>m</sub> constant; el rodet desvia w cap a l’axial, de manera que w<sub>2</sub> < w<sub>1</sub> (difusió relativa: guany de pressió estàtica). Les c poden créixer o no segons la configuració de directrius."],
["2301",8,6,"Per a la bomba axial representada en la figura, es pot aconseguir:",["C<sub>u2</sub>=0","C<sub>u1</sub>>0","W<sub>u2</sub>=0","W<sub>u1</sub>=0"],0,"Configuració amb directriu a l’entrada: la directriu dona prerotació contrària i el rodet la cancel·la, de manera que a la sortida del rodet el flux surt axial (c<sub>u2</sub> = 0).","axdir"],
["2301",9,5,"El ventilador que es representa a la figura:",["Gira en sentit horari i es de bon rendiment","Gira en sentit antihorari i es de bon rendiment","Gira en sentit antihorari i es de rendiment mig","Gira en sentit horari i es de rendiment mig"],3,"Àleps de xapa recta (perfil no aerodinàmic): rendiment mig. L’orientació dels àleps indica gir horari segons la clau oficial.","vent1"],
["2301",10,3,"A la figura s’han representat les corbes característiques de dos ventiladors i de dos circuits, es compleix:",["Els ventiladors estan connectats en sèrie i els punts de funcionament B per al circuit R’ i A per al circuit R són vàlids per a funcionar en sèrie","Els ventiladors estan connectats en paral·lel i els punts de funcionament B per al circuit R’ i A per al circuit R són vàlids per a funcionar en paral·lel","Els ventiladors estan connectats en sèrie i el punt de funcionament B per al circuit R’ no és vàlid per a funcionar en sèrie","Els ventiladors estan connectats en paral·lel i el punt de funcionament B per al circuit R’ no és vàlid per a funcionar en paral·lel"],3,"La corba 1+2 suma cabals a igual H: paral·lel. Amb el circuit R’ (molt resistent) el punt B queda a una H on un dels ventiladors ja no dona cabal: fora de la zona de funcionament vàlida en paral·lel.","paral"],
["2301",11,4,"Per a la central hidroelèctrica de la figura, el tipus de turbina més adequat seria:",["Turbina Pelton","Turbina Francis","Turbina Kaplan","Turbina bomba"],2,"Central de riu, de salt baix i cabal gran: Kaplan (axial, n<sub>s</sub> alta). Pelton és per a salts molt alts i Francis per a salts mitjans.","central"],
["2301",12,5,"En una turbina Francis sempre es compleix:",["Les components meridianes de les velocitats absolutes son iguals C<sub>m1</sub>=C<sub>m2</sub>","La velocitat del rodet a l’entrada és igual a la sortida u<sub>1</sub>=u<sub>2</sub>","a i b són certes","Cap de les anteriors"],3,"En una Francis (radial) D<sub>1</sub> ≠ D<sub>2</sub> i les seccions són diferents: ni u<sub>1</sub> = u<sub>2</sub> ni c<sub>m1</sub> = c<sub>m2</sub>. Això sí que passa en màquines axials (Kaplan)."],
["2301",13,4,"Pel que fa a la formació de la torxa al tub d’aspiració en una turbina",["És més probable que es formi la torxa al tub d’aspiració en una turbina Francis que en una turbina Kaplan","És més probable que es formi la torxa al tub d’aspiració en una turbina Kaplan que en una Francis","És més probable que es formi la torxa al tub d’aspiració en una turbina Pelton que en una Kaplan","Cap de les anteriors"],0,"La Kaplan té doble regulació (directrius i àleps) i manté c<sub>2u</sub> ≈ 0 en un rang ampli; la Francis només regula amb directrius i fora de disseny apareix c<sub>2u</sub> ⇒ torxa. La Pelton no té tub d’aspiració."],
["2301",14,4,"El rendiment hidràulic en una turbina es defineix com:",["El quocient entre el salt brut i el salt net (salt brut/salt net)","El quocient entre el salt net i el salt brut (salt net/salt brut)","El quocient entre el salt net i el salt brut menys les pèrdues de càrrega del circuit (salt net/(salt brut-pèrdues de càrrega del circuit)","Cap de les anteriors"],3,"En turbina η<sub>h</sub> = H<sub>real</sub>/H<sub>n</sub> (altura aprofitada pel rodet respecte al salt net). Les opcions comparen salt net i brut, que és el rendiment del circuit, no l’hidràulic de la màquina."],
["2301",15,6,"Una condició de disseny d’una turbina Pelton és:",["C<sub>u2</sub>=0 C<sub>u2</sub>: component tangencial de la velocitat absoluta a la sortida del rodet","C<sub>m2</sub>=0 C<sub>m2</sub>: component meridiana de la velocitat absoluta a la sortida del rodet","C<sub>1</sub>=u/2 C<sub>1</sub>: Velocitat absoluta a l’entrada, u:velocitat del rodet","Cap de les anteriors"],0,"Màxim aprofitament ⇒ el raig surt sense component tangencial absoluta (c<sub>u2</sub> = 0), que s’aconsegueix amb u = c<sub>1</sub>/2. La c) està invertida: és u = c<sub>1</sub>/2, no c<sub>1</sub> = u/2."],
["2301",16,5,"A quina condició de càrrega treballa una turbina Francis que gira a 600 rpm, per ella circula un cabal de 2 m<sup>3</sup>/s sense desviació a la sortida? ( D2 = 0,3 m,b2 = 0,2 m, β2alep = 45°)",["Càrrega parcial","Sobrecàrrega","Punt de disseny","No es pot saber"],1,"u<sub>2</sub> = π·600·0,3/60 = 9,42 m/s; c<sub>2m</sub> = 2/(π·0,3·0,2) = 10,61 m/s; w<sub>2u</sub> = c<sub>2m</sub>/tan 45° = 10,61 m/s. c<sub>2u</sub> = u<sub>2</sub> − w<sub>2u</sub> = −1,19 m/s (contrària a u): sobrecàrrega. A càrrega parcial c<sub>2u</sub> > 0."],
["2301",17,4,"Quin cabal real que passa per l’interior d’un rodet de turbina que gira a 900 rpm i genera un parell d’eix de 53051,65 Nm quan el salt brut és de 60 m, les pèrdues als conductes són de 2 m i té els següents rendiment: η<sub>hid</sub> = 0,93, η<sub>mec</sub> = 0,97, η<sub>vol</sub> = 0,95 i η<sub>elec</sub> = 0,98?",["9,74 m3/s","8,35 m3/s","7,95 m3/s","10,25 m3/s"],0,"H<sub>n</sub> = 60 − 2 = 58 m. P<sub>mec</sub> = τω = 53051,65·(900·2π/60) = 5,00 MW. Pel rodet: P<sub>mec</sub> = ρgQ<sub>rodet</sub>H<sub>n</sub>η<sub>h</sub>η<sub>m</sub> ⇒ Q<sub>rodet</sub> = 9,74 m³/s. 10,25 és el cabal del circuit (Q<sub>rodet</sub>/η<sub>v</sub>)."],
["2301",18,6,"En un ventilador axial amb diàmetre de punta 2,3 m i diàmetre de base 1,5 m que dona un cabal de 6500 m<sup>3</sup>/min quan gira a 950 rpm s’ha mesurat una velocitat absoluta a la sortida dels àleps de 85 m/s i un altura d’elevació teòrica de 500 m d’aire, quin increment de pressió estàtica dona aquest rodet? Nota: Suposar entrada axial a l’àlep",["2786 Pa","236 Pa","28459 Pa","0 Pa"],0,"c<sub>1</sub> = c<sub>m</sub> = (6500/60)/[π/4·(2,3²−1,5²)] = 45,37 m/s. Dinàmica: (c<sub>2</sub>²−c<sub>1</sub>²)/2g = 263 m. Estàtica = 500 − 263 = 237 m d’aire ⇒ Δp = 1,2·9,81·237 = 2786 Pa. 236 és l’altura en m, no Pa."],
["2301",19,2,"Sigui una bomba que aspira un cabal de 0,02 m<sup>3</sup>/s d'un dipòsit tancat de nivell constant d'aigua i que es troba instal·lada a una cota de 5 m per sobre la superfície lliure del dipòsit en un circuit amb les següents dades: Longitud canonada aspiració 30 m, coeficient de fricció 0,004, diàmetre canonada 0,1 m, pressió de vapor 2300 Pa, pressió atmosfèrica 1bar. Si la bomba te un NPSH disponible de 7 m, a quina pressió relativa es troba el dipòsit tancat?",["23911 Pa","99850 Pa","52148 Pa","1200 Pa"],0,"NPSH<sub>d</sub> = p<sub>0</sub>/ρg − h<sub>asp</sub> − 5 − p<sub>v</sub>/ρg = 7, amb h<sub>asp</sub> = 8fLQ²/(π²D⁵g) = 0,397 m. p<sub>0,abs</sub>/ρg = 12,63 m ⇒ p<sub>0,abs</sub> = 123 911 Pa ⇒ relativa = 23 911 Pa."],
["2301",20,1,"Es fa un assaig en un model a escala reduïda d'un ventilador de diàmetre 5 cm i es determina que el seu rendiment global val 0,85. Quina potencia consumeix el prototipus de diàmetre de 2 m quan impulsa 4000 m3/h d’aire i dona una altura d’elevació de 25 mcaigua? Nota: Considereu que el rendiment global segueix una relació d’escala del tipus (1-η<sub>p</sub>)/(1-η<sub>m</sub>) = (D<sub>m</sub>/D<sub>p</sub>)<sup>0.25</sup>",["290 kW","270 kW","310 kW","200 kW"],0,"1 − η<sub>p</sub> = (0,05/2)<sup>0,25</sup>·0,15 = 0,0596 ⇒ η<sub>p</sub> = 0,940. P<sub>hid</sub> = Q·Δp = (4000/3600)·(25·9810) = 272,5 kW. P<sub>cons</sub> = 272,5/0,940 = 290 kW. Sense corregir per escala (η = 0,85) sortirien 321 kW, i sense rendiment 272 kW."],

// ===== Final 14/06/23 (transcrit de la imatge; falten les preguntes 1 i 9 al PDF) =====
["2306",2,4,"Quin tipus de turbina està dissenyada amb una velocitat específica més baixa:",["Kaplan","Francis","Pelton","Axial"],2,"n<sub>s</sub> creix de Pelton (salt molt alt, cabal petit) a Francis i a Kaplan/axial (salt baix, cabal gran). La més baixa és la Pelton."],
["2306",3,6,"Una turbina Kaplan té un Dt=4m i Dh=2m. Amb quina inclinació β<sub>2</sub> s’ha de posar l’àlep per aconseguir un flux axial a la sortida (en la secció de punta) si sabem que la màquina gira a 120rpm i que el cabal que hi circula son 100m^3/s",["28.7º","22.7º","15.7º","18.7º"],1,"c<sub>m</sub> = 100/[π/4·(4²−2²)] = 10,61 m/s; u<sub>punta</sub> = π·120·4/60 = 25,1 m/s. Sortida axial (c<sub>2u</sub> = 0) ⇒ w<sub>2u</sub> = u ⇒ β<sub>2</sub> = atan(c<sub>m</sub>/u) ≈ 22,9°; l’opció oficial és 22,7°."],
["2306",4,4,"Quina potència màxima teòrica es pot extreure d’una instal·lació d’una turbina Pelton sense pèrdues que té un injector amb diàmetre 0.2m i la cota del dipòsit que alimenta la turbina està 800m per sobre:",["31 MW","15.5 MW","124 MW","80 MW"],0,"c<sub>raig</sub> = √(2g·800) = 125,3 m/s; Q = c·π·0,2²/4 = 3,94 m³/s; P = ρgQH = 9810·3,94·800 ≈ 31 MW. 15,5 MW surt de posar c²/2g a mitges."],
["2306",5,4,"Quina afirmació és certa en una turbina hidràulica",["La potència hidràulica és inferior a la potència elèctrica","El salt aprofitat es mes gran que el salt net","El salt net es superior al salt brut","El cabal que passa per la turbina es inferior al que passa pel circuit hidràulic"],3,"En turbina part del cabal fuga sense passar pel rodet: Q<sub>rodet</sub> = η<sub>v</sub>·Q<sub>circuit</sub> < Q<sub>circuit</sub>. Les altres inverteixen la cadena: P<sub>el</sub> < P<sub>hid</sub>, H<sub>aprofitat</sub> < H<sub>n</sub> < H<sub>b</sub>."],
["2306",6,2,"La seguent figura mostra la evolució de la pressió a l’entrada d’una bomba. Quina afirmació es certa?",["La bomba en qüestió té cavitació","La línia discontinua correspon a l’evolució de la pressió en la cara de pressió de l’àlep","Al punt 4 és on tenim màxim risc de cavitació.","El punt 1 correspon a la sortida de la bomba"],1,"A l’entrada de l’àlep la pressió cau fins a un mínim (punt 3) a la cara de succió (línia contínua); la discontínua, amb un mínim menys pronunciat, és la cara de pressió. El màxim risc és al mínim (3), no al 4; l’1 és l’entrada.","press"],
["2306",7,2,"Suposeu que una bomba en un banc d’assaig no té cavitació en una certa condició d’operació. Per tal d’investigar quan apareix la cavitació es va buidant el nivell del dipòsit inferior mantenint el cabal constant amb una vàlvula de regulació Quina afirmació és certa?",["Al disminuir el nivell del dipòsit no apareixerà mai cavitació.","El nivell del dipòsit no afecta a l’aparició de cavitació","Primer apareixerà cavitació incipient i si es continua buidant apareixerà cavitació desenvolupada.","Primer apareixerà cavitació desenvolupada i si es continua buidant apareixerà cavitació incipient."],2,"Buidar el dipòsit baixa NPSH<sub>d</sub>. Primer es creua l’NPSH d’incipient (més alt: apareixen bombolles) i després el de desenvolupada (cau un 3 % l’H). Per això NPSH<sub>inc</sub> > NPSH<sub>des</sub>."],
["2306",8,2,"Una bomba centrífuga té un NPSHreq=5m quan el cabal de funcionament en el circuit és Q=1m^3/s. Es volen canviar les canonades del circuit hidràulic amb un material amb f=0.02 tot mantenint el cabal.. Si Zdipòsit=100m, Zbomba=104m, longitud de canonada fins la bomba de 5000m, quin diàmetre mínim han de tenir les canonades per a no tenir cavitació a la bomba? Pvap=2300 Pa, Patm=90.000 Pa",["1m","2m","3m","La bomba tindrà cavitació en qualsevol cas"],3,"NPSH<sub>d</sub> = 90000/9810 − h<sub>L</sub> − 4 − 2300/9810 = 4,94 − h<sub>L</sub>. Encara que h<sub>L</sub> → 0 (diàmetre infinit), 4,94 < 5 = NPSH<sub>req</sub>: sempre cavita."],
["2306",10,3,"Una bomba centrífuga te una corba característica aproximada H=100-20*Q^2 (H en m i Q en m^3/s). El seu rendiment màxim és per Q=1.5m^3/s. Si el circuit resident te una diferència de cotes de 40m i unes pèrdues hidràuliques 40*Q^2, quin tipus de sistema de regulació es pot instal·lar per tal de que la bomba treballi en el seu màxim rendiment",["Vàlvula en by-pass","Vàlvula en sèrie a l’entrada","Vàlvula en sèrie a la sortida","No es pot aconseguir"],0,"Tall actual: 100 − 20Q² = 40 + 40Q² ⇒ Q = 1 m³/s < 1,5. Cal augmentar el cabal de la bomba: només ho fa el bypass. La vàlvula en sèrie el reduiria."],
["2306",11,3,"Si s’escull una vàlvula del tipus H<sub>v</sub> = Q<sub>v</sub><sup>2</sup>·20/α, amb quin grau d’obertura s’ha de posar la vàlvula en la opció triada?",["0.22","0.29","0.32","No hi ha cap grau d’obertura ja que no es pot aconseguir"],1,"H<sub>B</sub>(1,5) = 100 − 20·2,25 = 55 m. Circuit: 55 = 40 + 40Q<sub>c</sub>² ⇒ Q<sub>c</sub> = 0,612. Q<sub>v</sub> = 1,5 − 0,612 = 0,888. 55 = 20·0,888²/α ⇒ α = 0,29."],
["2306",12,5,"Tenim dues bombes de dimensions similars, girant a la mateixa velocitat i una d’elles te β<sub>2-alep</sub> superior respecte a l’altre bomba. Que es pot esperar d’aquesta bomba amb β<sub>2-alep</sub> gran?",["Tindrà menys prestacions que la bomba amb β<sub>2-alep</sub> petit","Tindrà els canals més llargs que la bomba amb β<sub>2-alep</sub> petit","Tindrà menys pèrdues per fricció a la carcassa ja que c<sub>2</sub> serà més baixa","Tindrà menys rendiment"],3,"Més β<sub>2</sub> ⇒ més c<sub>2u</sub> i c<sub>2</sub>: més prestacions però canals més curts, més energia cinètica a convertir i més pèrdues ⇒ menys rendiment. a), b) i c) són justament el contrari."],
["2306",13,5,"Quina afirmació és falsa sobre H<sub>th-∞aleps</sub> i H<sub>th-a.finits</sub>?",["H<sub>th-∞aleps</sub> > H<sub>th-a.finits</sub>","La diferència entre les dues és més petita quan la bomba treballa amb cabals grans","La diferència entre les dues és més petita si la bomba té més àleps","El rendiment hidràulic és defineix com H<sub>th-a.finits</sub>/H<sub>th-∞aleps</sub>"],3,"La falsa és d): η<sub>h</sub> = H<sub>real</sub>/H<sub>th</sub>; el quocient finits/infinits és el factor de desviació, que no és una pèrdua d’energia. Més àleps ⇒ menys desviació (c certa)."],
["2306",14,5,"Quina opció correspon a la trajectòria absoluta d’una partícula que passa per la següent bomba centrífuga?",["a","b","c","d"],0,"La trajectòria absoluta és la composició de w (seguint el canal) i u (gir): la partícula avança en el sentit de gir i surt cap a fora molt inclinada, com la corba a. La d és la relativa (segueix l’àlep).","traj"],
["2306",15,5,"Una bomba centrífuga gira a 600rpm i té un diàmetre de 1m a la sortida i una amplada de 0.2m. Amb quin angle β<sub>2</sub> (considerar β<sub>2</sub> <90º) disenyarieu la bomba per tal de que el cabal màxim teòric que passi per ella sigui 5m^3/s.?",["18.2º","16.2º","14.2º","20.2º"],2,"Q<sub>màx</sub> és quan H<sub>th</sub> = 0 ⇒ u<sub>2</sub> = c<sub>2m</sub>·cot β<sub>2</sub>. u<sub>2</sub> = 31,42 m/s; c<sub>2m</sub> = 5/(π·1·0,2) = 7,96 m/s ⇒ tan β<sub>2</sub> = 7,96/31,42 ⇒ β<sub>2</sub> = 14,2°."],
["2306",16,6,"Una bomba axial consta d’un àlep i una directriu a la sortida. Considereu 1, l’entrada de l’àlep, 2 la sortida de l’àlep i 3 la sortida de la directriu. Considereu que a 1 el flux entra sense prerotació i que la sortida a 3 es axial. Quina afirmació es certa",["c<sub>2</sub> < c<sub>1</sub>","w<sub>2</sub> > w<sub>1</sub>","u<sub>2</sub> = u<sub>1</sub>","c<sub>2u</sub> = 0"],2,"En una màquina axial, al mateix radi u<sub>1</sub> = u<sub>2</sub>. El rodet dona c<sub>2u</sub> > 0 (per això c<sub>2</sub> > c<sub>1</sub> i w<sub>2</sub> < w<sub>1</sub>) i la directriu el porta a c<sub>3u</sub> = 0."],
["2306",17,6,"Sobre la bomba anterior es coneix que gira a 300rpm i que el diàmetre mig és D<sub>mig</sub>=1.2m. Es coneix també que Dt=1.4m i Dh=1m i que per la bomba passa un cabal de 10m^3/s. Amb quin angle β<sub>2</sub> dissenyarieu l’àlep si es necessita que la bomba doni una altura teòrica de 10m.c.aigua (en el D<sub>mig</sub>)? Suposar que el flux surt sense desviació",["44.2º","48.2º","52.2º","40.2º"],0,"u = π·300·1,2/60 = 18,85 m/s. c<sub>2u</sub> = gH/u = 5,20 m/s. c<sub>m</sub> = 10/[π/4·(1,4²−1²)] = 13,26 m/s. w<sub>2u</sub> = u − c<sub>2u</sub> = 13,64 ⇒ β<sub>2</sub> = atan(13,26/13,64) = 44,2°."],
["2306",18,1,"Quina afirmació sobre una màquina receptora és sempre certa",["L’energia específica del fluid a l’entrada es superior a l’energia específica a la sortida","La pressió a l’entrada és inferior a la pressió a la sortida","La cota a l’entrada de la màquina es inferior que la cota a la sortida","Cap de les anteriors"],0,"Una receptora extreu energia del fluid: l’energia total (pressió + cinètica + cota) baixa entre entrada i sortida. Cap component per separat ha de complir res «sempre»."],
["2306",19,2,"Quina relació existeix entre la diferencia de cotes ( H<sub>o</sub> ) i la altura d’elevació de la bomba (H<sub>b</sub>) en un circuit de bombeig.",["H<sub>b</sub>=H<sub>o</sub>","H<sub>b</sub>>H<sub>o</sub>","H<sub>b</sub><H<sub>o</sub>","H<sub>b</sub> pot ser inferior, superior o igual a H<sub>o</sub> depenent de la cota a on instal·lem la bomba"],1,"Al punt de funcionament H<sub>b</sub> = H<sub>o</sub> + h<sub>f</sub> + h<sub>s</sub>, i amb Q > 0 les pèrdues són positives ⇒ H<sub>b</sub> > H<sub>o</sub>. La cota de la bomba afecta la cavitació, no aquest balanç."],
["2306",20,1,"Tenim dues bombes geomètricament semblants amb diàmetres significativament diferents i girant a la mateixa velocitat. Quina afirmació sobre les seves corbes característiques és certa.",["Les dues corbes característiques H−Q seran aproximadament iguals","En les coordenades ψ, φ les dues corbes seran aproximadament iguals","Si una de les bombes treballa en un circuit determinat amb H<sub>1</sub>, Q<sub>1</sub> llavors la bomba 2 treballarà, en aquell mateix circuit, en el punt H<sub>2</sub>=H<sub>1</sub>(D<sub>2</sub>/D<sub>1</sub>)<sup>2</sup>, Q<sub>2</sub>=Q<sub>1</sub>(D<sub>2</sub>/D<sub>1</sub>)<sup>3</sup>","Si una de les bombes treballa en un circuit determinat amb H<sub>1</sub>, Q<sub>1</sub> llavors la bomba 2 treballarà, en aquell mateix circuit, en el punt H<sub>2</sub>=H<sub>1</sub>(D<sub>2</sub>/D<sub>1</sub>)<sup>2</sup>, Q<sub>2</sub>=Q<sub>1</sub>(D<sub>1</sub>/D<sub>2</sub>)<sup>3</sup>"],1,"Màquines semblants comparteixen la corba adimensional ψ-φ. c) és la trampa clàssica: dona el punt homòleg, que NO és el punt de funcionament en el mateix circuit (cal tallar la nova corba amb el circuit)."],

["2307",1,1,"Quan es parla de ventiladors ens referim a:",["Turbomàquina generadora de flux incompressible","Turbomàquina generadora de flux compressible","Turbomàquina receptora de flux incompressible","Turbomàquina receptora de flux compressible"],0,"El ventilador dona energia a l’aire (generadora) a velocitat baixa (Ma < 0,3), de manera que la densitat és pràcticament constant: flux incompressible."],
["2307",2,4,"L’energia per unitat de pes que una turbina hidràulica pot teòricament extreure d’un fluid s’anomena:",["Salt net","Salt brut","Altura d’elevació","Cota piezomètrica"],0,"Salt net H<sub>n</sub> = salt brut − pèrdues del circuit: és l’energia per unitat de pes disponible entre l’entrada i la sortida de la turbina. L’altura d’elevació és el concepte equivalent en bombes."],
["2307",3,2,"La corba resistent d’un sistema de bombeig simple entre dos dipòsits oberts a l’atmosfera i sense pèrdues de carreges singulars es calcula com:",["Diferència de cotes entre superfícies lliures dels dipòsits + pèrdues per fricció a les canonades + pèrdues per difusió","Diferència de cotes entre bases dels dipòsits + pèrdues per fricció a les canonades+ pèrdues per difusió","Diferència de cotes entre superfícies lliures dels dipòsits + pèrdues per difusió","Diferència de cotes entre la base del dipòsit superior i la superfície lliure del dipòsit inferior+ pèrdues per fricció + pèrdues per difusió"],0,"H<sub>r</sub> = H<sub>o</sub> (entre superfícies lliures) + h<sub>f</sub> + c²/2g a la descàrrega. Les bases no compten (la pressió del fons compensa) i no es poden oblidar les pèrdues per fricció."],
["2307",4,1,"Quan s’aplica la semblança a les màquines hidràuliques s’observa que en els rangs de funcionament normals:",["Reynolds i rugositat relativa són constants","Reynolds i rugositat relativa no són constants","Coeficient de pressió i Reynolds són constant","Coeficient de pressió i coeficient de cabal són constants"],0,"Clau oficial: a). La idea és que en el rang normal l’efecte de Re i δ és pràcticament constant, i per això g(φ,ψ,λ,Re,δ) es redueix a ψ = g<sub>1</sub>(φ). φ i ψ varien al llarg de la corba."],
["2307",5,5,"Per tal de dissenyar correctament el difusor en una bomba centrífuga, en quina direcció del següents vectors l’orientaríeu:",["C a la sortida","W a la sortida","U a la sortida","W a l’entrada"],0,"El difusor és fix: el veu entrar la velocitat absoluta c<sub>2</sub>. Les directrius s’orienten amb α<sub>2</sub>. w és la velocitat que veuen els àleps del rodet."],
["2307",6,5,"En ventiladors centrífugs l’angle beta de sortida de l’àlep només pot tenir un rang:",["Des de valors inferiors a 90° fins a valors superiors a 90°","De valors inferiors a 90°","De valors superiors a 90°","De valors iguals a 90°"],0,"Els ventiladors centrífugs poden ser corbats enrere (β<sub>2</sub> < 90°), radials (90°) o corbats endavant (β<sub>2</sub> > 90°). En bombes, en canvi, gairebé sempre β<sub>2</sub> < 90°."],
["2307",7,3,"Sigui una bomba amb una corba característica en SI igual a (H=100-2000Q<sup>2</sup>). Si fabriquem una bomba geomètricament semblant que gira un 35% més lenta i que és un 13% més petita, calcula el cabal de funcionament si el circuit resistent on es fa funciona segueix l’equació en SI igual a (H=40+300Q<sup>2</sup>):",["No dona cap cabal","0,162 m3/s","0,224 m3/s","0,050 m3/s"],0,"n’/n = 0,65 i D’/D = 0,87 ⇒ k<sub>H</sub> = 0,65²·0,87² = 0,320. Altura a cabal nul de la nova bomba: 100·0,320 = 32 m < 40 m (H<sub>o</sub> del circuit). La bomba no arriba al dipòsit: Q = 0."],
["2307",8,6,"Sigui una bomba axial per on hi circula un cabal de 78 m3/h que té un rodet amb un diàmetre de cub de 45mm, un diàmetre de punta de 138 mm i que gira a 789 rpm. Es volen instal·lar-hi directrius fixes a la sortida. Calculeu l’angle d’entrada de les directrius més adient a un diàmetre de 93 mm si l’angle de sortida de l’àlep és de 43° i el fluid presenta una desviació de 7°.",["45,2°","22,9°","36,0°","90°"],0,"c<sub>m</sub> = (78/3600)/[π/4·(0,138²−0,045²)] = 1,62 m/s; u = π·789·0,093/60 = 3,84 m/s. β<sub>2f</sub> = 43 − 7 = 36° ⇒ w<sub>2u</sub> = 2,23 ⇒ c<sub>2u</sub> = 1,61 m/s. α<sub>2</sub> = atan(c<sub>m</sub>/c<sub>2u</sub>) = 45,2°. 36° és confondre directriu amb β<sub>2f</sub>."],
["2307",9,1,"Es disposa d’una bomba que impulsa un cabal d’aigua de 1250 m3/h i que presenta les següents dimensions i propietats mesurades: Diàmetre canonada aspiració 0,5 m, Diàmetre canonada d’impulsió 0,45 m, Cota entrada bomba 2 m, Cota sortida bomba 2,3 m, Pressió relativa entrada bomba -0.82 bar, Pressió relativa sortida bomba 11,6 bar. Calcula l’energia específica aportada al fluid.",["1245,8 m2/s2","127 m2/s2","693,7 m2/s","70,7 m2/s2"],0,"c<sub>1</sub> = 1,768 m/s, c<sub>2</sub> = 2,183 m/s. E = Δp/ρ + gΔz + Δc²/2 = (11,6+0,82)·10⁵/1000 + 9,81·0,3 + 0,82 = 1245,8 J/kg. 127 és l’altura en metres (E/g)."],
["2307",10,1,"Una màquina hidràulica te la corba característica en SI igual a (H=179-1598Q<sup>2</sup>). Si quan el cabal que hi circula és de 0,167 m3/s el rendiment és del 72%, calcula el rendiment aproximat pel punt homòleg en una màquina un 75% més gran i que gira un 30% més ràpid.",["76%","72%","54%","23%"],0,"Llei d’escala: (1−η<sub>p</sub>)/(1−η<sub>m</sub>) = (D<sub>m</sub>/D<sub>p</sub>)<sup>0,25</sup> = (1/1,75)<sup>0,25</sup> = 0,869 ⇒ 1 − η<sub>p</sub> = 0,243 ⇒ η<sub>p</sub> ≈ 76 %. La velocitat no hi entra; 72 % és oblidar l’efecte d’escala."],
["2307",11,1,"En una certa aplicació es vol mantenir la empenta axial d’una bomba en valors reduïts. Quin tipus de bomba escolliríeu?",["Multicel·lular","De doble entrada","Amb directrius a l’entrada","Rodet obert"],1,"El rodet de doble entrada és simètric: les dues entrades compensen l’empenta axial. A més equival a dues bombes en paral·lel (més cabal)."],
["2307",12,1,"Quina afirmació sobre les juntes es certa?",["Augmenten el rendiment mecànic de la bomba","Augmenten el rendiment hidràulic de la bomba","Augmenten el cabal que passa pel rodet","Augmenten el rendiment volumètric"],3,"Les juntes redueixen les fuites entre impulsió i aspiració ⇒ η<sub>v</sub> puja. De fet baixen una mica η<sub>m</sub> (fricció) i redueixen el cabal recirculat pel rodet."],
["2307",13,2,"En un laboratori, s’estan testejant les prestacions d’una bomba per cavitació. Per un cabal determinat es vol obtenir el NPSH<sub>req-desnvolupada</sub>. Quin criteri podríeu fer servir?",["Es pot determinar, mitjançant inspecció visual o acústica, quan comencen a aparèixer bombolles de cavitació.","Es pot determinar mirant només un manòmetre de pressió a l’entrada.","Es pot determinar mesurant l’altura d’elevació que està donant la bomba i observar quan aquesta es redueix un valor petit (al voltant de 3%) tot i mantenir-se constant el cabal.","No es pot determinar en un laboratori."],2,"Criteri estàndard de cavitació desenvolupada: caiguda del 3 % de l’H a cabal constant. a) és el criteri de cavitació incipient (aparició de bombolles)."],
["2307",14,2,"En un circuit la bomba instal·lada cavita i es decideix solucionar aquest problema. Quines mesures serien més efectives, sense canviar la bomba?",["Instal·lar una canonada nova amb més diàmetre i augmentar la cota de la bomba","Instal·lar una canonada nova amb més diàmetre i més rugosa","Escalfar el líquid","Pujar la cota del dipòsit inferior omplint-lo amb més aigua"],3,"Més nivell al dipòsit inferior ⇒ (z<sub>0</sub> − z<sub>1</sub>) puja ⇒ NPSH<sub>d</sub> puja. a) barreja una mesura bona i una de dolenta; b) més rugositat dona més pèrdues; c) escalfar puja p<sub>v</sub>."],
["2307",15,4,"Quina de les següents situacions representa millor el context energètic actual i futur?",["Amb l’increment de la energia solar i eòlica, la hidràulica deixarà de ser necessària.","S’incrementaran les energies fòssils, però no les renovables.","Es pretén funcionar només amb energia solar i eòlica ja que son altament predictibles.","La energia hidràulica ajuda a compensar la impredictibilitat de l’energia solar i eòlica."],3,"La hidràulica regula potència en segons (directrius) i amb el bombament reversible emmagatzema energia: compensa la variabilitat de solar i eòlica, que no són predictibles."],
["2307",16,4,"Que succeeix quan reduïm molt la potència produïda per una turbina Francis si ho comparem amb la situació a on la màquina treballa en condicions de disseny?",["No succeeix res en especial ja que la turbina està dissenyada per regular potència.","Una turbina Francis no pot treballar fora del punt de disseny.","Degut a la component tangencial de la velocitat a la sortida apareix una torxa estreta.","Degut a la component tangencial de la velocitat a la sortida apareix una torxa ampla amb prerotació."],3,"A càrrega parcial c<sub>2u</sub> > 0 (gira amb el rodet) i al tub d’aspiració apareix una torxa ampla amb rotació, causa de vibracions. La torxa estreta i centrada és de sobrecàrrega."],
["2307",17,4,"D’una central hidroelèctrica amb una turbina es coneix que la màquina produeix una energia anual de 292GWh funcionant un promig de 8h al dia i 365 dies. Si per la canonada que porta a la turbina hi circula un cabal promig de 10m3/s, quina màquina tenim instal·lada?",["Pelton","Francis","Kaplan","No es pot determinar amb les dades de l’enunciat"],0,"P<sub>el</sub> = 292·10⁹ Wh/(8·365 h) = 100 MW. Fins i tot amb η = 1: H = P/(ρgQ) = 10⁸/(9810·10) ≈ 1020 m; amb η realista, més de 1000 m. Salt tan gran ⇒ Pelton."],
["2307",18,5,"Una turbina Francis treballa en el seu punt de disseny quan genera una potència elèctrica de 45MW amb un salt de 100m. El rendiment del generador es 0.98 i el rendiment de la turbina 0.85. Es coneix que la secció de sortida es de 5m<sup>2</sup> i el diàmetre de sortida es 1m. Finalment es sap que la màquina te 10 parell de pols i genera a 50Hz (f<sub>rot</sub> = f<sub>elect</sub>/p). Si el flux no te desviació a la sortida, amb quin angle β han estat dissenyats els angles a la sortida?",["35º","30º","45º","50º"],0,"P<sub>hid</sub> = 45/(0,98·0,85) = 54 MW ⇒ Q = 54·10⁶/(9810·100) = 55 m³/s ⇒ c<sub>2</sub> = c<sub>2m</sub> = 55/5 = 11 m/s (disseny: c<sub>2u</sub> = 0). n = 50/10 = 5 rps ⇒ u<sub>2</sub> = π·1·5 = 15,7 m/s. β<sub>2</sub> = atan(11/15,7) = 35°."],
["2307",19,2,"Una bomba amb una corba característica H=130-0.2Q<sup>2</sup>, H en m i Q en l/s, es regula per subministrar un cabal de 20l/s en un determinat circuit de bombeig. La bomba té una corba NPSH, que en el rang de funcionament descrit es pot aproximar per NPSH<sub>r</sub> = K<sub>1</sub>·C<sub>1m</sub><sup>2</sup>/2g + K<sub>2</sub>·W<sub>1</sub><sup>2</sup>/2g. Amb K1=1 i K2=1. Si la bomba gira a 1500rpm amb un diametre d’entrada de 0.1m i una amplada de 0.02m, quin es el NPSHr de la bomba en aquesta situació?",["1.6 m","3.6m","7.6m","4.2m"],3,"c<sub>1m</sub> = 0,02/(π·0,1·0,02) = 3,18 m/s; u<sub>1</sub> = π·1500·0,1/60 = 7,85 m/s; sense prerotació w<sub>1</sub> = √(u<sub>1</sub>²+c<sub>1m</sub>²) = 8,47 m/s. NPSH<sub>r</sub> = (3,18² + 8,47²)/(2·9,81) = 4,2 m."],
["2307",20,2,"Suposem una bomba que treballa amb un NPSreq=6m quan el cabal que hi circula es de 15l/s. La bomba dona una altura de 80m. A quina cota màxima podem posar la bomba anterior si la canonada te un diàmetre de 0.2m, L<sub>asp</sub>=10m, L<sub>imp</sub>=2340m, i coeficient de fricció 0.03? Dades: P<sub>atm</sub>=100.350 Pa i P<sub>vap</sub>=2300 Pa, Z<sub>diposit</sub>=100m",["96m","186m","104m","100m"],2,"h<sub>asp</sub> = 8·0,03·10·0,015²/(π²·0,2⁵·9,81) = 0,017 m. 6 = 10,23 − 0,017 − (z<sub>B</sub> − 100) − 0,234 ⇒ z<sub>B</sub> ≈ 104 m. L<sub>imp</sub> i l’altura de 80 m no intervenen (són distractors)."]
];

["2401",2,1,"Quan extrapolem el rendiment de model a prototipus d’una bomba centrifuga sabem que:",["El rendiment és adimensional, per tant és el mateix en model i prototipus","S’han d’utilitzar els números adimensionals de cabal, pressió i potència","El rendiment del model sempre serà més petit que el del prototipus","El rendiment del prototipus sempre serà més petit que el del model"],2,"Efecte d’escala: el model (petit) té Re més baix i rugositat relativa més alta ⇒ més fricció relativa ⇒ rendiment menor. a) seria cert només en primera aproximació."],
["2401",3,5,"En una bomba centrifuga treballant per sota del cabal de disseny:",["Sempre hi ha prerotació a la entrada","L’angle d’incidència és positiu","L’angle d’incidència és negatiu","L’angle d’incidència no té influència"],1,"Menys cabal ⇒ menys c<sub>1m</sub> ⇒ β<sub>1f</sub> més petit que β<sub>1a</sub> ⇒ i = β<sub>1a</sub> − β<sub>1f</sub> > 0. La prerotació només apareix a cabals molt baixos, no «sempre»."],
["2401",4,6,"Una turbina Pelton de 2m de diàmetre gira a 500rpm. Quin hauria de ser teòricament el seu salt (menystenint pèrdues i suposant que el raig surt a 180º) per obtenir la màxima extracció d’energia del raig?",["430 m","558 m","700m","930m"],1,"Òptim ideal u = c/2. u = π·500·2/60 = 52,36 m/s ⇒ c = 104,72 m/s ⇒ H<sub>n</sub> = c²/2g = 558 m. 140 m sortiria d’usar u en comptes de c."],

["2401",6,5,"Per un rodet centrífug amb β<sub>2f</sub>=90º:",["L’alçada teòrica és independent del cabal","L’alçada teòrica és més gran per cabals per sota del cabal de disseny","L’alçada teòrica és més petita per cabals per sota del cabal de disseny","L’alçada teòrica és independent de la velocitat de rotació"],0,"H<sub>th</sub> = u<sub>2</sub>²/g − u<sub>2</sub>·cot β<sub>2f</sub>·Q/(πD<sub>2</sub>b<sub>2</sub>g). Amb β<sub>2f</sub> = 90°, cot = 0: H<sub>th</sub> = u<sub>2</sub>²/g, recta horitzontal. Sí depèn de n (via u<sub>2</sub>)."],
["2401",7,6,"La configuració de la imatge representa un rodet axial amb directriu a la entrada. Quina de les afirmacions és certa:",["Permet que la velocitat absoluta a la sortida sigui axial","La velocitat absoluta a la entrada del rodet és axial","La fricció sobre l’àlep del rodet és més petita que en altres configuracions de directrius","La velocitat relativa a la sortida és més gran que a la entrada"],2,"Clau oficial: c). La directriu d’entrada dona prerotació en el sentit de gir, de manera que w (velocitat vista per l’àlep) és més petita i hi ha menys fricció. Amb aquesta configuració c<sub>1</sub> no és axial.","axdir2"],
["2401",8,6,"El rodet de la figura (el flux entra cap al full):",["És un rodet axial i gira en sentit horari","És un rodet centrífug i gira en sentit horari","És un rodet axial i gira en sentit antihorari","És un rodet centrífug i gira en sentit antihorari"],2,"Pales radials amb el flux travessant el pla del rodet: axial. Amb el flux entrant cap al full, la inclinació de les pales de la figura indica gir antihorari (clau oficial).","rotor"],
["2401",9,1,"Quina bomba és ideal per impulsar aigua a un desnivell de 1000m?",["Bomba axial","Bomba centrífuga de doble entrada","Bomba centrífuga multicel·lular","Bomba centrífuga amb inductor a la entrada"],2,"Altura molt gran ⇒ diversos rodets en sèrie al mateix eix (multicel·lular). La doble entrada serveix per a més cabal i menys empenta axial; l’axial és per a altures baixes."],
["2401",10,4,"Una turbina Francis genera 30MW de potència i el seu salt net es de 100m. Suposant el rendiment de la turbina 0.9 i del generador de 0.96, quin cabal (m^3/s) passa per les canonades? (densitat=1000 kg/m3)",["30.58 m3/s","31.86 m3/s","35.39 m3/s","Cal el rendiment volumètric"],2,"P<sub>hid</sub> = 30/(0,9·0,96) = 34,72 MW ⇒ Q = P<sub>hid</sub>/(ρgH<sub>n</sub>) = 35,39 m³/s. η<sub>v</sub> ja és dins η<sub>turbina</sub>. 30,58 surt de no dividir pels rendiments."],
["2401",11,1,"En una bomba centrífuga amb rendiment volumètric de 0.98:",["El cabal que passa pel rodet és més gran que el cabal que passa pel circuit","El cabal que passa pel rodet és més petit que el cabal que passa pel circuit","El cabal que passa pel rodet és igual que el cabal que passa pel circuit","L’altura d’elevació real es 0.98 vegades la teòrica"],0,"En bomba η<sub>v</sub> = Q/Q<sub>th</sub>: el rodet mou també el cabal que recircula per les fuites ⇒ Q<sub>rodet</sub> > Q<sub>circuit</sub>. d) és la definició de η<sub>h</sub>, no de η<sub>v</sub>. En turbina és al revés."],
["2401",12,3,"Una bomba centrífuga impulsa aigua des d’un dipòsit inferior a un superior amb una diferència de cotes de 100m. En la situació actual, la bomba funciona amb un cabal Q determinat. Es vol reduir el cabal que passa per la bomba a la meitat sense augmentar l’alçada que dona la bomba. Com es podria fer?",["Regulant amb una vàlvula en sèrie amb la bomba a la impulsió d’aquesta","Regulant amb una vàlvula en sèrie amb la bomba a la aspiració d’aquesta","Regulant amb una vàlvula en paral·lel amb la bomba","Variant la velocitat de rotació de la bomba"],3,"La vàlvula en sèrie redueix Q però puja l’H de la bomba (sobre la corba); el bypass augmenta el cabal de la bomba. Baixant n la corba baixa i el nou tall té menys Q i menys H."],
["2401",13,2,"On és més habitual patir cavitació en una bomba centrífuga",["A la entrada i cara de succió","A la sortida i cara de succió","A la entrada i cara de pressió","A la sortida i cara de pressió"],0,"El mínim de pressió és a l’entrada de l’àlep, a la cara de succió (on el flux s’accelera). A la sortida la pressió ja és alta."],
["2401",14,5,"Quina afirmació és certa del ventilador d’àleps corbats cap endavant de la figura?",["Gira en sentit antihorari i té millor prestacions que si els àleps estiguessin corbats cap endarrere","Gira en sentit horari i té millor prestacions que si els àleps estiguessin corbats cap endarrere","Gira en sentit antihorari i té pitjor prestacions que si els àleps estiguessin corbats cap endarrere","Gira en sentit horari i té pitjor prestacions que si els àleps estiguessin corbats cap endarrere"],1,"Corbats endavant: la punta de l’àlep apunta en el sentit de gir (horari a la figura) i donen més prestacions (més c<sub>2u</sub>) que els corbats enrere, a canvi de menys rendiment.","vent2"],
["2401",15,4,"En una turbina Pelton es pot regular el cabal:",["Obrint i tancant les directrius","Obrint i tancant els àleps del rodet","Obrint i tancant el injector","Variant la velocitat de rotació"],2,"La Pelton regula amb l’agulla de l’injector (secció del raig). Directrius: Francis i Kaplan; àleps orientables: Kaplan. La velocitat és fixa (síncrona)."],
["2401",16,6,"En una turbina Kaplan és cert que (punta és a radi exterior i base al radi interior)",["β<sub>1f-punta</sub> < β<sub>1f-base</sub>","β<sub>1f-punta</sub> >β<sub>1f-base</sub>","β<sub>1f-punta</sub> =β<sub>1f-base</sub>","β<sub>1f-punta</sub> =β<sub>2f-punta</sub>"],0,"c<sub>m</sub> és igual a tots els radis però u = ωr creix cap a la punta ⇒ l’angle (mesurat respecte a u) és més petit a la punta. Per això l’àlep està torçat."],
["2401",17,7,"La potència mecànica extreta en un aerogenerador depèn:",["Linealment de la velocitat del vent","De la velocitat del vent al quadrat","De la velocitat del vent al cub","De la velocitat del vent elevada a quatre"],2,"P<sub>mec</sub> = C<sub>p</sub>·½ρAc<sub>1</sub>³: el cabal màssic és ∝ c i l’energia cinètica ∝ c²."],
["2401",18,5,"Una bomba centrífuga gira a 600rpm i te un diàmetre de sortida de 2m. El cabal de disseny és 18.83 m3/s i l’amplada de sortida del rodet son 0.2m. Si volem que la bomba doni una altura teòrica de 100m en aquestes condicions, amb quin angle dissenyaríeu els àleps del rodet a la sortida?",["14º","26º","18º","22º"],2,"u<sub>2</sub> = 62,83 m/s; c<sub>2u</sub> = 100·9,81/62,83 = 15,61 m/s; c<sub>2m</sub> = 18,83/(π·2·0,2) = 14,98 m/s. tan β<sub>2f</sub> = c<sub>2m</sub>/(u<sub>2</sub>−c<sub>2u</sub>) ⇒ β<sub>2f</sub> ≈ 18°."],
["2401",19,5,"Si es col·loca un difusor a la sortida de la bomba, amb quin angle han d’estar orientades les directrius?",["44º","40º","36º","84º"],0,"Les directrius del difusor segueixen c<sub>2</sub>: tan α<sub>2</sub> = c<sub>2m</sub>/c<sub>2u</sub> = 14,98/15,61 ⇒ α<sub>2</sub> ≈ 44°. 18° (β) seria orientar-les amb w."],
["2401",20,5,"Si el diàmetre a l’entrada es 1m i l’amplada 0.3m amb quin angle dissenyaríeu els àleps a l’entrada?",["42º","38º","22.5º","32.5º"],3,"Entrada radial: c<sub>1m</sub> = 18,83/(π·1·0,3) = 19,98 m/s; u<sub>1</sub> = π·600·1/60 = 31,42 m/s; tan β<sub>1</sub> = 19,98/31,42 ⇒ β<sub>1</sub> = 32,5°."],
